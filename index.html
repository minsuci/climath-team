<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한민수의 대시보드</title>
<!--
  한민수의 대시보드 — 수업관리 앱(climath-class)과 별개의 앱.
  관리자 한 사람만 쓰는 화면이라 빌드도 React도 없다. 순수 JS로 그린다.

  Firebase 프로젝트를 둘 쓴다:
    climath-class (기본 앱)  — 수업관리 앱의 DB. **읽기만 한다.**
        teachers / classes / students / appConfig.examTerm / appConfig.schoolTerms
        classes/{cid}/exams / classes/{cid}/days/{date}/scores
    climath-team  ("team" 앱) — 대시보드 자기 것. dash/tasks(팀 할 일) · dash/config(연동 시트)
  로그인은 /api/auth 가 수업관리 앱의 로그인 API로 PIN을 확인한 뒤 두 프로젝트의 토큰을 함께 준다.
  구글시트는 /api/sheets 가 climath-team 서비스 계정으로 읽는다.
-->
<style>
  :root {
    --navy: #1b2a4a; --navy2: #24375f; --orange: #f08a24; --bg: #f3f5f9; --card: #fff;
    --line: #e3e7ee; --text: #1f2937; --muted: #6b7280; --red: #d94848; --green: #2f9e5f;
    --yellow: #f2c94c; --blue: #3b6fd9;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  a { color: var(--blue); text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; }
  .top { background: linear-gradient(90deg, var(--navy), var(--navy2)); color: #fff;
    padding: 12px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .top h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .top h1 b { color: var(--orange); }
  .top .date { opacity: .85; font-size: 13px; }
  .top .sp { flex: 1; }
  .top a, .top button.link { color: #fff; opacity: .9; font-size: 13px; background: none;
    border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: 4px 10px; }
  .top a:hover, .top button.link:hover { opacity: 1; background: rgba(255,255,255,.1); }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 14px; }
  .grid { display: block; }
  .nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
  .nav button { font: inherit; font-size: 14px; padding: 7px 14px; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; color: var(--text); }
  .nav button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .nav button .b { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px;
    font-size: 11px; background: #eef1f6; color: #374151; }
  .nav button.on .b { background: rgba(255,255,255,.2); color: #fff; }
  .nav button .b.red { background: #fde8e8; color: #b42318; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .card h2 .n { font-weight: 400; color: var(--muted); font-size: 12px; }
  .card h2 .sp { flex: 1; }
  .card h2 button, .mini { font-size: 12px; padding: 3px 9px; border: 1px solid var(--line);
    background: #fff; border-radius: 6px; color: var(--text); }
  .card h2 button:hover, .mini:hover { background: #f5f7fb; }
  .mini.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .mini.warn { border-color: var(--orange); color: #b35d00; }
  .stat { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .stat div { background: #f7f8fb; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; min-width: 84px; }
  .stat b { display: block; font-size: 20px; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat .bad b { color: var(--red); }
  .stat .good b { color: var(--green); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 5px 7px; text-align: left;
    vertical-align: top; white-space: nowrap; }
  th { background: #f7f8fb; font-weight: 600; color: #374151; position: sticky; top: 0; }
  td.wrapc { white-space: normal; }
  .tbl { overflow: auto; max-height: calc(100vh - 330px); min-height: 120px; border: 1px solid var(--line); border-radius: 8px; }
  .tbl.tall { max-height: calc(100vh - 330px); }
  .muted { color: var(--muted); }
  .red { color: var(--red); } .green { color: var(--green); } .orange { color: #b35d00; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
    background: #eef1f6; color: #374151; margin-right: 3px; }
  .pill.red { background: #fde8e8; color: #b42318; }
  .pill.green { background: #e3f5ea; color: #1f7a45; }
  .pill.yellow { background: #fff4d6; color: #8a5a00; }
  .pill.blue { background: #e4ecfb; color: #234e9e; }
  /* 반별 배치표 — 열 하나가 반 */
  .gridwrap { overflow: auto; max-height: calc(100vh - 300px); border: 1px solid var(--line); border-radius: 8px; }
  table.cgrid { border-collapse: separate; border-spacing: 0; width: auto; font-size: 12px; }
  table.cgrid th, table.cgrid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 3px 6px; white-space: nowrap; vertical-align: middle; }
  table.cgrid thead th { position: sticky; top: 0; z-index: 2; background: #eef1f6; text-align: center;
    min-width: 104px; max-width: 150px; padding: 5px 7px; }
  table.cgrid thead th.mine { background: #dce6f8; box-shadow: inset 0 3px 0 var(--navy); }
  table.cgrid .cn { font-weight: 700; white-space: normal; line-height: 1.25; }
  table.cgrid .cm { font-weight: 400; color: var(--muted); font-size: 11px; }
  table.cgrid .cnt { font-weight: 700; color: var(--text); }
  table.cgrid .cnt.red { color: var(--red); } table.cgrid .cnt.orange { color: #b35d00; }
  table.cgrid th.rn { position: sticky; left: 0; z-index: 3; background: #f7f8fb; color: var(--muted);
    text-align: right; min-width: 30px; font-weight: 400; }
  table.cgrid thead th.rn { z-index: 4; }
  table.cgrid td { background: #fff; }
  table.cgrid td.dim { opacity: .22; }
  table.cgrid .nm { display: inline-block; padding: 1px 6px; border-radius: 4px; }
  table.cgrid .nm i { font-style: normal; opacity: .65; margin-left: 2px; font-size: 11px; }

  /* 명단 편집 시트 */
  table.sheet-t td { padding: 2px 4px; }
  table.sheet-t input[type=text], table.sheet-t select { width: 100%; border: 1px solid transparent; background: transparent;
    border-radius: 4px; padding: 3px 5px; font: inherit; font-size: 13px; color: inherit; }
  table.sheet-t input[type=text]:hover, table.sheet-t select:hover { border-color: var(--line); background: #fff; }
  table.sheet-t input[type=text]:focus, table.sheet-t select:focus { border-color: var(--navy); background: #fff; outline: none; }
  table.sheet-t input.ok, table.sheet-t select.ok { background: #e3f5ea; border-color: #2f9e5f; }
  table.sheet-t input.bad, table.sheet-t select.bad { background: #fde8e8; border-color: var(--red); }
  table.sheet-t .cls-btn { max-width: 180px; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  table.sheet-t tr.clsrow td { background: #f7f8fb; white-space: normal; }
  table.sheet-t tr.newrow input { border: 1px dashed var(--line); background: #fff; }
  table.sheet-t tr.jump td { box-shadow: inset 0 0 0 2px var(--orange); }
  table.cgrid .nm.ghost { background: #fde8e8; color: #b42318; text-decoration: line-through;
    outline: 1px dashed #d94848; }
  table.cgrid .nm[data-open] { cursor: pointer; }
  table.cgrid .nm[data-open]:hover { outline: 2px solid var(--navy); }

  /* 학년 색 — 표 줄과 알약이 같은 색 */
  tr.g0 td { background: #eaf3ff; }  .pill.g0, .nm.g0 { background: #cfe2ff; color: #1d4f9c; }   /* 중3 파랑 */
  tr.g1 td { background: #eaf8ee; }  .pill.g1, .nm.g1 { background: #cdeed7; color: #1f6b3a; }   /* 고1 초록 */
  tr.g2 td { background: #fff7e3; }  .pill.g2, .nm.g2 { background: #ffe7a8; color: #7a5200; }   /* 고2 노랑 */
  tr.g3 td { background: #fdecf1; }  .pill.g3, .nm.g3 { background: #f9cfdb; color: #9b2246; }   /* 고3 분홍 */
  tr.g9 td { background: #f3f4f6; }  .pill.g9, .nm.g9 { background: #e5e7eb; color: #4b5563; }   /* 학년 없음 */
  .chips input.mini { padding: 3px 8px; }
  .bar { height: 8px; background: #eef1f6; border-radius: 4px; overflow: hidden; min-width: 80px; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .bar.low i { background: var(--red); } .bar.mid i { background: var(--orange); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .row input[type=text], .row input[type=date], .row select, .row textarea {
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .row input[type=text] { flex: 1; min-width: 140px; }
  .btn { background: var(--navy); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; }
  .btn.o { background: var(--orange); }
  .btn.g { background: #fff; color: var(--text); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  .task { display: flex; gap: 8px; align-items: flex-start; padding: 6px 4px;
    border-bottom: 1px solid var(--line); }
  .task:last-child { border-bottom: 0; }
  .task input[type=checkbox] { margin-top: 3px; }
  .task .t { flex: 1; min-width: 0; }
  .task .t.done { text-decoration: line-through; color: var(--muted); }
  .task .m { font-size: 12px; color: var(--muted); }
  .task .m .over { color: var(--red); font-weight: 600; }
  .task .m .soon { color: #b35d00; font-weight: 600; }
  .task .x { color: var(--muted); background: none; border: 0; font-size: 14px; padding: 0 4px; }
  .task .x:hover { color: var(--red); }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .banner { background: #fff4d6; border: 1px solid #f2c94c; border-radius: 8px; padding: 10px 14px;
    margin-bottom: 14px; }
  .banner pre { background: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 8px;
    font-size: 12px; overflow: auto; margin: 6px 0 0; }
  .err { color: var(--red); font-size: 13px; margin: 6px 0; white-space: pre-wrap; }
  .login { max-width: 380px; margin: 60px auto; }
  .login select, .login input { width: 100%; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 10px; }
  .login .btn { width: 100%; padding: 10px; }
  .empty { color: var(--muted); padding: 12px 4px; }
  .sheet { margin-top: 10px; }
  .sheet h3 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sheet h3 .sp { flex: 1; }
  .sheet .tbl { max-height: calc(100vh - 360px); }
  .sheet td, .sheet th { max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin: 6px 0; }
  @media (max-width: 760px) {
    .nav button { padding: 6px 10px; font-size: 13px; }
    .wrap { padding: 8px; }
    .card { padding: 12px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
"use strict";
// ---------- 기본 ----------
var firebaseConfig = {
  apiKey: "AIzaSyBIhpjPGsA1tH9AFspHtNifeeHUnhN0XUA",
  authDomain: "climath-class.firebaseapp.com",
  projectId: "climath-class",
  storageBucket: "climath-class.firebasestorage.app",
  messagingSenderId: "321968656061",
  appId: "1:321968656061:web:29d98c125c7480d44371d4"
};
var teamConfig = {
  apiKey: "AIzaSyCbxX46XDur_qL91rjicKjqhpCY2Lqem88",
  authDomain: "climath-team.firebaseapp.com",
  projectId: "climath-team",
  storageBucket: "climath-team.firebasestorage.app",
  messagingSenderId: "590208483967",
  appId: "1:590208483967:web:2c2f7e529482df03aab54a"
};
firebase.initializeApp(firebaseConfig);                       // 수업관리 앱 DB — 읽기만
var teamApp = firebase.initializeApp(teamConfig, "team");     // 대시보드 DB — 할 일·시트 목록
var db = firebase.firestore();
var tdb = firebase.firestore(teamApp);
var teamAuth = firebase.auth(teamApp);
function dashDoc(name) { return tdb.collection("dash").doc(name); }
async function signOutAll() { try { await teamAuth.signOut(); } catch (e) {} try { await firebase.auth().signOut(); } catch (e) {} }

var $ = function (s, el) { return (el || document).querySelector(s); };
var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
var TODAY = ymd(new Date());
var DOW = ["일", "월", "화", "수", "목", "금", "토"];
function parseYmd(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function fmtMD(s) { var d = parseYmd(s); return d ? (d.getMonth() + 1) + "/" + d.getDate() + "(" + DOW[d.getDay()] + ")" : (s || ""); }
function daysFromToday(s) { var d = parseYmd(s); if (!d) return null; return Math.round((d - parseYmd(TODAY)) / 864e5); }
function dday(s) { var n = daysFromToday(s); if (n === null) return ""; return n === 0 ? "오늘" : n > 0 ? "D-" + n : "D+" + (-n); }
function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function isEnded(r) { return !!(r && r.endDate && TODAY > r.endDate); }
function activeClass(c) { return !(c.endDate && TODAY > c.endDate); }
var GRADES = ["중3", "고1", "고2", "고3"];
var gradeRank = function (g) { var i = GRADES.indexOf(g); return i < 0 ? 99 : i; };

// ---------- 상태 ----------
var S = {
  claims: null, teachers: [], classes: [], students: [], term: "", schoolTerms: {},
  exams: {},      // cid -> { sid -> doc }
  scores: {},     // cid -> [ {date, ...score} ]
  tasks: [], config: { sheets: [] }, teamOk: true, teamErr: "",
  filterWho: "", stFilter: "", stQuery: "", stView: "grid", stOpen: "", stJump: "", byPid: {}, notes: {},
  showDone: false, saEmail: "",
  sheetData: {},  // sheetId -> { meta, tab, values, err, q }
  sheetPick: "",  // 구글시트 페이지에서 지금 보는 시트
};

async function authApi(body) {
  var r = await fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  var j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ("요청 실패 (" + r.status + ")"));
  return j || {};
}
async function sheetsApi(body) {
  var u = teamAuth.currentUser;
  if (!u) throw new Error("로그인이 필요합니다");
  var idToken = await u.getIdToken();
  var r = await fetch("/api/sheets", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ idToken: idToken }, body)) });
  var j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ("요청 실패 (" + r.status + ")"));
  return j || {};
}

// ---------- 로그인 ----------
var root = $("#root");
// 로그인에 실패한 이유. 실패 직후 signOut 이 onAuthStateChanged 를 깨워 renderLogin 이
// 한 번 더 돌기 때문에, 인자로만 넘기면 메시지가 지워진다. 다음 시도 때 비운다.
var LOGIN_ERR = "";
function renderLogin(msg) {
  root.innerHTML =
    '<div class="top"><h1>한민수의 <b>대시보드</b></h1><span class="date">' + fmtMD(TODAY) + '</span></div>' +
    '<div class="wrap"><div class="card login"><h2>선생님 로그인</h2>' +
    '<select id="lg-t"><option value="">불러오는 중...</option></select>' +
    '<input id="lg-p" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password">' +
    '<button class="btn" id="lg-go">들어가기</button>' +
    '<div class="err" id="lg-err">' + esc(msg || LOGIN_ERR || "") + '</div>' +
    '<p class="muted" style="font-size:12px">수업관리 앱과 같은 계정이다. 관리자만 들어올 수 있다.</p></div></div>';
  authApi({ action: "teachers" }).then(function (r) {
    var ts = (r.teachers || []).filter(function (t) { return t.status !== "pending"; });
    $("#lg-t").innerHTML = ts.map(function (t) {
      return '<option value="' + esc(t.tid) + '"' + (t.role === "owner" ? " selected" : "") + '>' + esc(t.name) + (t.role === "owner" ? " (관리자)" : "") + '</option>';
    }).join("");
  }).catch(function (e) { $("#lg-err").textContent = e.message; });
  var go = async function () {
    var tid = $("#lg-t").value, pin = $("#lg-p").value;
    if (!pin) { $("#lg-err").textContent = "PIN을 넣어주세요"; return; }
    LOGIN_ERR = ""; $("#lg-err").textContent = "";
    var btn = $("#lg-go"); btn.disabled = true; btn.textContent = "확인 중...";
    // 프로젝트 둘에 차례로 로그인한다. 그 사이 boot()이 돌면 "한쪽만 로그인됨"으로 보고
    // 방금 된 로그인을 도로 끊는다. 끝날 때까지 막아둔다.
    LOGGING_IN = true;
    try {
      var r = await authApi({ action: "login", tid: tid, pin: pin });
      await firebase.auth().signInWithCustomToken(r.classToken);
      await teamAuth.signInWithCustomToken(r.teamToken);
      LOGGING_IN = false;
      await boot();
    } catch (e) {
      LOGGING_IN = false;
      LOGIN_ERR = loginHint(e);
      try { await signOutAll(); } catch (x) {}
      renderLogin();
    }
  };
  $("#lg-go").onclick = go;
  $("#lg-p").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
}

// 파이어베이스 오류 코드를 "그래서 뭘 하면 되는지"로. 코드만 보고는 알 수가 없다.
function loginHint(e) {
  var c = (e && e.code) || "", m = (e && e.message) || String(e);
  if (/configuration-not-found/.test(c + m))
    return "climath-team 프로젝트에 Authentication이 아직 켜지지 않았습니다.\n" +
      "Firebase 콘솔 → climath-team → Authentication → 시작하기 를 누르면 됩니다 (로그인 방법은 켜지 않아도 됩니다).";
  if (/invalid-custom-token|custom token format/.test(c + m))
    return "대시보드 서버가 만든 토큰을 파이어베이스가 거절했습니다.\n" +
      "Vercel 환경변수 TEAM_SERVICE_ACCOUNT 가 climath-team 프로젝트의 키가 맞는지 확인해 주세요.";
  if (/network|Failed to fetch/i.test(m)) return "네트워크에 닿지 않았습니다. 잠시 뒤 다시 해주세요.";
  return m;
}

async function boot() {
  var u = firebase.auth().currentUser, tu = teamAuth.currentUser;
  if (!u || !tu) { if (u || tu) await signOutAll(); renderLogin(); return; }
  var tr = await u.getIdTokenResult();
  var c = tr.claims || {};
  if (c.role !== "owner") {
    await signOutAll();
    renderLogin("관리자 계정만 들어올 수 있습니다 (" + (c.role || "역할 없음") + ")");
    return;
  }
  S.claims = c;
  renderShell();
  await loadCore();
  renderAll();

// 볼트 「할 일 추적」 표 → 항목. 셀 순서는 할 일 | 담당 | 기한 | 출처 | 상태 (완료 표는 마지막이 완료일).
function importMarkdown(md) {
  var n = 0, have = {};
  S.tasks.forEach(function (t) { have[t.text] = 1; });
  md.split(/\r?\n/).forEach(function (line) {
    if (!/^\s*\|/.test(line)) return;
    var cells = line.split("|").slice(1, -1).map(function (c) { return c.replace(/\[\[|\]\]|\*\*/g, "").trim(); });
    if (cells.length < 3) return;
    if (/^-+$/.test(cells[0]) || cells[0] === "할 일") return;
    var text = cells[0]; if (!text || have[text]) return;
    var st = cells[4] || "";
    var status = /완료|^\d{4}-/.test(st) ? "done" : /진행/.test(st) ? "doing" : /보류/.test(st) ? "hold" : "open";
    S.tasks.push({ id: newId(), text: text, who: cells[1] || "", due: parseDueText(cells[2] || ""), dueText: cells[2] || "",
      src: cells[3] || "", status: status, created: TODAY, done: status === "done" ? (/^\d{4}-/.test(st) ? st.slice(0, 10) : TODAY) : "" });
    have[text] = 1; n++;
  });
  return n;
}
// "9/4 (목)" · "~9/11" · "9/4~5" 같은 글을 날짜로. 못 읽으면 글자를 그대로 둔다.
function parseDueText(s) {
  var m = /(\d{1,2})\s*\/\s*(\d{1,2})/.exec(s);
  if (!m) return s;
  var y = new Date().getFullYear(); var mo = +m[1], d = +m[2];
  // 12월에 1월 기한이면 다음 해
  if (mo < new Date().getMonth() + 1 - 6) y += 1;
  return y + "-" + pad2(mo) + "-" + pad2(d);
}

// 누가 어느 반에 흩어져 있는지가 배치표의 쓸모라 자리를 비우면 안 된다.
function stHit(name, grade, school, teacher, cls) {
  var f = S.stFilter || "", q = (S.stQuery || "").trim();
  if (f === "none") { if (grade && GRADES.indexOf(grade) >= 0) return false; }
  else if (f === "un") { if (cls !== "") return false; }
  else if (f && grade !== f) return false;
  if (q && [name, grade, school, teacher, cls].join(" ").indexOf(q) < 0) return false;
  return true;
}

  var maxN = cols.reduce(function (m, x) { return Math.max(m, x.studs.length); }, 0);
  // 어느 반에도 없는 학생은 맨 오른쪽에 한 열로 모은다. 안 그러면 배치표에서 통째로 사라진다.
  var loose = S.students.filter(function (x) { return !assignedNames(x, cols); });
  if (loose.length) { cols.push({ c: { id: "_loose", name: "반 미배정", classDays: [] }, studs: loose.map(looseRow), t: "", mine: false, loose: true }); maxN = Math.max(maxN, loose.length); }

      '<div class="cm">' + cnt + '명</div></th>';
  }).join("");

  var body = "";
  for (var i = 0; i < maxN; i++) {
    body += '<tr><th class="rn">' + (i + 1) + '</th>' + cols.map(function (x) {
      var r = x.studs[i];
      if (!r) return '<td></td>';
      var g = gradeOf(r), sch = schoolOf(r);
      var hit = stHit(r.name, g, sch, x.t, x.loose ? "" : x.c.name);
      var ghost = !!(r.pid && !S.byPid[r.pid]);   // 사람이 지워졌는데 반에 남은 것
      return '<td class="' + (hit ? "" : "dim") + '" title="' +
        esc(ghost ? r.name + " — 사람 정보가 지워졌다. 명단 편집에서 반 명단에서 빼면 된다"
                  : [r.name, g, sch, x.t ? "담당 " + x.t : ""].filter(Boolean).join(" · ") + " — 눌러서 고치기") + '">' +
        '<span class="nm ' + (ghost ? "ghost" : gradeCls(g)) + '"' + (r.pid && !ghost ? ' data-open="' + esc(r.pid) + '"' : "") + '>' +
        esc(r.name) + (ghost ? "" : (GRADE_NUM[g] ? '<i>' + GRADE_NUM[g] + '</i>' : "")) + '</span></td>';
    }).join("") + '</tr>';
  }
  return '<div class="gridwrap"><table class="cgrid"><thead><tr><th class="rn">#</th>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
    '<p class="muted" style="font-size:12px;margin:6px 0 0">이름 옆 숫자는 학년(중3=9 · 고1=10 · 고2=11 · 고3=12). ' +
    '인원이 <span class="orange">주황</span>이면 5명 이하, <span class="red">빨강</span>이면 0명이다. 파란 머리는 내가 담당인 반.</p>';
}

// 화면을 통째로 다시 그리면 표의 스크롤 상자가 새로 만들어져 **맨 위로 돌아간다.**

function bindClsRow(el, assigned) {

function bindEdit(el, assigned) {
  var flash = function (node) { node.classList.add("ok"); setTimeout(function () { node.classList.remove("ok"); }, 900); };
  var fail = function (node, e) { node.classList.add("bad"); alert("저장하지 못했다: " + ((e && e.message) || e)); };
  // 값 고치기 — **다시 그리지 않는다.** 표를 다시 그리면 치던 칸에서 포커스가 날아간다.

      try {

        else { var patch = {}; patch[f] = v; await stSave(pid, patch); }
        flash(inp);
        if (f === "grade" || f === "homeroom") keepScroll(renderStudents);
      } catch (e) { fail(inp, e); }

  });
  // 반 고르는 줄은 **끼워 넣고 빼기만** 한다. 다시 그리면 그 자리에서 스크롤이 튄다.

        "되돌리려면 다시 만들어 반에 넣어야 한다.")) return;

    };

      var again = $("#st-new"); if (again) { again.focus(); }

  var bg = $("#st-bulk-go", el);

      for (var i = 0; i < lines.length; i++) {

        if (S.students.some(function (x) { return x.name === one.name; })) { skipped.push(one.name); continue; }

  };
  var op = $("#st-orph", el);

    catch (e) { lk.disabled = false; alert("잇지 못했다: " + e.message); }

}

// ---- 쓰기 (climath-class) ----
// 반 명단은 배열 하나라 통째로 다시 쓴다. **반드시 방금 읽은 것 위에 얹는다** —
// 화면이 들고 있던 옛 사본으로 저장하면 그 사이 다른 선생님이 바꾼 것이 날아간다.
async function withFreshRoster(cid, fn) {
  var snap = await db.collection("classes").doc(cid).get();
  var cur = (snap.exists && snap.data().roster) || [];
  var next = fn(cur);
  if (!next) return null;
  await db.collection("classes").doc(cid).update({ roster: next });
  var c = S.classes.filter(function (x) { return x.id === cid; })[0];
  if (c) c.roster = next;
  return next;
}
async function stSave(pid, patch) {

}
async function stCreate(data) {

// **반 명단에서 먼저 빼고** 사람 문서를 지운다.
// 사람만 지우면 그 사람을 가리키는 반 명단 항목이 유령으로 남는다 — 배치표에는 뜨는데
// 명단에는 없고, rosterDrift·looseRosterRows 둘 다 못 잡는다(하나는 사람이 없어서,
// 하나는 pid 가 있어서). 빼는 것은 "반에서 빼기"와 같은 일이라 기록은 그대로 남는다.
async function stDelete(pid) {
  var inCls = classesOfPid(pid);
  for (var i = 0; i < inCls.length; i++) await stUnassign(inCls[i].id, pid);
  await db.collection("students").doc(pid).delete();
  S.students = S.students.filter(function (x) { return x.pid !== pid; });
  delete S.byPid[pid];
  if (S.notes[pid]) { delete S.notes[pid]; try { await saveNotes(); } catch (e) {} }
}
async function stAssign(cid, person) {
  await withFreshRoster(cid, function (roster) {
    if (roster.some(function (r) { return r.pid === person.pid; })) return null;
    return roster.concat([{ id: "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      pid: person.pid, name: person.name, school: person.school || "", grade: person.grade || "" }]);
  });
}
async function stUnassign(cid, pid) {
  await withFreshRoster(cid, function (roster) { return roster.filter(function (r) { return r.pid !== pid; }); });
}
// 사람 정보 → 그 사람이 든 모든 반 명단의 미러. 이름도 함께 보낸다 —
// 안 보내면 출석부·참여표가 옛 이름을 계속 쓴다.
async function stSyncRosters(person) {
  for (var i = 0; i < S.classes.length; i++) {
    var c = S.classes[i];
    if (!(c.roster || []).some(function (r) { return r.pid === person.pid; })) continue;
    await withFreshRoster(c.id, function (roster) {
      return roster.map(function (r) {
        if (r.pid !== person.pid) return r;
        var n = Object.assign({}, r, { school: person.school || "", grade: person.grade || "" });
        if (person.name) n.name = person.name;
        return n;
      });
    });
  }
}
// 반 명단의 미러가 사람 정보와 어긋난 것
function rosterDrift() {
  var out = [];
  activeClasses().forEach(function (c) {
    (c.roster || []).forEach(function (r) {
      if (!r.pid) return;
      var p = S.byPid[r.pid]; if (!p) return;
      if ((r.name || "") !== (p.name || "") || (r.school || "") !== (p.school || "") || (r.grade || "") !== (p.grade || ""))
        out.push({ cid: c.id, cname: c.name, pid: r.pid });
    });
  });
  return out;
}
async function fixDrift() {
  var d = rosterDrift(), seen = {}, n = 0;
  for (var i = 0; i < d.length; i++) {
    if (seen[d[i].pid]) continue;
    seen[d[i].pid] = 1;
    var p = S.byPid[d[i].pid]; if (!p) continue;
    await stSyncRosters(p); n++;
  }
  return d.length;
}
// 지워진 사람을 가리키는 반 명단 항목. 배치표에만 뜨고 명단에는 없다.
// 옛 판(2026-09-04)이 사람만 지워서 생긴 것들이 남아 있을 수 있다.
function orphanRosterRows() {
  var out = [];
  activeClasses().forEach(function (c) {
    (c.roster || []).forEach(function (r) {
      if (!r.teacher && r.pid && !S.byPid[r.pid] && !isEnded(r)) out.push({ cid: c.id, cname: c.name, r: r });
    });
  });
  return out;
}
async function removeOrphans() {
  var rows = orphanRosterRows(), byCid = {};
  rows.forEach(function (x) { (byCid[x.cid] = byCid[x.cid] || []).push(x.r.id); });
  for (var cid in byCid) {
    var ids = byCid[cid];
    await withFreshRoster(cid, function (roster) {
      return roster.filter(function (r) { return ids.indexOf(r.id) < 0; });
    });
  }
  return rows.length;
}
// 반에는 있는데 사람 정보가 없는 항목(pid 없음). 명단에 안 떠서 통째로 안 보인다.
function looseRosterRows() {
  var out = [];
  activeClasses().forEach(function (c) {
    (c.roster || []).forEach(function (r) { if (!r.teacher && !r.pid && !isEnded(r)) out.push({ cid: c.id, cname: c.name, r: r }); });
  });
  return out;
}
// 이름이 하나뿐일 때만 잇는다. 겹치면 사람이 골라야 한다 — 동명이인을 섞으면 되돌리기 어렵다.
async function linkLoose() {
  var rows = looseRosterRows(), byName = {};
  rows.forEach(function (x) { (byName[x.r.name] = byName[x.r.name] || []).push(x); });
  var made = 0, skip = 0;
  for (var name in byName) {
    var group = byName[name];
    var existing = S.students.filter(function (x) { return x.name === name; });
    if (existing.length > 1 || group.length > 1) { skip += group.length; continue; }
    var person = existing[0] || await stCreate({ name: name, school: group[0].r.school || "", grade: group[0].r.grade || "", homeroom: "" });
    var g = group[0];
    await withFreshRoster(g.cid, function (roster) {
      return roster.map(function (r) { return r.id === g.r.id ? Object.assign({}, r, { pid: person.pid }) : r; });
    });
    made++;
  }
  return { made: made, skip: skip };
}

function bulkParseGrade(tok) {
  if (GRADES.indexOf(tok) >= 0) return tok;
  var m = { "9": "중3", "10": "고1", "11": "고2", "12": "고3", "중3": "중3" };
  return m[tok] || "";
}
function parseBulkLine(line) {
  var t = line.split(/[\t,]|\s{1,}/).map(function (x) { return x.trim(); }).filter(Boolean);
  if (!t.length) return null;
  var name = t.shift(), grade = "", school = "";
  for (var i = 0; i < t.length; i++) {
    var g = bulkParseGrade(t[i]);
    if (g && !grade) { grade = g; continue; }
    school = school ? school + " " + t[i] : t[i];
  }
  return { name: name, grade: grade, school: school, homeroom: "" };
}

    var tab = sh.tab || (d.meta.tabs[0] && d.meta.tabs[0].title) || "";
    var r = await sheetsApi({ action: "values", spreadsheetId: sh.id, range: "'" + tab.replace(/'/g, "''") + "'!A1:AZ" + (sh.rows || 300) });
    d.tab = tab; d.values = r.values || []; d.at = Date.now();
  } catch (e) { d.err = e.message; }
  d.loading = false; renderSheets();
}
function renderSheets() {
  var el = $("#sec-sheets");
  var sheets = S.config.sheets || [];
  navBadge("sheets", sheets.length, false);
  if (!sheets.some(function (x) { return x.id === S.sheetPick; })) S.sheetPick = sheets.length ? sheets[0].id : "";
  var picked = sheets.filter(function (x) { return x.id === S.sheetPick; });
  el.innerHTML = '<h2>구글시트 <span class="n">' + sheets.length + '개 연동</span><span class="sp"></span><button id="sh-reload">전부 새로고침</button></h2>' +
    '<details' + (sheets.length ? "" : " open") + '><summary>시트 연동하기 — 주소 붙여넣기</summary>' +
    '<div class="row"><input type="text" id="sh-url" placeholder="시트 주소를 붙여넣기 (여러 개면 줄마다 하나)"><button class="btn" id="sh-add"' + (S.teamOk ? "" : " disabled") + '>연동</button></div>' +
    '<p class="muted" style="font-size:12px;margin:0 0 6px">시트마다 ' + (S.saEmail ? '<b>' + esc(S.saEmail) + '</b>' : "서비스 계정") + ' 을 <b>뷰어</b>로 공유해야 읽힌다. 남이 만든 시트도 편집 권한이 있으면 공유할 수 있다. 읽기만 하고 절대 쓰지 않는다.</p></details>' +
    (sheets.length ? '<div class="chips" style="margin-top:8px">' + sheets.map(function (sh) {
      var d = S.sheetData[sh.id] || {};
      return '<button class="mini ' + (sh.id === S.sheetPick ? "on" : "") + (d.err ? " warn" : "") + '" data-pick="' + esc(sh.id) + '">' + esc(sh.title || (d.meta && d.meta.title) || sh.id.slice(0, 8)) + '</button>';
    }).join("") + '</div>' + picked.map(sheetBlock).join("") : '<div class="empty">아직 연동한 시트가 없다.</div>');
  $$("[data-pick]", el).forEach(function (b) { b.onclick = function () { S.sheetPick = b.getAttribute("data-pick"); renderSheets(); }; });
  $("#sh-reload").onclick = function () { sheets.forEach(function (sh) { delete S.sheetData[sh.id]; loadSheet(sh); }); };
  $("#sh-add").onclick = async function () {
    var lines = $("#sh-url").value.split(/\r?\n/); var added = 0;
    lines.forEach(function (l) {
      var id = sheetIdFrom(l); if (!id) return;
      if (sheets.some(function (s) { return s.id === id; })) return;
      var m = /gid=(\d+)/.exec(l);
      sheets.push({ id: id, title: "", tab: "", rows: 300, gid: m ? +m[1] : null }); added++;
    });
    if (!added) { alert("시트 주소를 못 읽었다"); return; }
    S.config.sheets = sheets; S.sheetPick = sheets[sheets.length - added].id; await saveConfig(); renderSheets();
    sheets.slice(-added).forEach(loadSheet);
  };
  sheets.forEach(function (sh) {
    var box = $('[data-sheet="' + sh.id + '"]', el); if (!box) return;
    var sel = $("select.tab", box);
    if (sel) sel.onchange = async function () { sh.tab = sel.value; await saveConfig(); delete S.sheetData[sh.id].values; loadSheet(sh); };
    var q = $("input.q", box);
    if (q) q.oninput = function () { S.sheetData[sh.id].q = q.value; renderSheetTable(sh, $(".tbl", box)); };
    $(".rm", box).onclick = async function () {
      if (!confirm("연동을 풀까? " + (sh.title || sh.id))) return;
      S.config.sheets = sheets.filter(function (s) { return s.id !== sh.id; }); delete S.sheetData[sh.id]; await saveConfig(); renderSheets();
    };
    $(".re", box).onclick = function () { delete S.sheetData[sh.id]; loadSheet(sh); };
    var rowsSel = $("select.rows", box);
    if (rowsSel) rowsSel.onchange = async function () { sh.rows = +rowsSel.value; await saveConfig(); delete S.sheetData[sh.id].values; loadSheet(sh); };
  });
}
function sheetBlock(sh) {
  var d = S.sheetData[sh.id] || {};
  var tabs = (d.meta && d.meta.tabs) || [];
  return '<div class="sheet" data-sheet="' + esc(sh.id) + '"><h3>' + esc(sh.title || d.meta && d.meta.title || sh.id) +
    ' <a href="https://docs.google.com/spreadsheets/d/' + esc(sh.id) + '/edit' + (sh.gid != null ? "#gid=" + sh.gid : "") + '" target="_blank" class="mini">열기</a>' +
    (tabs.length ? '<select class="tab mini">' + tabs.map(function (t) { return '<option' + (t.title === d.tab ? " selected" : "") + '>' + esc(t.title) + '</option>'; }).join("") + '</select>' : "") +
    (d.values ? '<input type="text" class="q mini" placeholder="찾기" value="' + esc(d.q || "") + '" style="width:120px">' : "") +
    '<select class="rows mini" title="읽을 줄 수">' + [100, 300, 1000].map(function (n) { return '<option value="' + n + '"' + ((sh.rows || 300) === n ? " selected" : "") + '>' + n + '줄</option>'; }).join("") + '</select>' +
    '<span class="sp"></span>' + (d.loading ? '<span class="muted">읽는 중...</span>' : d.at ? '<span class="muted" style="font-size:12px">' + new Date(d.at).toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }) + '</span>' : "") +
    '<button class="mini re">새로고침</button><button class="mini rm">풀기</button></h3>' +
    (d.err ? '<div class="err">' + esc(d.err) + '</div>' : "") +
    '<div class="tbl">' + sheetTableHtml(sh) + '</div></div>';
}
function renderSheetTable(sh, el) { el.innerHTML = sheetTableHtml(sh); }
function sheetTableHtml(sh) {
  var d = S.sheetData[sh.id] || {};
  var v = d.values; if (!v) return d.loading ? "" : '<div class="empty">아직 안 읽었다</div>';
  if (!v.length) return '<div class="empty">비어 있다</div>';
  var q = (d.q || "").trim().toLowerCase();
  var head = v[0] || []; var body = v.slice(1);
  if (q) body = body.filter(function (r) { return r.join(" ").toLowerCase().indexOf(q) >= 0; });
  var cols = Math.min(head.length || (body[0] || []).length, 26);
  return '<table><thead><tr>' + Array.apply(null, Array(cols)).map(function (_, i) { return '<th>' + esc(head[i] || "") + '</th>'; }).join("") + '</tr></thead><tbody>' +
    body.slice(0, 200).map(function (r) { return '<tr>' + Array.apply(null, Array(cols)).map(function (_, i) { return '<td title="' + esc(r[i] || "") + '">' + esc(r[i] || "") + '</td>'; }).join("") + '</tr>'; }).join("") +
    '</tbody></table>' + (body.length > 200 ? '<div class="muted" style="padding:6px">' + body.length + '줄 중 200줄만</div>' : "");
}
</script>
</body>
</html>
