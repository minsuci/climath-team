// ---------- 시험 성적 ----------
//
// 일일 테스트가 아니라 **중간고사·기말고사·모의고사**를 넣는 곳.
// 이건 수업관리 앱에 없는 자료라 이 앱 DB(climath-team)에 둔다 — 앱 규칙을 안 건드린다.
//   tests/{tid}                 { kind, name, grade, date, created }
//   testScores/{tid}__{pid}     { tid, pid, name, raw, ach, grade, std, pct, avg, note }
// 나중에 학생·학부모에게 보여주려면 그때 앱 쪽으로 옮긴다. 지금은 팀장이 보는 자료다.

var TEST_KINDS = {
  midterm: { label: "중간고사", short: "중간", cols: ["raw", "ach", "grade", "avg"] },
  final:   { label: "기말고사", short: "기말", cols: ["raw", "ach", "grade", "avg"] },
  mock:    { label: "모의고사", short: "모의", cols: ["raw", "std", "pct", "grade"] },
};
var TEST_COLS = {
  raw:   { label: "원점수", w: 74, max: 100 },
  ach:   { label: "성취도", w: 66, text: true },      // A~E
  grade: { label: "등급", w: 62, max: 9 },
  avg:   { label: "과목평균", w: 78, max: 100 },
  std:   { label: "표준점수", w: 78, max: 200 },
  pct:   { label: "백분위", w: 70, max: 100 },
};
function gradeTone(g) {
  var n = Number(g);
  if (!n) return "";
  if (n <= 2) return "green";
  if (n <= 4) return "blue";
  if (n <= 6) return "";
  return "red";
}
var testsCol = function () { return tdb.collection("tests"); };
var scoresCol = function () { return tdb.collection("testScores"); };
var scoreKey = function (tid, pid) { return tid + "__" + pid; };

async function loadTests() {
  try {
    var s = await testsCol().get();
    S.tests = []; s.forEach(function (d) { S.tests.push(Object.assign({ tid: d.id }, d.data())); });
    S.tests.sort(function (a, b) { return (b.date || "") < (a.date || "") ? -1 : 1; });   // 최근 시험이 위
  } catch (e) { S.tests = []; }
}
async function loadTestScores(tid) {
  S.testScores = {};
  if (!tid) return;
  var s = await scoresCol().where("tid", "==", tid).get();
  s.forEach(function (d) { var v = d.data(); S.testScores[v.pid] = Object.assign({ id: d.id }, v); });
}
async function saveTest(t) {
  var ref = await testsCol().add(Object.assign({}, t, { created: Date.now() }));
  return ref.id;
}
async function deleteTest(tid) {
  // 성적을 먼저 지운다. 시험만 지우면 어디에도 안 보이는 성적이 남는다 (학생 지우기와 같은 함정).
  var s = await scoresCol().where("tid", "==", tid).get();
  var jobs = []; s.forEach(function (d) { jobs.push(d.ref.delete()); });
  await Promise.all(jobs);
  await testsCol().doc(tid).delete();
  S.tests = S.tests.filter(function (x) { return x.tid !== tid; });
  if (S.testPick === tid) S.testPick = "";
}
async function saveScore(tid, pid, name, patch) {
  var cur = S.testScores[pid] || {};
  var next = Object.assign({}, cur, patch, { tid: tid, pid: pid, name: name, updated: Date.now() });
  delete next.id;
  // 값이 전부 비면 문서를 지운다 — 빈 껍데기가 "응시함"으로 세어지면 평균이 틀어진다.
  var has = Object.keys(TEST_COLS).some(function (k) { return next[k] !== "" && next[k] != null; }) || next.note;
  if (!has) { await deleteScore(tid, pid); return; }
  await scoresCol().doc(scoreKey(tid, pid)).set(next, { merge: true });
  S.testScores[pid] = next;
}
async function deleteScore(tid, pid) {
  await scoresCol().doc(scoreKey(tid, pid)).delete().catch(function () {});
  delete S.testScores[pid];
}

// 그 학년 학생 + 반·담임. 시험은 학년 단위로 본다.
function testRoster(grade) {
  var inCls = {};
  activeClasses().forEach(function (c) {
    rosterStudents(c).forEach(function (r) { if (r.pid) (inCls[r.pid] = inCls[r.pid] || []).push(c); });
  });
  return S.students.filter(function (x) { return !grade || x.grade === grade; }).map(function (x) {
    var cs = inCls[x.pid] || [];
    return { p: x, cls: cs, clsName: cs.map(function (c) { return c.name; }).join(", "),
             homeroom: x.homeroom ? teacherName(x.homeroom) : "" };
  });
}
function avgOf(list) {
  var n = list.filter(function (x) { return x !== "" && x != null && !isNaN(Number(x)); }).map(Number);
  if (!n.length) return null;
  return Math.round(n.reduce(function (a, b) { return a + b; }, 0) / n.length * 10) / 10;
}

function testPanelHtml(t) {
  var cols = TEST_KINDS[t.kind].cols;
  var rows = testRoster(t.grade);
  var so = S.tsSort;
  if (so) {
    var keyOf = function (x) {
      var v = S.testScores[x.p.pid] || {};
      if (so.key === "name") return x.p.name || "";
      if (so.key === "cls") return x.clsName || "";
      if (so.key === "homeroom") return x.homeroom || "";
      if (so.key === "school") return x.p.school || "";
      var n = v[so.key];
      return (n === "" || n == null) ? "" : ("0000" + n).slice(-5);
    };
    rows = rows.slice().sort(function (a, b) {
      var ka = keyOf(a), kb = keyOf(b);
      var byName = String(a.p.name || "").localeCompare(String(b.p.name || ""), "ko");
      if (!ka && !kb) return byName;
      if (!ka) return 1;
      if (!kb) return -1;
      var c = ka.localeCompare(kb, "ko");
      return (so.dir === "desc" ? -c : c) || byName;
    });
  } else {
    rows.sort(function (a, b) { return (a.clsName || "힣").localeCompare(b.clsName || "힣", "ko") || String(a.p.name).localeCompare(String(b.p.name), "ko"); });
  }
  var got = rows.filter(function (x) { var v = S.testScores[x.p.pid]; return v && v.raw !== "" && v.raw != null; });

  });
  var mean = avgOf(got.map(function (x) { return S.testScores[x.p.pid].raw; }));
  // 담임별 평균 — 누가 맡은 아이들이 어땠나

  });
  var byC = {};

  var sortTh = function (key, label, w) {

      ' <span class="ar' + (on ? "" : " off") + '">' + (on ? (so.dir === "asc" ? "▲" : "▼") : "↕") + '</span></th>';
  };
  var meanBox = function (m) { return m == null ? '<span class="muted">—</span>' : '<b>' + m + '</b>'; };

// "김서진 88 2 71.4" → { name, vals }. 성취도(A~E)는 자리를 안 가린다.
function parseScoreLine(line, cols) {
  var t = line.split(/[\t,]|\s+/).map(function (x) { return x.trim(); }).filter(Boolean);
  if (t.length < 2) return null;
  var name = t.shift(), vals = {}, nums = [];
  t.forEach(function (x) {
    if (/^[A-Ea-e]$/.test(x)) { vals.ach = x.toUpperCase(); return; }
    nums.push(x === "-" ? "" : x);
  });
  cols.filter(function (c) { return !TEST_COLS[c].text; }).forEach(function (c, i) {
    if (i < nums.length) vals[c] = nums[i];
  });
  return { name: name, vals: vals };
}

// ---- 근거 시트에서 성적 가져오기 ----
//
// 성적을 따로 적는 구글시트가 있다. 머리글이 **두 줄**이고 시험별로 칸이 묶여 있다:
//   1줄  연번 | 이름 | 학교/학년 | 소속 | 담임 | 3월 모의고사 ←──묶임──→ | 2026-1학기 중간고사 ←→ | …
//   2줄                                        수학(원점수) | 예상등급 | 비고 | 수학(예상등급) | 비고
// 묶인 칸은 API 가 **맨 왼쪽에만 값을 주고 나머지는 빈 칸**으로 준다. 그래서 1줄을 오른쪽으로
// 끌어 채운 뒤(ffill) 2줄에 이름표가 있는 칸만 실제 점수 칸으로 본다.
// 탭마다 머리글 생김새가 조금씩 다르다(학교/학년이 한 칸이기도, 두 칸이기도 하다) — 그래서
// 자리를 못 박지 않고 **글자로 찾는다.**
//
// 시트 주소는 언제든 바뀔 수 있으므로 `dash/config.scoreSheet` 에 두고 화면에서 고친다.
// (공개 저장소라 코드에 적지 않는다 — 볼트 작업 노트에 있다.)

// 근거는 «근거 자료» 메뉴 한 곳에서 관리한다. 여기서는 읽기만 한다 —
// 같은 것을 두 자리에서 고치게 하면 어느 쪽이 맞는지 알 수 없다.
function scoreSheet() { return sourceOf("scores"); }
// 두 줄 머리글을 읽어 시험 묶음을 뽑는다
function parseScoreSheet(values) {
  var v = values || [];
  var hi = -1;
  for (var i = 0; i < Math.min(v.length, 12); i++) {
    var row = v[i] || [];
    var hasName = row.some(function (c) { return String(c || "").trim() === "이름"; });
    var next = v[i + 1] || [];
    var hasMeasure = next.some(function (c) { return /원점수|등급/.test(String(c || "")); })
                  || row.some(function (c) { return /원점수|등급/.test(String(c || "")); });
    if (hasName && hasMeasure) { hi = i; break; }
  }
  if (hi < 0) return null;
  var top = (v[hi] || []).slice(), sub = (v[hi + 1] || []).slice();
  var wide = Math.max(top.length, sub.length);
  // 묶인 칸을 오른쪽으로 끌어 채운다
  var carry = "";
  var group = [];
  for (var c = 0; c < wide; c++) {
    var t = String(top[c] || "").trim();
    if (t) carry = t;
    group[c] = carry;
  }
  var find = function (re) {
    for (var c = 0; c < wide; c++) {
      if (re.test(String(top[c] || "").trim())) return c;
      if (re.test(String(sub[c] || "").trim())) return c;
    }
    return -1;
  };
  var nameCol = find(/^이름$/), schoolCol = find(/학교/), gradeCol = find(/^학년$/), hrCol = find(/^담임$/);
  if (nameCol < 0) return null;
  // 2줄에 이름표가 있는 칸만 점수 칸이다
  var groups = {};
  for (var c2 = 0; c2 < wide; c2++) {
    var lab = String(sub[c2] || "").trim();
    if (!lab) continue;
    var g = group[c2];
    if (!g || g === "이름" || /^연번$|^소속$|^담임$|학교|^학년$/.test(g)) continue;
    groups[g] = groups[g] || { name: g, raw: -1, grade: -1, note: -1 };
    if (/원점수/.test(lab)) groups[g].raw = c2;
    else if (/등급/.test(lab)) groups[g].grade = c2;
    else if (/^비고/.test(lab) && groups[g].note < 0) groups[g].note = c2;
  }
  var rows = [];
  for (var r = hi + 2; r < v.length; r++) {
    var row = v[r] || [];
    var nm = String(row[nameCol] || "").trim();
    if (!nm || nm === "이름") continue;
    rows.push({ name: nm, row: row,
      school: schoolCol >= 0 ? String(row[schoolCol] || "").trim() : "",
      grade: gradeCol >= 0 ? String(row[gradeCol] || "").trim() : "",
      homeroom: hrCol >= 0 ? String(row[hrCol] || "").trim() : "" });
  }
  return { groups: Object.keys(groups).map(function (k) { return groups[k]; }), rows: rows };
}
// 시트 전체를 훑어 (탭 × 시험 묶음)을 모은다
async function scanScoreSheet() {
  var sh = scoreSheet();
  if (!sh || !sh.id) throw new Error("근거 시트를 먼저 정해주세요");
  var meta = await sheetsApi({ action: "meta", spreadsheetId: sh.id });
  var out = [];
  for (var i = 0; i < meta.tabs.length; i++) {
    var tab = meta.tabs[i].title;
    try {
      var r = await sheetsApi({ action: "values", spreadsheetId: sh.id, range: "'" + tab.replace(/'/g, "''") + "'!A1:BZ400" });
      var parsed = parseScoreSheet(r.values);
      if (parsed) parsed.groups.forEach(function (g) { out.push({ tab: tab, g: g, rows: parsed.rows }); });
    } catch (e) { /* 못 읽는 탭은 건너뛴다 */ }
  }
  S.sheetScan = { title: meta.title, at: Date.now(), found: out };
  return S.sheetScan;
}
// 시험 이름으로 묶음 찾기 — 띄어쓰기·괄호를 무시하고 견준다
function normName(x) { return String(x || "").replace(/[\s()·・]/g, "").toLowerCase(); }
function matchGroup(found, test) {
  var n = normName(test.name);
  var exact = found.filter(function (f) { return normName(f.g.name) === n; });
  if (exact.length) return exact[0];
  var part = found.filter(function (f) { var m = normName(f.g.name); return m.indexOf(n) >= 0 || n.indexOf(m) >= 0; });
  return part[0] || null;
}
// 시트 한 줄 → 우리 학생. 이름이 겹치면 시트의 학교로 가른다.
function matchStudent(row, grade) {
  var hit = S.students.filter(function (x) { return x.name === row.name && (!grade || x.grade === grade); });
  if (hit.length === 1) return { p: hit[0] };
  if (!hit.length) {
    var any = S.students.filter(function (x) { return x.name === row.name; });
    return { err: any.length ? "학년이 다름(" + any.map(function (x) { return x.grade || "?"; }).join("/") + ")" : "명단에 없음" };
  }
  var sch = row.school.replace(/[0-9]/g, "");
  var narrowed = hit.filter(function (x) { return sch && x.school && (x.school.indexOf(sch) >= 0 || sch.indexOf(x.school) >= 0); });
  if (narrowed.length === 1) return { p: narrowed[0] };
  return { err: "동명이인 " + hit.length + "명" };
}
function pullPreview(t) {
  var pick = S.pullPick;
  if (!pick) return { list: [], skip: [] };
  var g = pick.g, list = [], skip = [];
  pick.rows.forEach(function (r) {
    var raw = g.raw >= 0 ? String(r.row[g.raw] || "").trim() : "";
    var grd = g.grade >= 0 ? String(r.row[g.grade] || "").trim() : "";
    if (!raw && !grd) return;                                  // 빈 줄은 가져오지 않는다
    var m = matchStudent(r, t.grade);
    if (m.err) { skip.push({ name: r.name, school: r.school, why: m.err }); return; }
    var cur = S.testScores[m.p.pid] || {};
    var had = (cur.raw != null && cur.raw !== "") || (cur.grade != null && cur.grade !== "");
    list.push({ p: m.p, raw: raw, grade: grd, had: had, cur: cur, sheetSchool: r.school });
  });
  return { list: list, skip: skip };
}

// 일일 테스트 입력 현황 — 선생님이 테스트를 돌리고 있는지 보는 신호로만 남긴다
var SCORE_DAYS = 30, SCORE_MAX_DOCS = 14;
async function loadScores() {
  var since = addDays(TODAY, -SCORE_DAYS);
  await Promise.all(activeClasses().map(async function (c) {
    try {
      var ds = await db.collection("classes").doc(c.id).collection("days").get();
      var ids = []; ds.forEach(function (d) { if (d.id >= since && d.id <= TODAY) ids.push(d.id); });
      ids.sort().reverse(); ids = ids.slice(0, SCORE_MAX_DOCS);
      var out = [];
      await Promise.all(ids.map(function (date) {
        return db.collection("classes").doc(c.id).collection("days").doc(date).collection("scores").get().then(function (s) {
          s.forEach(function (d) { out.push(Object.assign({ date: date }, d.data())); });
        });
      }));
      S.scores[c.id] = out;
    } catch (e) { S.scores[c.id] = []; }
  }));
}

function bindSources() {

  });
  $$("[data-scheck]", el).forEach(function (b) {
    b.onclick = async function () {
      var key = b.getAttribute("data-scheck"), err = $('[data-serr="' + key + '"]', el);
      b.disabled = true; b.textContent = "확인 중..."; err.textContent = "";
      try { var meta = await checkSource(key); alert("읽힌다.\n\n" + meta.title + "\n탭 " + (meta.tabs || []).length + "개"); renderSheets(); }
      catch (e) { b.disabled = false; b.textContent = "읽히나 확인"; err.textContent = e.message; }
    };

  $$("[data-sdel]", el).forEach(function (b) {

      catch (e) { alert("끊지 못했다: " + e.message); }
    };
  });
}

function repoPending(rp) { return !(rp.owner && rp.repo); }

function devWhoNames() {
  var out = [];

  reposOf().forEach(function (r) { if (r.who && out.indexOf(r.who) < 0) out.push(r.who); });

function reposOf() { var r = S.config && S.config.repos; return (r && r.length) ? r : REPOS_DEFAULT; }
async function saveRepos(list) {
  S.config.repos = list;

}
// 깃허브 주소에서 owner/repo 를 뽑는다. `owner/repo` 만 적어도 된다.
function repoFrom(s) {
  s = String(s || "").trim();
  var m = /github\.com\/([\w.-]+)\/([\w.-]+?)(?:\.git)?(?:[\/#?].*)?$/.exec(s) || /^([\w.-]+)\/([\w.-]+)$/.exec(s);
  return m ? { owner: m[1], repo: m[2] } : null;
}

// 커밋 한 줄 → 종류. 순서가 곧 우선순위다 — 문서 > 고침 > 손질 > 기능(기본).
// 이 저장소들의 메시지가 한국어 한 줄이라 한국어 표지를 본다. 영어(fix/feat/docs)도 받는다.
var DEV_KINDS = { feat: ["기능", "blue"], fix: ["고침", "red"], docs: ["문서", ""], chore: ["손질", "yellow"] };
var DEV_RX = {
  docs: /CLAUDE\.md|README|\bdocs?\b|^문서|노하우|주석/i,
  fix: /\bfix|\bbug|버그|오류|막히|막힌|안 되|안 가|안 뜨|안 보이|안 읽|안 잡|안 남|못 [가-힣]+던|틀리|틀린|잘림|잘리|밀리|밀려|새는|샜|깨지|깨진|잘못|던 것|헛|풀린|풀리|빠지던|걸리던|어긋|유령|되던|되게$|있게$|없게$|없어도|않게$/,
  chore: /뺀다$|지운다$|정리|이름을 바꾼|이름 바꿈|옮긴다$|넘긴다$|되돌|접어|줄인다$|없앤다$|refactor|rename|cleanup|chore/i,
};
function devKind(msg) {
  var m = String(msg || "").trim();
  if (DEV_RX.docs.test(m)) return "docs";
  if (DEV_RX.fix.test(m)) return "fix";
  if (DEV_RX.chore.test(m)) return "chore";
  return "feat";
}
// "제목 — 덧붙임" 을 가른다. 이 저장소들의 커밋이 그렇게 생겼다.
function devSplit(msg) {
  var i = String(msg || "").indexOf(" — ");
  return i < 0 ? [msg, ""] : [msg.slice(0, i), msg.slice(i + 3)];
}

async function githubApi(body) {
  var u = teamAuth.currentUser;
  if (!u) throw new Error("로그인이 필요합니다");
  var idToken = await u.getIdToken();
  var r = await fetch("/api/github", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ idToken: idToken }, body)) });
  var j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ("요청 실패 (" + r.status + ")"));
  return j || {};
}
// 저장소마다 따로 받는다. 하나가 막혀도(비공개·한도) 나머지는 뜬다.
async function loadDev(fresh) {
  var list = reposOf();
  var out = await Promise.all(list.map(function (rp) {
    if (repoPending(rp)) return Promise.resolve({ cfg: rp, pending: true, err: "", commits: [], deploy: null });
    return githubApi({ action: "repo", owner: rp.owner, repo: rp.repo, fresh: !!fresh })
      .then(function (d) { return Object.assign({ cfg: rp, err: "" }, d); })
      .catch(function (e) { return { cfg: rp, err: e.message, commits: [], deploy: null }; });
  }));
  out.forEach(function (r) { r.commits.forEach(function (c) { c.kind = devKind(c.msg); c.app = r.cfg.app; c.who = r.cfg.who; c.key = r.cfg.key; c.owner = r.cfg.owner; }); });
  S.dev = out;
  return out;
}

  var o = { total: 0, feat: 0, fix: 0, docs: 0, chore: 0 };

  return o;
}

    '<span class="sp" style="flex:1"></span>' +
    (cfg.url ? '<a class="mini" href="' + esc(cfg.url) + '" target="_blank">앱 열기</a>' : "") +
    '<a class="mini" href="' + esc(r.url || ("https://github.com/" + cfg.owner + "/" + cfg.repo)) + '" target="_blank">저장소</a></div>' +
    (r.err ? '<div class="err">' + esc(r.err) + '</div>' :
      '<div style="font-size:13px">' + (since ? '최근 ' + S.devDays + '일 ' : '') + '<b>' + n.total + '건</b> ' + kinds +
      (last ? ' <span class="muted">· 마지막 커밋 ' + esc(fmtMD(last.date)) + '</span>' : "") +
      (r.deploy ? ' <span class="muted">· 마지막 배포 ' + esc(fmtMD(r.deploy.date)) + ' <code>' + esc(r.deploy.short) + '</code>' +
        (last && r.deploy.sha !== last.sha ? ' <span class="pill yellow">마지막 커밋과 다름</span>' : "") + '</span>' : "") + '</div>' +
      (cfg.note || r.description ? '<div class="muted" style="font-size:12px">' + esc(cfg.note || r.description) + '</div>' : "")) + '</div>';
}
function devRowHtml(c) {
  var p = devSplit(c.msg), k = DEV_KINDS[c.kind] || DEV_KINDS.feat;
  return '<div class="dvrow"><span class="pill ' + k[1] + '">' + k[0] + '</span>' +
    (S.devApp ? "" : '<span class="pill">' + esc(c.app) + '</span>') +
    '<a href="' + esc(c.url) + '" target="_blank" class="dvmsg">' + esc(p[0]) + '</a>' +
    (p[1] ? '<span class="muted"> — ' + esc(p[1]) + '</span>' : "") +
    '<span class="muted dvsha">' + esc(c.author && c.author !== c.owner && c.author !== c.who ? c.author + " · " : "") + esc(c.short) + '</span></div>';
}
function devEditHtml() {
  var list = reposOf();
  var who = function (v) { return '<input type="text" class="d-who" list="dv-whos" value="' + esc(v || "") + '" placeholder="담당" style="width:80px">'; };
  var row = function (r, i) {
    return '<tr data-drow="' + i + '" data-dkey="' + esc(r.key || "") + '"><td><input type="text" class="d-app" value="' + esc(r.app || "") + '" placeholder="앱 이름"></td>' +
      '<td>' + who(r.who) + '</td>' +
      '<td><input type="text" class="d-gh" value="' + esc(r.owner ? r.owner + "/" + r.repo : "") + '" placeholder="github.com/… 또는 owner/repo. 아직 없으면 비워 둔다"></td>' +
      '<td><input type="text" class="d-url" value="' + esc(r.url || "") + '" placeholder="https://…"></td>' +
      '<td><input type="text" class="d-note" value="' + esc(r.note || "") + '" placeholder="무엇을 하는 도구인지"></td>' +
      '<td>' + (i === "new" ? "" : '<button class="mini" data-ddel="' + i + '">빼기</button>') + '</td></tr>';
  };
  return '<div class="banner" style="background:#fff;margin-bottom:12px"><b>저장소 목록</b> <span class="muted" style="font-size:12px">선생님이 주소를 주면 그 줄에 적는다. 주소가 비면 «저장소 주소 없음»으로 뜬다. 비공개 저장소는 Vercel 에 <code>GITHUB_TOKEN</code> 이 있어야 읽힌다.</span>' +
    '<datalist id="dv-whos">' + devWhoNames().map(function (n) { return '<option value="' + esc(n) + '">'; }).join("") + '</datalist>' +
    '<table style="width:100%;margin-top:6px;font-size:13px"><tr><th>앱 이름</th><th>담당</th><th>깃허브 주소</th><th>배포 주소</th><th>설명</th><th></th></tr>' +
    list.map(row).join("") + row({}, "new") +
    '</table><div class="row"><button class="btn" id="dv-save">저장하고 다시 읽기</button><button class="mini" id="dv-cancel">닫기</button></div>' +
    '<div class="err" id="dv-err"></div></div>';
}
// 편집 표를 읽어 목록으로. 새 줄은 깃허브 주소가 있을 때만 들어간다.
// 주소가 없어도 앱 이름이 있으면 «아직 없음»으로 들어간다. 둘 다 비면 그 줄은 버린다.
// 열쇠는 주소가 있으면 owner__repo, 없으면 원래 것을 지킨다 — 저장할 때마다 바뀌면 앱 거르기가 풀린다.
function readRepoTable(el) {
  var out = [], bad = "";
  $("[data-drow]", el).forEach(function (tr) {
    var gh = $(".d-gh", tr).value.trim(), app = $(".d-app", tr).value.trim(), who = $(".d-who", tr).value.trim() || "?";
    var url = $(".d-url", tr).value.trim(), note = ($(".d-note", tr) || { value: "" }).value.trim();
    var oldKey = tr.getAttribute("data-dkey") || "";
    if (!gh && !app) return;
    var p = gh ? repoFrom(gh) : null;
    if (gh && !p) { bad = "깃허브 주소를 못 읽었다: " + gh; return; }
    out.push({ key: p ? p.owner + "__" + p.repo : (oldKey || "p_" + newId()), app: app || (p && p.repo) || "?", who: who,
      owner: p ? p.owner : "", repo: p ? p.repo : "", url: url, note: note });
  });
  if (bad) throw new Error(bad);
  return out;
}
function bindDev(el) {
  var pick = function (attr, field, conv) {
    $$("[data-" + attr + "]", el).forEach(function (b) {
      b.onclick = function () { S[field] = conv ? conv(b.getAttribute("data-" + attr)) : b.getAttribute("data-" + attr); keepScrollIn("#sec-dev", renderDev); };
    });
  };
  pick("dwho", "devWho"); pick("dapp", "devApp"); pick("dkind", "devKindPick"); pick("ddays", "devDays", Number);
  $("#dv-q").oninput = function () {
    S.devQ = this.value; var keep = this.value;
    renderDev();
    var again = $("#dv-q"); if (again) { again.value = keep; again.focus(); again.setSelectionRange(keep.length, keep.length); }
  };
  $("#dv-re").onclick = function () { S.dev = null; S.devErr = ""; renderDev(); loadDev(true).then(renderDev).catch(function (e) { S.devErr = e.message; renderDev(); }); };
  $("#dv-edit").onclick = function () { S.devEdit = !S.devEdit; renderDev(); };
  var cancel = $("#dv-cancel"); if (cancel) cancel.onclick = function () { S.devEdit = false; renderDev(); };
  $$("[data-ddel]", el).forEach(function (b) {
    b.onclick = function () { var tr = b.closest("tr"); if (tr && tr.parentNode) tr.parentNode.removeChild(tr); };
  });
  var save = $("#dv-save");
  if (save) save.onclick = async function () {
    var err = $("#dv-err");
    try {
      var list = readRepoTable(el);
      if (!list.length) { err.textContent = "저장소가 하나도 없다. 하나는 남겨야 한다."; return; }
      save.disabled = true;
      await saveRepos(list);
      S.devEdit = false; S.dev = null; S.devApp = ""; renderDev();
      loadDev(true).then(renderDev).catch(function (e) { S.devErr = e.message; renderDev(); });
    } catch (e) { save.disabled = false; err.textContent = e.message; }
  };
}

</script>
