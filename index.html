<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>팀체크</title>
<!-- 홈 화면에 추가할 수 있게 하는 것들 (2026-09-12).
     ⚠ 아이폰은 **홈 화면에 추가해 그 아이콘으로 연 것**만 알림을 받는다(iOS 16.4+).
       그래서 이 넉 줄이 «휴대폰 알림» 의 전제다 — 장식이 아니다. -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1b2a4a">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="팀체크">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!--
  팀체크 — 대치 클라이매쓰 고등부 교무팀 화면. 수업관리 앱(climath-class)과 별개의 앱.
  (2026-09-07까지 «한민수의 대시보드». 저장소·주소는 climath-team 그대로다)
  관리자 한 사람만 쓰는 화면이라 빌드도 React도 없다. 순수 JS로 그린다.

  Firebase 프로젝트를 둘 쓴다:
    climath-class (기본 앱)  — 수업관리 앱의 DB. **읽기만 한다.**
        teachers / classes / students / appConfig.examTerm / appConfig.schoolTerms
        classes/{cid}/exams / classes/{cid}/days/{date}/scores
    climath-team  ("team" 앱) — 대시보드 자기 것. dash/tasks(팀 할 일) · dash/config(연동 시트)
  로그인은 /api/auth 가 수업관리 앱의 로그인 API로 PIN을 확인한 뒤 두 프로젝트의 토큰을 함께 준다.
  구글시트는 /api/sheets 가 climath-team 서비스 계정으로 읽는다.
-->
<style>
  :root {
    --navy: #1b2a4a; --navy2: #24375f; --orange: #f08a24; --bg: #f3f5f9; --card: #fff;
    --line: #e3e7ee; --text: #1f2937; --muted: #6b7280; --red: #d94848; --green: #2f9e5f;
    --yellow: #f2c94c; --blue: #3b6fd9;
  }
  * { box-sizing: border-box; }
  /* iOS 사파리는 작은 글씨를 저 혼자 키운다. 높이를 못 박은 칸에서 글자가 위아래로 잘린다. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  a { color: var(--blue); text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; }
  .top { background: linear-gradient(90deg, var(--navy), var(--navy2)); color: #fff;
    padding: 12px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .top h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .top h1 b { color: var(--orange); }
  .top .date { opacity: .85; font-size: 13px; }
  .top .sp { flex: 1; }
  .top { position: relative; }
  .bell { background: none; border: 0; color: #fff; font-size: 15px; cursor: pointer; padding: 3px 7px;
    border-radius: 6px; opacity: .9; position: relative; }
  .bell:hover { opacity: 1; background: rgba(255,255,255,.1); }
  .bell .bn { position: absolute; top: -2px; right: -3px; background: var(--orange); color: #fff;
    font-size: 10px; font-weight: 700; min-width: 14px; padding: 0 3px; border-radius: 7px; line-height: 14px; }
  /* ⚠ 머리띠(.top)가 color:#fff 를 물려준다. 되돌리지 않으면 흰 바탕에 흰 글자 — 제목이 통째로 안 보인다 (2026-09-08 실제로 그랬다) */
  .bellbox { position: absolute; right: 12px; top: 100%; margin-top: 4px; z-index: 30; width: 320px; max-width: calc(100vw - 24px);
    background: #fff; color: var(--text); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.18);
    padding: 8px 10px; text-align: left; }
  .bellbox h4 { margin: 0 0 6px; font-size: 13px; }
  .bellbox .bi { padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; cursor: pointer; }
  .bellbox .bi:hover { background: #f5f7fb; }
  .bellbox .bi b { font-weight: 600; }
  /* 휴대폰 알림 줄 — 누르는 줄이 아니라 다루는 줄이다. 손가락 모양과 호버를 끈다 */
  .bellbox .bi.pushrow { cursor: default; background: none; }
  .bellbox .bi.pushrow:hover { background: none; }
  .top a, .top button.link { color: #fff; opacity: .9; font-size: 13px; background: none;
    border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: 4px 10px; }
  .top a:hover, .top button.link:hover { opacity: 1; background: rgba(255,255,255,.1); }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 14px; }
  .grid { display: block; }
  .nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
  .nav button { font: inherit; font-size: 14px; padding: 7px 14px; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; color: var(--text); }
  .nav button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .nav button .b { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px;
    font-size: 11px; background: #eef1f6; color: #374151; }
  .nav button.on .b { background: rgba(255,255,255,.2); color: #fff; }
  .nav button .b.red { background: #fde8e8; color: #b42318; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .card h2 .n { font-weight: 400; color: var(--muted); font-size: 12px; }
  .card h2 .sp { flex: 1; }
  .card h2 button, .mini { font-size: 12px; padding: 3px 9px; border: 1px solid var(--line);
    background: #fff; border-radius: 6px; color: var(--text); }
  .card h2 button:hover, .mini:hover { background: #f5f7fb; }
  .mini.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .mini.warn { border-color: var(--orange); color: #b35d00; }
  .stat { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .stat div { background: #f7f8fb; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; min-width: 84px; }
  .stat b { display: block; font-size: 20px; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat .bad b { color: var(--red); }
  .stat div[data-stat] { cursor: pointer; }
  .stat div[data-stat]:hover { border-color: var(--navy); }
  .stat div.on { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); background: #eef3fb; }
  .stat .good b { color: var(--green); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 5px 7px; text-align: left;
    vertical-align: top; white-space: nowrap; }
  th { background: #f7f8fb; font-weight: 600; color: #374151; position: sticky; top: 0; }
  td.wrapc { white-space: normal; }
  .tbl { overflow: auto; max-height: calc(100vh - 330px); min-height: 120px; border: 1px solid var(--line); border-radius: 8px; }
  .tbl.tall { max-height: calc(100vh - 330px); }
  .muted { color: var(--muted); }
  .red { color: var(--red); } .green { color: var(--green); } .orange { color: #b35d00; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
    background: #eef1f6; color: #374151; margin-right: 3px; }
  .pill.red { background: #fde8e8; color: #b42318; }
  .pill.green { background: #e3f5ea; color: #1f7a45; }
  .pill.yellow { background: #fff4d6; color: #8a5a00; }
  .pill.orange { background: #ffe2cc; color: #9a4a00; font-weight: 700; }
  .pill.blue { background: #e4ecfb; color: #234e9e; }
  /* 앞으로 2주 — 내신 시작에 붙는 학생 이름 */
  .whoat { margin: 3px 0 2px; line-height: 1.9; }
  .whoat .nm { display: inline-block; background: #f1f3f7; border-radius: 10px; padding: 1px 8px;
    margin: 0 3px 2px 0; font-size: 12px; }
  .whoat .nm i { font-style: normal; color: var(--muted); font-size: 11px; margin-left: 4px; }
  .whoat .nm i.none { color: var(--red); }

  /* 근거 자료 */
  .srcs { display: flex; flex-direction: column; gap: 8px; }
  .src { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fafbfc; }
  .src.on { background: #fff; }
  .src .sh { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; font-size: 14px; }
  .src .row { margin: 6px 0 4px; }
  .src input[type=text] { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .src .err:empty { display: none; }
  .mrow { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13px; }
  .hbox { margin-top: 14px; }
  .hq { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: #f7f8fb;
        color: var(--muted); font-size: 14px; font-weight: 700; line-height: 1; cursor: pointer; padding: 0; }
  .hq:hover { border-color: var(--navy); color: var(--navy); }
  .hq.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .hbody { margin-top: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px;
           background: #fafbfc; color: var(--text); font-size: 12px; }
  .hbody p { margin: 0 0 6px; line-height: 1.55; }
  .hbody p:last-child { margin-bottom: 0; }
  .dvday { margin: 12px 0 4px; font-size: 13px; padding-bottom: 3px; border-bottom: 1px solid var(--line); }
  .dvrow { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; padding: 3px 0; font-size: 13px; }
  .dvrow .dvmsg { color: inherit; text-decoration: none; }  .dvrow .dvmsg:hover { text-decoration: underline; }
  .dvrow .dvsha { font-size: 11px; margin-left: auto; font-family: monospace; }

  /* 시트와 대조 */
  .dfbox { border: 1px solid #f2c94c; background: #fffbea; border-radius: 10px; padding: 8px 12px; margin: 0 0 10px; }
  .dfhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dfhead .sp { flex: 1; }
  .dfrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 4px 0; font-size: 13px; border-top: 1px solid #f2e2a8; }
  .dfrow .sp { flex: 1; }
  .dfsub { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .dfbox .err { color: var(--red); font-size: 13px; margin-top: 4px; }

  /* 한 줄 보고 */
  .rep { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-top: 5px; }
  .rep input { flex: 1; min-width: 150px; font-size: 13px; padding: 4px 7px;
    border: 1px solid var(--line); border-radius: 6px; }
  .rep .muted { font-size: 12px; }
  .reps { margin-top: 4px; }
  .repline { font-size: 13px; color: #1f3b63; background: #eef4fd; border-left: 3px solid #9dc0f0;
    border-radius: 0 6px 6px 0; padding: 3px 8px; margin-top: 3px; overflow-wrap: anywhere; }
  .repline b { margin-right: 4px; }

  /* 완료 현황 */
  .dnp { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 8px 12px 4px; margin-top: 10px; }
  .dnp h3 { margin: 0 0 4px; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .dnp h3 .sp { flex: 1; }
  .dnp .none { color: var(--muted); font-size: 13px; padding: 4px 0 6px; }
  .dnrow { display: flex; gap: 8px; align-items: baseline; padding: 4px 0; font-size: 13px;
    border-top: 1px solid var(--line); }
  .dnrow .d { color: var(--muted); font-size: 12px; flex: 0 0 62px; }
  .dnrow .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }

  /* 회의록 */
  .mdoc { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 14px 18px; margin-top: 10px; }
  .mdoc h2 { font-size: 17px; margin: 0 0 8px; }
  .mdoc h3 { font-size: 15px; margin: 18px 0 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  .mdoc h4 { font-size: 14px; margin: 14px 0 4px; color: var(--navy2); }
  .mdoc h5, .mdoc h6 { font-size: 13px; margin: 10px 0 4px; }
  .mdoc p { margin: 6px 0; line-height: 1.65; }
  .mdoc ul, .mdoc ol { margin: 6px 0; padding-left: 20px; }
  .mdoc li { margin: 3px 0; line-height: 1.6; }
  .mdoc code { background: #f1f3f7; border-radius: 3px; padding: 1px 4px; font-size: 12px; }
  .mdoc pre { background: #f7f8fb; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    overflow-x: auto; font-size: 12px; margin: 8px 0; }
  .mdoc hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .mdoc blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--line);
    background: #f7f8fb; border-radius: 0 6px 6px 0; }
  .mdoc blockquote.yellow { border-color: var(--yellow); background: #fff9e8; }
  .mdoc blockquote.blue { border-color: var(--blue); background: #eef3fb; }
  .mdoc blockquote.green { border-color: var(--green); background: #eef8f1; }
  .mdoc blockquote > b { display: block; margin-bottom: 3px; }
  .mdoc blockquote p:first-child { margin-top: 0; }
  .mdoc .tbl { margin: 8px 0; }
  .atts { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .hlkey { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px;
    background: #f7f8fb; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-bottom: 10px; }
  .hlkey .k { border-radius: 10px; padding: 1px 8px; font-weight: 700; }
  .hlkey .k.task { background: #fbd5d5; color: #7f1d1d; }
  .hlkey .k.hit { background: #cdeed7; color: #14532d; }
  /* 덩어리째 — 이름만 칠하면 무슨 이야기인지가 안 보인다 */
  .mdoc p.hl-hit, .mdoc li.hl-hit, .mdoc blockquote.hl-hit { background: #eaf7ef; box-shadow: inset 3px 0 0 #2f9e5f; }
  .mdoc p.hl-task, .mdoc li.hl-task, .mdoc blockquote.hl-task { background: #fdecec; box-shadow: inset 3px 0 0 #d94848; }
  .mdoc p.hl-hit, .mdoc p.hl-task { padding: 4px 8px; border-radius: 4px; }
  .mdoc li.hl-hit, .mdoc li.hl-task { padding: 2px 6px; border-radius: 4px; list-style-position: inside; }
  .mdoc tr.hl-hit td { background: #eaf7ef; }
  .mdoc tr.hl-task td { background: #fdecec; }
  .mdoc tr.hl-hit td:first-child { box-shadow: inset 3px 0 0 #2f9e5f; }
  .mdoc tr.hl-task td:first-child { box-shadow: inset 3px 0 0 #d94848; }
  .mdoc mark { border-radius: 3px; padding: 0 2px; }
  .mdoc mark.hit { background: #cdeed7; color: #14532d; }
  .mdoc mark.task { background: #fbd5d5; color: #7f1d1d; font-weight: 700;
    box-shadow: 0 0 0 1px #f0a8a8; }
  /* 소속으로 걸린 것 — 이름이 아니라 «담임 전원» 같은 말에 걸렸다는 표시 */
  .mdoc mark.g { border-bottom: 2px dotted currentColor; font-weight: 600; }
  .mmeta { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 10px; font-size: 13px; }

  /* 학년 업무 달력 */
  .todo { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; background: #fff; }
  .todo .task { border-bottom: 1px solid var(--line); }
  .todo .task:last-child { border-bottom: 0; }
  .calwrap { overflow-x: auto; }
  /* 월간 — 날 칸은 배경, 막대는 그 위에 눕는다 */
  .mon { min-width: 800px; margin-bottom: 12px; }
  .mhrow, .mweek { display: grid; grid-template-columns: repeat(7, minmax(112px, 1fr)); gap: 4px; }
  .mweek { grid-auto-rows: min-content; margin-bottom: 4px; }
  .mhead { text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0; font-weight: 600; }
  .mhead.wend { color: #b35d00; }
  .mday { border: 1px solid var(--line); border-radius: 6px; background: #fff; min-height: 66px;
    cursor: pointer; z-index: 0; }
  .mday:hover { border-color: var(--navy); }
  .mday.wend { background: #fafbfc; }
  .mday.out { opacity: .5; }
  .mday.inweek { background: #eef3fb; border-color: #c7d6ee; }
  .mn { font-size: 12px; font-weight: 700; z-index: 1; pointer-events: none;
    padding: 3px 5px 0; display: flex; align-items: center; gap: 4px; }
  .mn.out { opacity: .45; }
  .mn.today { color: var(--navy); }
  .mn .tn { background: var(--orange); color: #fff; border-radius: 8px; font-size: 10px;
    padding: 0 5px; font-weight: 700; }
  /* 달력 머리 — 이 달이 어떤 달인가 · 색이 뜻하는 것 */
  .calsum { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12px;
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-bottom: 8px; background: #fff; }
  .calsum b { font-size: 13px; }
  .calsum .s { color: var(--muted); }
  .calsum .s b { color: var(--text); }
  .calsum .s.bad b { color: var(--red); }
  .calleg { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; font-size: 11px;
    color: var(--muted); margin: 0 0 8px; }
  .calleg .mc { pointer-events: none; }
  /* 날 칸 안의 할 일 — 숫자만으로는 «무슨 일인지» 를 못 본다 */
  .mt { z-index: 1; pointer-events: none; padding: 0 3px 3px; display: flex; flex-direction: column; gap: 2px; }
  .mc { font-size: 10px; line-height: 1.45; border-radius: 4px; padding: 0 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: #eef1f6; color: #374151; }
  /* 마감·제출·발송 — 부원장님 달력의 검정 칩. 이 날 안에 손을 떠나야 하는 것 */
  .mc.dl { background: #1f2937; color: #fff; font-weight: 700; }
  .mc.done { background: transparent; color: var(--muted); text-decoration: line-through; }
  .mt .more { font-size: 10px; color: var(--muted); padding-left: 4px; }
  /* 손으로 넣은 일정 — 누르면 고친다 */
  .mt .ec, .bar.ec, .bar.pick, .mt [data-ctask] { pointer-events: auto; cursor: pointer; }
  .mt .ec:hover, .bar.ec:hover, .bar.pick:hover, .mt [data-ctask]:hover { outline: 1px solid var(--navy); }
  .cday [data-ctask], .todo [data-ctask] { cursor: pointer; }
  .cday [data-ctask]:hover, .todo [data-ctask]:hover { color: var(--navy); text-decoration: underline; }
  .cday .ec { display: block; margin-bottom: 3px; }
  .mc .ew { font-style: normal; opacity: .7; font-size: 9px; }
  .mc.evdone { text-decoration: line-through; opacity: .6; }
  /* 색 고르는 단추 */
  .csw { border: 1px solid var(--line); border-radius: 6px; font-size: 11px; padding: 2px 8px;
    cursor: pointer; font-weight: 600; }
  .csw.on { outline: 2px solid var(--navy); outline-offset: 1px; }
  /* 쉬는 날 — 칸을 통째로 물들인다. 칩으로 달면 할 일에 섞여 안 보인다 */
  .mday.off { background: #fdecf1; border-color: #f3ccd8; }
  .mn .hol { font-size: 10px; font-weight: 600; color: #9b2246; }
  .mn .hol.pick, .cday .ch .hol.pick { pointer-events: auto; cursor: pointer; border-bottom: 1px dotted currentColor; }
  .mn .hol.pick:hover, .cday .ch .hol.pick:hover { color: var(--navy); }
  .cday.off { background: #fdecf1; }
  .cday .ch .hol { font-size: 11px; color: #9b2246; font-weight: 600; }
  /* 이어지는 막대 */
  /* ⚠ 높이를 못 박지 않는다. 글꼴이 커지거나 줄바꿈이 생기면 글자가 잘린다. */
  .bar { z-index: 1; pointer-events: none; font-size: 11px; line-height: 1.5; min-height: 17px;
    margin: 0 1px 2px; padding: 1px 5px; border-radius: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; background: #eef1f6; color: #374151; }
  .bar.s { border-top-left-radius: 8px; border-bottom-left-radius: 8px; margin-left: 3px; }
  .bar.e { border-top-right-radius: 8px; border-bottom-right-radius: 8px; margin-right: 3px; }
  .bar .cont { opacity: .75; }
  .bar .n { display: inline-block; min-width: 13px; text-align: center; border-radius: 7px;
    background: rgba(0,0,0,.14); font-size: 9px; padding: 0 3px; margin-right: 1px; }
  .bar.exam { background: #f0ece5; color: #7c6f5f; }
  .bar.math { background: #fae3e2; color: #d6453f; font-weight: 700; }
  .bar.back { background: #e3edf5; color: #2b5f8a; }
  .bar.test { background: #fde8e8; color: #b42318; font-weight: 700; }
  .bar.class { background: #e5e7eb; color: #4b5563; }
  .wbars { display: grid; grid-template-columns: repeat(7, minmax(132px, 1fr)); gap: 6px;
    min-width: 940px; margin-bottom: 6px; }
  .wk-h { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; font-size: 14px;
    border-top: 1px solid var(--line); padding-top: 10px; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(132px, 1fr)); gap: 6px; min-width: 940px; }
  .cday { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 5px 6px; min-height: 128px; }
  .cday.wend { background: #fafbfc; }
  .cday.today { border-color: var(--navy); box-shadow: inset 0 2px 0 var(--navy); }
  .cday .ch { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--line); padding-bottom: 3px; margin-bottom: 4px; }
  .cday .ch b { font-size: 14px; color: var(--text); }
  .cday.today .ch b { color: var(--navy); }
  .cday .ch .add { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 15px;
    line-height: 1; padding: 0 2px; cursor: pointer; }
  .cday .ch .add:hover { color: var(--navy); }
  .cday .chip { font-size: 11px; padding: 2px 5px; border-radius: 4px; margin-bottom: 3px;
    background: #eef1f6; color: #374151; white-space: normal; line-height: 1.4; }
  .cday .chip.school { background: #fff4d6; color: #8a5a00; }
  .cday .chip.test { background: #fde8e8; color: #b42318; }
  .cday .ctask { display: flex; gap: 4px; align-items: flex-start; font-size: 12px; margin-bottom: 3px; }
  .cday .ctask input { margin: 2px 0 0; }
  /* 달력 칸의 닫기 표도 ✕ 다 (2026-09-12) — 할 일 화면과 같은 뜻이어야 같은 모양이다 */
  /* ⚠ 달력 칸은 바탕이 회색이라 연한 테두리는 안 보인다 — 여기서만 한 단계 진하게 */
  .cday .ctask .cbox { flex: 0 0 auto; width: 14px; height: 14px; margin-top: 1px; padding: 0;
    border: 1px solid #b9c0cc; border-radius: 3px; background: #fff; color: var(--muted);
    font-size: 10px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .cday .ctask .cbox.on { background: #eef0f4; color: var(--text); border-color: #c8cdd6; }
  .cday .ctask .cbox:disabled { opacity: .45; cursor: default; }
  .cday .ctask.done span { text-decoration: line-through; color: var(--muted); }
  .cday .ctask i { font-style: normal; font-size: 10px; color: var(--muted); }
  .cday .ctask i.rep { color: #234e9e; }

  /* 인쇄 — 부원장님 달력처럼 A4 가로 한 장. 월간만 나가고 나머지는 안 나간다 */
  @media print {
    @page { size: A4 landscape; margin: 8mm; }
    body { background: #fff; }
    .top, .nav, .todo, .wk-h, .cal, .wbars, #cal-add, .chips, .calleg, .noprint { display: none !important; }
    .card { border: 0; box-shadow: none; padding: 0; margin: 0; }
    .calwrap { overflow: visible; }
    .mon { min-width: 0; margin-bottom: 0; }
    .mday { min-height: 74px; }
    .mc { font-size: 9px; }
    /* 배경색이 안 찍히면 쉬는 날도 마감 칩도 흰 종이가 된다 */
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  /* 월간계획 */
  .pl-goal { display: flex; gap: 8px; align-items: center; border: 1px solid #c7d6ee; background: #f5f8fd; border-radius: 8px;
    padding: 6px 10px; margin-bottom: 8px; font-size: 13px; }
  .pl-goal input { flex: 1; }
  .plcal { min-width: 760px; }
  .plrow { display: grid; grid-template-columns: repeat(7, minmax(100px, 1fr)); gap: 4px; margin-bottom: 4px; }
  .pld { border: 1px solid var(--line); border-radius: 6px; background: #fff; min-height: 74px; padding: 2px 3px 4px; }
  .pld.wend { background: #fafbfc; }
  .pld.out { opacity: .45; }
  .pld.off { background: #fdecf1; border-color: #f3ccd8; }

  .pld.pick:hover { border-color: var(--navy); }
  .pln { font-size: 12px; font-weight: 700; padding: 1px 2px 3px; display: flex; gap: 4px; align-items: center; }
  .pln .hol { font-size: 10px; font-weight: 600; color: #9b2246; }
  .pln .norm { font-size: 10px; font-weight: 600; color: #1f7a4d; }
  .plc { font-size: 11px; line-height: 1.45; border-radius: 4px; padding: 1px 5px; margin-top: 2px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; background: #eef1f6; color: #374151; }
  .calleg .plc { display: inline-block; margin: 0; }
  .plc.goal { background: #1f2a44; color: #fff; font-weight: 600; }
  .plc.consult { background: #e2f4ea; color: #1f7a4d; }
  .plc.tent { background: #fff; color: #6b7280; border: 1px dashed #9ca3af; font-weight: 400; }
  .plc.done { opacity: .5; text-decoration: line-through; }
  .plc.offc { background: #fdecf1; color: #9b2246; }
  .plc[data-pli] { cursor: pointer; }
  .plc[data-pli]:hover { outline: 1px solid var(--navy); }
  table.pl-t tr.pick { cursor: pointer; }
  table.pl-t tr.pick:hover td { background: #f5f8fd; }
  .pl-note { font-size: 13px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .pl-note.pick { cursor: pointer; }
  .pl-note.pick:hover { color: var(--navy); }
  .pl-form { border: 1px solid var(--navy); border-radius: 10px; padding: 8px 12px; margin-top: 10px; background: #fff; font-size: 13px; }
  .pl-form .row { margin: 6px 0; }

  /* 업무보고 */
  .rp-state { font-size: 13px; margin: 2px 0 6px; }
  .rp-h { font-size: 14px; margin: 16px 0 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  .rp-cls { border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; background: #fff; }
  .rp-cls .row { margin-bottom: 6px; }

  .rp-two input { flex: 1; }
  .rpwrap { overflow-x: auto; }
  table.rp-t { min-width: 680px; font-size: 13px; }
  table.rp-t th { font-size: 12px; color: var(--muted); font-weight: 600; text-align: left; }
  table.rp-t td, table.rp-t th { padding: 3px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }

  .rp-task { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .rp-task .t { flex: 1 1 260px; }

  .rp-seg { display: flex; gap: 2px; }
  .rp-extra { margin-bottom: 4px; }
  .rp-move { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  .rp-move .rp-mnote { flex: 1 1 180px; }
  .rp-moves { border: 1px solid #c7d6ee; background: #f5f8fd; border-radius: 8px; padding: 6px 10px; font-size: 13px; margin-bottom: 8px; }
  .rp-mrow { margin-top: 5px; line-height: 1.8; }
  .rp-warn { font-size: 12px; color: #b35d00; margin: 10px 0 0; line-height: 1.6; }
  textarea[data-rpf] { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; }
  .rp-sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 6px; margin-bottom: 8px; }
  .rp-sum div { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); background: #fff; }
  .rp-sum b { display: block; font-size: 18px; color: var(--text); }

  .rp-asks div { margin-top: 3px; }
  .rp-dig { width: 100%; box-sizing: border-box; font: 12px/1.5 ui-monospace, Consolas, monospace; }
  .rp-card { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin: 10px 0; background: #fafbfc; }

  .rp-sub { font-size: 13px; margin-top: 6px; }

  .banner.rp-late { background: #fff4f4; border-color: #f0a8a8; }

  /* 반별 배치표 — 열 하나가 반 */
  .gridwrap { overflow: auto; max-height: calc(100vh - 300px); border: 1px solid var(--line); border-radius: 8px; }
  .gh { margin: 14px 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: center; }
  .gh:first-child { margin-top: 4px; }
  table.cgrid { border-collapse: separate; border-spacing: 0; width: auto; font-size: 12px; }
  table.cgrid th, table.cgrid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 3px 6px; white-space: nowrap; vertical-align: middle; }
  table.cgrid thead th { position: sticky; top: 0; z-index: 2; background: #eef1f6; text-align: center;
    min-width: 132px; max-width: 190px; padding: 5px 7px; }
  table.cgrid thead th.mine { background: #dce6f8; box-shadow: inset 0 3px 0 var(--navy); }
  table.cgrid .cn { font-weight: 700; white-space: normal; line-height: 1.25; }
  table.cgrid .cm { font-weight: 400; color: var(--muted); font-size: 11px; }
  table.cgrid .cnt { font-weight: 700; color: var(--text); }
  table.cgrid .cnt.red { color: var(--red); } table.cgrid .cnt.orange { color: #b35d00; }
  table.cgrid th.rn { position: sticky; left: 0; z-index: 3; background: #f7f8fb; color: var(--muted);
    text-align: right; min-width: 30px; font-weight: 400; }
  table.cgrid thead th.rn { z-index: 4; }
  table.cgrid td { background: #fff; }
  table.cgrid td.dim { opacity: .22; }
  table.cgrid .nm { display: inline-block; padding: 1px 6px; border-radius: 4px; }
  table.cgrid .nm i { font-style: normal; opacity: .65; margin-left: 2px; font-size: 11px; }
  table.cgrid .sch { margin-left: 4px; font-size: 10px; color: var(--muted); }

  /* 명단 편집 시트 */
  /* 기본 table 은 width:100% 라 화면이 좁으면 칸을 줄여 글씨를 자른다.
     최소 폭을 박아 두면 대신 상자가 가로로 굴러간다. */
  table.sheet-t { min-width: 880px; }
  table.sheet-t td { padding: 2px 4px; }
  /* 가로로 밀어도 누구 줄인지 보이게 번호·이름은 왼쪽에 붙여 둔다.
     배경은 tr.gN td 가 이미 칠해 주므로 따로 주지 않는다(학년 색이 살아 있어야 한다). */
  table.sheet-t th:nth-child(1), table.sheet-t td:nth-child(1) { position: sticky; left: 0; z-index: 1; }
  table.sheet-t th:nth-child(2), table.sheet-t td:nth-child(2) { position: sticky; left: 34px; z-index: 1;
    box-shadow: 1px 0 0 var(--line); }
  table.sheet-t thead th:nth-child(1), table.sheet-t thead th:nth-child(2) { z-index: 3; }
  table.sheet-t tr.clsrow td { position: static; }
  table.sheet-t input[type=text], table.sheet-t select { width: 100%; border: 1px solid transparent; background: transparent;
    border-radius: 4px; padding: 3px 5px; font: inherit; font-size: 13px; color: inherit; }
  table.sheet-t input[type=text]:hover, table.sheet-t select:hover { border-color: var(--line); background: #fff; }
  table.sheet-t input[type=text]:focus, table.sheet-t select:focus { border-color: var(--navy); background: #fff; outline: none; }
  table.sheet-t input.ok, table.sheet-t select.ok { background: #e3f5ea; border-color: #2f9e5f; }
  table.sheet-t input.bad, table.sheet-t select.bad { background: #fde8e8; border-color: var(--red); }
  table.sheet-t .rowbtns { white-space: nowrap; }
  table.sheet-t .rowbtns .pin { padding: 2px 6px; font-size: 11px; margin-right: 2px; }
  table.sheet-t .cls-btn { max-width: 180px; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  table.sheet-t tr.clsrow td { background: #f7f8fb; white-space: normal; }
  table.sheet-t tr.newrow input { border: 1px dashed var(--line); background: #fff; }
  table.sheet-t tr.jump td { box-shadow: inset 0 0 0 2px var(--orange); }
  table.cgrid .nm.ghost { background: #fde8e8; color: #b42318; text-decoration: line-through;
    outline: 1px dashed #d94848; }
  table.cgrid .nm[data-open] { cursor: pointer; }
  table.cgrid .nm[data-open]:hover { outline: 2px solid var(--navy); }

  tr.skip td { opacity: .45; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  table.sheet-t.ts { min-width: 780px; }
  table.sheet-t.tm { min-width: 1020px; }
  table.sheet-t.ts input[type=number] { text-align: right; }
  table.sheet-t.ts input.green { color: #1f7a45; font-weight: 700; }
  table.sheet-t.ts input.blue { color: #234e9e; font-weight: 700; }
  table.sheet-t.ts input.red { color: #b42318; font-weight: 700; }

  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { background: #eef1f6; }
  th.sortable .ar { font-size: 10px; color: var(--navy); }
  th.sortable .ar.off { color: #c3cad6; }

  /* 내신 참여표 — 날짜 띠·칠하는 달력 */
  table.cgrid.strip th, table.cgrid.strip td { min-width: 21px; max-width: 21px; padding: 3px 1px;
    text-align: center; font-size: 11px; }
  table.cgrid.strip th.rn, table.cgrid.strip thead th.rn { min-width: 78px; max-width: 78px; text-align: left;
    padding: 3px 6px; font-size: 12px; font-weight: 600; color: var(--text); }
  table.cgrid.strip th.wd { font-size: 9px; padding: 1px; font-weight: 400; }
  table.cgrid.strip thead th { min-height: 0; }
  table.cgrid.paint td:hover { outline: 2px solid var(--navy); }
  .entry { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .entry .row { margin: 4px 0; }
  .entry input[type=text] { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }

  /* 학년 색 — 표 줄과 알약이 같은 색 */
  tr.g0 td { background: #eaf3ff; }  .pill.g0, .nm.g0, .mc.g0 { background: #cfe2ff; color: #1d4f9c; }   /* 중3 파랑 */
  tr.g1 td { background: #eaf8ee; }  .pill.g1, .nm.g1, .mc.g1 { background: #cdeed7; color: #1f6b3a; }   /* 고1 초록 */
  tr.g2 td { background: #fff7e3; }  .pill.g2, .nm.g2, .mc.g2 { background: #ffe7a8; color: #7a5200; }   /* 고2 노랑 */
  tr.g3 td { background: #fdecf1; }  .pill.g3, .nm.g3, .mc.g3 { background: #f9cfdb; color: #9b2246; }   /* 고3 분홍 */
  tr.g9 td { background: #f3f4f6; }  .pill.g9, .nm.g9, .mc.g9 { background: #e5e7eb; color: #4b5563; }   /* 학년 없음 */
  .chips input.mini { padding: 3px 8px; }
  .bar { height: 8px; background: #eef1f6; border-radius: 4px; overflow: hidden; min-width: 80px; }
  .bar i { display: block; height: 100%; background: var(--green); }
  .bar.low i { background: var(--red); } .bar.mid i { background: var(--orange); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
  .row input[type=text], .row input[type=date], .row select, .row textarea {
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .row input[type=text] { flex: 1; min-width: 140px; }
  .btn { background: var(--navy); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; }
  .btn.o { background: var(--orange); }
  .btn.g { background: #fff; color: var(--text); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  .task { display: flex; gap: 8px; align-items: flex-start; padding: 6px 4px;
    border-bottom: 1px solid var(--line); }
  .task:last-child { border-bottom: 0; }
  .task input[type=checkbox] { margin-top: 3px; }
  /* 줄을 닫는 칸 — 사람별 «내 완료»(✓) 와 한 줄에 같이 서 있어서 체크칸이면 헷갈린다.
     그래서 **✕ 로 그린다** (2026-09-12 마왕님). ✓ 는 «내가 했다», ✕ 는 «이 줄은 닫혔다». */
  .task .cbox { flex: 0 0 auto; width: 18px; height: 18px; margin-top: 2px; padding: 0;
    border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--muted);
    font-size: 12px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .task .cbox.on { background: #eef0f4; color: var(--text); border-color: #c8cdd6; }
  .task .cbox:disabled { opacity: .45; cursor: default; }

  .task .t.done { text-decoration: line-through; color: var(--muted); }
  .tsep { font-size: 12px; color: var(--muted); margin: 12px 0 4px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .task .m { font-size: 12px; color: var(--muted); }
  .task .m .over { color: var(--red); font-weight: 600; }
  .task .m .soon { color: #b35d00; font-weight: 600; }
  /* 회의록에서 온 할 일 — 넣기 전에 눈으로 보는 자리 */
  .fmlist { margin-top: 8px; }
  .fmrow { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-top: 1px solid #c7d8f5; }
  .fmrow .t { flex: 1; min-width: 0; }
  .fmrow .m { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .fmrow button { flex: 0 0 auto; align-self: center; white-space: nowrap; }
  .task .mk { flex: 0 0 auto; align-self: center; white-space: nowrap; }
  .task .mk.on { background: #e3f5ea; color: #1f7a45; border-color: #b7e0c6; }
  .task .x { color: var(--muted); background: none; border: 0; font-size: 14px; padding: 0 4px; }
  .task .x:hover { color: var(--red); }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .banner { background: #fff4d6; border: 1px solid #f2c94c; border-radius: 8px; padding: 10px 14px;

  .login { max-width: 380px; margin: 60px auto; }
  .login select, .login input { width: 100%; padding: 9px 10px; border: 1px solid var(--line);

    ? '<div class="banner"><b>수업관리 앱 DB에서 못 읽은 것</b> — ' + esc(S.readErr.join(", ")) + '.<br>' +
      '그 화면만 비어 있고 나머지는 그대로 돈다. climath-class 쪽 <code>firestore.rules</code> 를 본다.</div>' : "";
  if (S.teamOk) { el.innerHTML = rd + rpBannerHtml() + ro; rpBannerWire(el); return; }
  el.innerHTML = rd + '<div class="banner"><b>팀체크 DB(climath-team)를 못 읽었다</b> (' + esc(S.teamErr) + ').<br>' +
    'Firebase 콘솔의 climath-team 프로젝트에서 Firestore가 켜져 있고 규칙이 게시됐는지 본다. 규칙은 저장소 <code>firestore.rules</code>. ' +
    '나머지 상자(앱 데이터)는 그대로 돈다.</div>' + ro;
}

// ---------- 업무보고 (2026-09-11 — 마왕님과 상의해 정하고 같은 날 올렸다) ----------
//
// 선생님이 그날 한 **수업**과 **업무**를 보고한다. 팀장이 다음 날 아침 정리해 **원장님께 바로** 올린다.
// 9/7·9/11 간부회의: 강사 퇴근 전 보고 → 팀장 다음 날 출근 30분 정리 → 원장 보고.
//   원장님이 제일 중요하다고 한 것은 **«다음 날 뭐 할지»**. 그리고 «자동화 못 하는 건 강사에게 얹지 마라».
//
// 마왕님 결정 (9/11)
//   · 수업은 **학생 단위** — 명단을 쫙 뽑고 옆에 특이사항. (특이 학생만 골라 적게 하지 않는다)
//   · 일일테스트는 안 넣는다. 수업 준비 여부도 안 넣는다 (교재를 받고 있다)
//   · 마감 시각은 없다. **다음 날 아침 8시까지 안 내면 알림** — 팀장에게도, 본인에게도
//   · 받는 사람은 원장님. 부원장님은 중등관이라 안 거친다
//   · **선생님끼리는 서로 못 본다.** 자기 것과 팀장만 — 화면이 아니라 **규칙**이 막는다
//
//   dailyReports/{tid}/days/{date}
//     { tid, name, date, submitted(처음 낸 시각), updated,
//       classes: [{ cid, name, progress, homework,
//                   students: [{ sid, name, att, auto, called, note, consult, makeup }] }],
//       tasks: [{ id, text, state, note }], extra: [{ kind, text }], toLead }
//   사람마다 칸 하나(marks·myTasks 와 같은 모양). 문서 이름이 곧 누구인지라 규칙이 남의 것을 막는다.
var RP_ATT = ["출석", "결석", "지각", "조퇴"];
var RP_STATE = { done: "완료", doing: "진행", hold: "보류" };
var RP_KINDS = ["학부모 연락", "상담", "자료 제작", "채점·검사", "행정", "기타"];
// 명단 변동 (9/11 추가) — «예비고1 S → 예비고1 T» 같은 반 이동과 퇴원을 보고에 적는다.
// 선생님은 앱 명단을 못 고친다(읽기 계정). 적어 올리면 **팀장이 보고 누른다** — 저절로 바뀌지 않는다.
//   moves: [{ kind: "move"|"leave", sid, pid, name, fromCid, fromName, toCid, toName, date, note }]
//   toCid 가 비고 toName 만 있으면 목록에 없는 곳(«중등관» 따위)이다 — 앱에 넣을 반이 없다.
var RP_MOVE = { move: "반 이동", leave: "퇴원" };
var RP_DUE_HOUR = 8;               // 그 날 보고는 **다음 날 아침 8시**까지
// 이 날부터 «안 냈다» 를 센다. 기능을 올리기 전 날들이 전부 «안 냄» 으로 뜨면 안 된다.
// 9/11(금)에 올리고 **9/14(월)부터** 센다 — 선생님들께 알릴 주말을 둔다. 그 전에 내는 것은 막지 않는다.
var RP_START = "2026-09-14";
function rpCol(tid) { return tdb.collection("dailyReports").doc(tid).collection("days"); }
function rpTeacher(tid) { return S.teachers.filter(function (t) { return t.tid === tid; })[0] || null; }

// ---- 그 날 누가 무엇을 가르쳤나 — 수업관리 앱의 판정(attendsOn · scheduledDates)을 그대로 옮긴다 ----
// ⚠ 정규반은 **반 요일**에 명단 **전원**이 대상이다. 학생마다 요일이 다른 것은 개별진도반뿐이다.
//   정규반에 학생 요일을 대면 요일이 비어 있는 학생이 전부 빠진다.
function rpIndividual(c) { return c.type === "individual"; }
function rpActiveOn(r, d) { return !(r.startDate && d < r.startDate) && !(r.endDate && d > r.endDate); }
function rpMeets(c, d) {
  if (c.endDate && d > c.endDate) return false;
  var dow = parseYmd(d).getDay();
  if (!rpIndividual(c)) return (c.classDays || []).indexOf(dow) >= 0;
  return (c.roster || []).some(function (r) { return !r.teacher && rpActiveOn(r, d) && (r.days || []).indexOf(dow) >= 0; });
}
function rpStudentsOn(c, d) {
  var dow = parseYmd(d).getDay();
  return (c.roster || []).filter(function (r) {
    if (r.teacher || !rpActiveOn(r, d)) return false;
    return !rpIndividual(c) || (r.days || []).indexOf(dow) >= 0;
  }).sort(function (a, b) { return String(a.name || "").localeCompare(String(b.name || ""), "ko"); });
}
// 그 선생님이 그 날 들어간 반. 쉬는 날에는 없다(업무 달력의 쉬는 날과 같은 것을 본다).
function rpClassesOn(tid, d) {
  var t = rpTeacher(tid);
  if (!t || holidayOf(d)) return [];
  return S.classes.filter(function (c) { return (t.classIds || []).indexOf(c.id) >= 0 && rpMeets(c, d); });
}
// 그 날 걸린 **매주 하는 일**이 있나 (2026-09-12).
// 교재 업로드처럼 수업 없는 날(일·수)에 하는 일이 있다. 보고에 줄은 떠도 그 날이 «보고하는 날»이
// 아니면 아무도 안 쫓는다 — 그래서 반복 할 일이 걸린 날도 보고하는 날로 센다.
// ⚠ 그 날 이미 체크한 것은 안 센다. 체크하면 줄이 사라지는데 날만 남으면 빈 보고를 내라는 말이 된다.
// ⚠ 쉬는 날은 세지 않는다 — 수업과 같은 규칙이다.
function rpRepeatOn(tid, d) {
  if (holidayOf(d)) return false;
  var name = teacherName(tid), dow = parseYmd(d).getDay();
  return (S.tasks || []).some(function (t) {
    if (!t.repeat || !t.repeat.dow || t.repeat.dow.indexOf(dow) < 0) return false;
    if (t.doneOn && t.doneOn[d]) return false;
    return taskIsFor(t, name);
  });
}
// 보고해야 하는 날 = 수업이 있는 날 **또는 매주 하는 일이 걸린 날**.
// 그 밖의 날에 적는 것은 막지 않지만 «안 냈다» 로 세지는 않는다.
function rpExpected(tid, d) { return d >= RP_START && (rpClassesOn(tid, d).length > 0 || rpRepeatOn(tid, d)); }
function rpDeadline(d) { var x = parseYmd(addDays(d, 1)); x.setHours(RP_DUE_HOUR, 0, 0, 0); return x.getTime(); }
function rpGot(tid, d) { var m = (S.reports || {})[tid]; return !!(m && m[d] && m[d].submitted); }
// 8시가 지났는데 안 낸 날 (최근 14일). 이게 알림이다 — 팀장 화면에는 사람마다, 본인 화면에는 자기 것.
function rpOverdue(tid, now) {
  var ms = now ? now.getTime() : Date.now(), today = ymd(new Date(ms)), out = [];
  for (var i = 1; i <= 14; i++) {
    var d = addDays(today, -i);
    if (rpExpected(tid, d) && rpDeadline(d) <= ms && !rpGot(tid, d)) out.push(d);
  }
  return out.sort();
}
function rpOverdueAll(now) {
  return S.teachers.map(function (t) { return { tid: t.tid, name: t.name, days: rpOverdue(t.tid, now) }; })
    .filter(function (x) { return x.days.length; });
}

// ---- 보고에 뜨는 할 일 — 그 날까지 기한인 내 할 일 + 그 날 끝낸 것 ----
// 월요일 간부회의에서 나온 일은 금요일에 빠짐없이 답이 있어야 한다(9/11). 보고가 그 답이 된다.
function rpTasksFor(tid, d) {
  var name = teacherName(tid), dow = parseYmd(d).getDay();
  return (S.tasks || []).filter(function (t) {
    if (!taskIsFor(t, name)) return false;
    var md = markDate(tid, t.id);
    if (md === d) return true;                               // 그 날 끝낸 것
    if (t.repeat && t.repeat.dow) return t.repeat.dow.indexOf(dow) >= 0 && !(t.doneOn && t.doneOn[d]);
    if (md || t.status === "done") return false;
    return !!t.due && t.due <= d;                            // 기한이 그 날까지(지난 것 포함)
  });
}

// ---- 쓰는 판 — 저장된 보고가 있으면 그것, 없으면 앱이 아는 것으로 채운다 ----
// ⚠ 명단은 **다시 뽑는다.** 저장된 보고의 명단을 그대로 쓰면 그 사이 들어온 학생이 안 보인다.
//   적어 둔 것은 학생 id 로 다시 붙인다.
function rpDraft(tid, d, prev) {
  prev = prev || {};
  var classes = rpClassesOn(tid, d).map(function (c) {
    var pc = (prev.classes || []).filter(function (x) { return x.cid === c.id; })[0] || {};
    return { cid: c.id, name: c.name, progress: pc.progress || "", homework: pc.homework || "",
      attRead: false,
      students: rpStudentsOn(c, d).map(function (r) {
        var ps = (pc.students || []).filter(function (x) { return x.sid === r.id; })[0] || null;
        return { sid: r.id, pid: r.pid || "", name: r.name, auto: ps ? (ps.auto || "") : "", att: ps ? (ps.att || "") : "",
          called: ps ? !!ps.called : false, note: ps ? (ps.note || "") : "",
          consult: ps ? ps.consult : null, makeup: ps ? ps.makeup : null };
      }) };
  });
  var tasks = rpTasksFor(tid, d).map(function (t) {
    var pt = (prev.tasks || []).filter(function (x) { return x.id === t.id; })[0] || null;
    return { id: t.id, text: t.text, due: t.due || "", state: pt ? pt.state : (markDate(tid, t.id) === d ? "done" : ""),
             note: pt ? (pt.note || "") : "" };
  });
  return { tid: tid, name: teacherName(tid), date: d, classes: classes, tasks: tasks,
    extra: (prev.extra || []).slice(), toLead: prev.toLead || "",
    moves: (prev.moves || []).map(function (m) { return Object.assign({}, m); }),
    submitted: prev.submitted || 0, updated: prev.updated || 0 };
}
// 명단 변동에서 고를 학생 — 그 날 수업이 없어도 **내 반 학생은 전부**. 개별진도반은 요일이 달라 그 날 명단에 없을 수 있다.
function rpMyRoster(tid, d) {
  var t = rpTeacher(tid), out = [];
  if (!t) return out;
  S.classes.forEach(function (c) {
    if ((t.classIds || []).indexOf(c.id) < 0 || (c.endDate && d > c.endDate)) return;
    (c.roster || []).forEach(function (r) {
      if (r.teacher || !rpActiveOn(r, d)) return;
      out.push({ cid: c.id, cname: c.name, sid: r.id, pid: r.pid || "", name: r.name });
    });
  });
  return out.sort(function (a, b) { return a.cname.localeCompare(b.cname, "ko") || String(a.name).localeCompare(String(b.name), "ko"); });
}
// 옮겨 갈 수 있는 반 — 그 날 끝나지 않은 반 전부(남의 반 포함).
function rpMoveTargets(d, fromCid) {
  return S.classes.filter(function (c) { return c.id !== fromCid && !(c.endDate && d > c.endDate); })
    .sort(function (a, b) { return String(a.name).localeCompare(String(b.name), "ko"); });
}
function rpMoveText(m) {
  if (m.kind === "leave") return (m.fromName ? m.fromName + " · " : "") + "퇴원";
  return (m.fromName || "?") + " → " + (m.toName || "?");
}
// 앱 명단에 반영됐나. ⚠ **pid 로 맞춘다** — 반마다 명단 번호(sid)가 따로라, 새 반에서는 sid 가 다르다.
//   pid 가 없는 옛 줄은 옛 반에서만 sid 로 찾고, 새 반은 이름으로 본다.
function rpInClass(cid, m) {
  var c = S.classes.filter(function (x) { return x.id === cid; })[0];
  if (!c) return false;
  return (c.roster || []).some(function (r) {
    if (r.teacher || isEnded(r)) return false;
    if (m.pid) return r.pid === m.pid;
    return cid === m.fromCid ? r.id === m.sid : r.name === m.name;
  });
}
function rpMoveState(m) {
  if (m.kind === "leave") {
    var still = S.classes.filter(function (c) { return rpInClass(c.id, m); });
    return still.length ? { done: false, text: "앱 명단에 아직 있다 — " + still.map(function (c) { return c.name; }).join(", ") }
                        : { done: true, text: "앱에서 뺐다" };
  }
  var inFrom = rpInClass(m.fromCid, m), inTo = m.toCid ? rpInClass(m.toCid, m) : null;
  if (!inFrom && inTo !== false) return { done: true, text: m.toCid ? "앱에 옮겼다" : "옛 반에서 뺐다" };
  if (inFrom && inTo) return { done: false, text: "새 반에는 들어갔는데 옛 반에도 남아 있다" };
  if (!inFrom && inTo === false) return { done: false, text: "옛 반에서는 빠졌는데 새 반에 없다" };
  return { done: false, text: "앱에 아직 안 옮겼다" };
}
// 팀장이 누르면 앱 명단을 바꾼다 — 학생 명단 메뉴의 반에 넣기·빼기(stAssign·stUnassign)를 그대로 쓴다.
// 그래서 명단 변경 기록에도 남고, 옛 명단 번호도 pastIds 에 적힌다(다시 오면 기록이 이어진다).
// ⚠ **pid 가 없으면 안 한다.** stUnassign 은 `r.pid !== pid` 로 거르는데, pid 가 undefined 면
//   **pid 없는 줄이 전부** 빠진다. 그런 학생은 학생 명단 메뉴에서 손으로 옮긴다.
// 퇴원은 **반에서 빼기**다. 사람 문서는 안 지운다(출결·과제가 그 번호에 달려 있다).
async function rpApplyMove(m) {
  if (S.ro) throw new Error("팀장만 앱 명단을 고친다");
  if (!m.pid) throw new Error("이 학생은 명단에 학생 번호가 없다 — 학생 명단 메뉴에서 직접 옮겨 주세요");
  if (m.kind === "leave") {
    var inCls = S.classes.filter(function (c) { return rpInClass(c.id, m); });
    for (var i = 0; i < inCls.length; i++) await stUnassign(inCls[i].id, m.pid);
    return;
  }
  if (m.toCid && !rpInClass(m.toCid, m)) await stAssign(m.toCid, S.byPid[m.pid] || { pid: m.pid, name: m.name });
  if (rpInClass(m.fromCid, m)) await stUnassign(m.fromCid, m.pid);
}
// 보고로 올라왔는데 앱에 아직 안 옮긴 것 — 읽어 둔 보고 전부(최근 3주)에서. 팀장 알림 띠가 이걸 센다.
function rpPendingMoves() {
  var out = [];
  Object.keys(S.reports || {}).forEach(function (tid) {
    var m = S.reports[tid] || {};
    Object.keys(m).sort().forEach(function (d) {
      var rep = m[d];
      if (!(rep && rep.submitted)) return;
      (rep.moves || []).forEach(function (mv) { if (!rpMoveState(mv).done) out.push({ tid: tid, d: d, m: mv }); });
    });
  });
  return out;
}
// 수업관리 앱에서 읽은 것을 판에 얹는다. app = { cid: { att: {sid:true}|null, consult: {sid:[..]}, makeup: {sid:{..}} } }
// 앱에 출석이 찍혔으면 출석, 안 찍혔으면 결석. **못 읽었으면 비운다** — 모르는 걸 결석으로 적지 않는다.
// ⚠ **선생님이 이미 고른 출결은 안 덮는다.** 앱은 «찍혔나» 만 알고, 지각·조퇴·늦게 찍은 것은 선생님이 안다.
function rpApplyApp(rep, app) {
  rep.classes.forEach(function (c) {
    var ad = (app && app[c.cid]) || {};
    c.attRead = !!ad.att;
    c.students.forEach(function (s) {
      var auto = ad.att ? (ad.att[s.sid] ? "출석" : "결석") : "";
      if (auto) s.auto = auto;
      if (!s.att) s.att = auto;
      var cs = (ad.consult && ad.consult[s.sid]) || [];
      if (cs.length) s.consult = Math.max.apply(null, cs.map(function (x) { return Number(x.risk) || 0; }));
      var mk = ad.makeup && ad.makeup[s.sid];
      if (mk) s.makeup = mk.planned || mk.date || "";
    });
  });
  return rep;
}
// 내기 전에 걸리는 것. 대부분 알려만 준다.
// «내일 할 일» 칸은 처음엔 필수였다가 **뺐다**(9/11 마왕님). 금·토에 수업 없는 사람도 뭔가 적어야 했고, 막으면 한 줄로 때운다.
// 나머지는 알려만 준다. 다 막으면 5분 안에 못 낸다.
function rpCheck(rep) {
  var stop = [], warn = [];
  rep.classes.forEach(function (c) {
    var none = c.students.filter(function (s) { return !s.att; }).length;
    if (none) warn.push(c.name + " — 출결을 안 고른 학생 " + none + "명");
    var nc = c.students.filter(function (s) { return s.att === "결석" && !s.called; }).length;
    if (nc) warn.push(c.name + " — 결석인데 연락 안 한 학생 " + nc + "명");
    if (!String(c.progress || "").trim()) warn.push(c.name + " — 진도가 비었다");
  });
  // 명단 변동은 학생을 골랐으면 끝까지 — «어디로» 가 빈 반 이동은 팀장이 받아도 할 수 있는 게 없다.
  // 학생도 안 고른 줄은 막지 않고 버린다(rpClean).
  (rep.moves || []).forEach(function (m) {
    if (!m.name || m.kind !== "move") return;
    if (!m.toCid && !String(m.toName || "").trim()) stop.push("반 이동 — " + m.name + ": 어느 반으로 가는지 골라야 낼 수 있다");
  });
  return { stop: stop, warn: warn };
}
// 저장할 모양. 화면에만 쓰는 칸(attRead · due)은 뗀다.
function rpClean(rep) {
  return { tid: rep.tid, name: rep.name, date: rep.date,
    classes: rep.classes.map(function (c) {

// ⚠ **자기 칸에만 쓴다.** 팀장도 남의 보고는 못 고친다 — 규칙도 같다(tid == myTid()).
//   선생님은 읽기 계정이라 쓰기 가로채기(guardWrites)를 passWrite 로 한 번 연다 (toggleMyMark 와 같다).
// ⚠ 이름을 saveReport 로 지었다가 «한 줄 보고» 의 saveReport(id, text) 와 겹쳐 **조용히 덮였다** (2026-09-11).
//   나중 선언이 이긴다 — 문법도 멀쩡하고 저장은 엉뚱하게 marks 로 갔다. test-wiring 이 이제 겹치는 이름을 잡는다.
async function saveDailyReport(rep) {
  var tid = myTid();
  if (!tid) throw new Error("누구인지 알 수 없다");
  if (rep.tid !== tid) throw new Error("남의 보고는 고칠 수 없다");
  var chk = rpCheck(rep);
  if (chk.stop.length) throw new Error(chk.stop.join(" · "));
  var now = Date.now(), prev = ((S.reports || {})[tid] || {})[rep.date];
  var doc = Object.assign(rpClean(rep), { submitted: (prev && prev.submitted) || now, updated: now });
  await passWrite(function () { return rpCol(tid).doc(rep.date).set(doc); });
  S.reports = S.reports || {}; S.reports[tid] = S.reports[tid] || {}; S.reports[tid][rep.date] = doc;
  // ⚠ **처음 올릴 때만** 팀장 폰을 울린다. 고칠 때마다 울리면 하루에 열 번이고, 그러면 끄게 된다.
  if (!prev || !prev.submitted) pingLead("report");
  // 보고에서 «완료» 로 고른 할 일은 **내 완료 표시**로도 남긴다 — 할 일 메뉴·완료 현황이 같은 것을 보게.
  var todo = doc.tasks.filter(function (t) { return t.state === "done" && !markDate(tid, t.id); });

}
// 팀장은 전부, 선생님은 자기 것만 읽는다. **선생님이 남의 칸을 부르면 규칙이 거절한다** — 그래서 아예 안 부른다.

// 쓰는 판을 열 때만 수업관리 앱을 읽는다 — 출석·상담·보강. 못 읽은 것은 비워 둔다(결석으로 적지 않는다).

// ---- 팀장이 아침에 보는 것 · 원장님께 올리는 것 ----
function rpSummary(d) {
  var sm = { expect: [], got: [], missing: [], noCall: [], notes: [], asks: [], moves: [] };
  S.teachers.forEach(function (t) {
    var rep = ((S.reports || {})[t.tid] || {})[d];
    var exp = rpExpected(t.tid, d);
    if (exp) sm.expect.push(t.tid);
    if (!(rep && rep.submitted)) { if (exp) sm.missing.push(t.tid); return; }
    sm.got.push(t.tid);
    (rep.classes || []).forEach(function (c) {
      (c.students || []).forEach(function (s) {
        if (s.att === "결석" && !s.called) sm.noCall.push({ tid: t.tid, who: t.name, cls: c.name, name: s.name });
        if (s.note || (s.att && s.att !== "출석")) sm.notes.push({ tid: t.tid, who: t.name, cls: c.name, name: s.name, att: s.att, note: s.note, called: s.called });
      });
    });
    (rep.moves || []).forEach(function (m) { sm.moves.push({ tid: t.tid, who: t.name, m: m }); });
    if (rep.toLead) sm.asks.push({ tid: t.tid, who: t.name, text: rep.toLead });
  });
  return sm;
}
// 원장님께 올리는 한 장 — **마크다운**이다. 원장님이 회의록을 AI 에 넣어 읽는다고 했다(9/11). 표보다 글이 잘 읽힌다.
function rpDigest(d) {
  var sm = rpSummary(d), L = [];
  var nm = function (tid) { return teacherName(tid); };
  L.push("# 고등부 업무보고 — " + fmtMD(d));
  L.push("");
  L.push("- 낸 사람 " + sm.got.length + " / 수업한 사람 " + sm.expect.length +
    (sm.missing.length ? " · **안 낸 사람: " + sm.missing.map(nm).join(", ") + "**" : ""));
  if (sm.noCall.length) L.push("- **결석인데 연락 안 된 학생 " + sm.noCall.length + "명** — " +
    sm.noCall.map(function (x) { return x.name + "(" + x.cls + ")"; }).join(", "));
  if (sm.moves.length) L.push("- **명단 변동 " + sm.moves.length + "건** — " +
    sm.moves.map(function (x) { return x.m.name + " " + rpMoveText(x.m) + (x.m.date ? "(" + fmtMD(x.m.date) + ")" : ""); }).join(", "));
  if (sm.asks.length) L.push("- 요청 " + sm.asks.length + "건");
  sm.got.forEach(function (tid) {
    var rep = S.reports[tid][d];
    L.push(""); L.push("## " + nm(tid));
    (rep.classes || []).forEach(function (c) {
      var st = c.students || [], come = st.filter(function (s) { return s.att === "출석" || s.att === "지각" || s.att === "조퇴"; }).length;
      L.push("");
      L.push("**" + c.name + "** · 출석 " + come + "/" + st.length +
        (c.progress ? " · 진도: " + c.progress : "") + (c.homework ? " · 과제: " + c.homework : ""));
      st.filter(function (s) { return s.note || (s.att && s.att !== "출석"); }).forEach(function (s) {
        L.push("- " + s.name + " — " + (s.att && s.att !== "출석" ? s.att + (s.att === "결석" ? (s.called ? "(연락함)" : "(**연락 안 함**)") : "") + (s.note ? " · " : "") : "") + (s.note || ""));
      });
    });
    var tk = rep.tasks || [];
    if (tk.length) {
      L.push(""); L.push("업무");
      tk.forEach(function (t) { L.push("- [" + (RP_STATE[t.state] || "—") + "] " + t.text + (t.note ? " — " + t.note : "")); });
    }
    (rep.extra || []).forEach(function (x) { L.push("- (" + x.kind + ") " + x.text); });
    (rep.moves || []).forEach(function (m) {
      L.push("- (" + RP_MOVE[m.kind] + ") " + m.name + " " + rpMoveText(m) + (m.date ? " · " + fmtMD(m.date) + "부터" : "") + (m.note ? " — " + m.note : ""));
    });
    if (rep.toLead) { L.push(""); L.push("요청: " + rep.toLead); }
  });
  return L.join("\n");

          '<option value="__other"' + (other ? " selected" : "") + '>목록에 없는 곳 — 직접 적기</option></select>' +
          (other ? '<input type="text" data-rpm="' + mi + '|toName" value="' + esc(m.toName || "") + '" placeholder="예: 중등관 · 다른 관" style="width:140px"' + RPK + '>' : "")
        : "") +
      '<label class="muted" style="font-size:12px">' + (m.kind === "leave" ? "마지막 수업" : "옮기는 날") +
      ' <input type="date" data-rpm="' + mi + '|date" value="' + esc(m.date || d) + '"' + RPK + '></label>' +
      '<input type="text" data-rpm="' + mi + '|note" value="' + esc(m.note || "") + '" placeholder="' + (m.kind === "leave" ? "퇴원 사유" : "왜 옮기나") + '" class="rp-mnote"' + RPK + '>' +
      (st ? '<span class="pill ' + (st.done ? "green" : "") + '">' + esc(st.done ? "팀장이 앱에 반영함" : "팀장 확인 전") + '</span>' : "") +
      '<button class="x" data-rpmdel="' + mi + '"' + RPK + ' title="이 줄 빼기">×</button></div>';
  }).join("") +
    '<div class="row"><button class="mini" data-rpmadd="move"' + RPK + '>＋ 반 이동</button>' +
    '<button class="mini" data-rpmadd="leave"' + RPK + '>＋ 퇴원</button>' +
    (roster.length ? "" : '<span class="muted" style="font-size:12px">맡은 반 명단이 없다</span>') + '</div>';

  // 업무 — 할 일
  h += '<h3 class="rp-h">업무 <span class="muted" style="font-size:12px;font-weight:400">— 그 날까지 기한인 내 할 일. «완료» 는 할 일 메뉴의 내 완료로도 남는다</span></h3>';
  h += rep.tasks.length ? rep.tasks.map(function (t, ti) {
    return '<div class="rp-task"><div class="t">' + esc(t.text) +
      (t.due ? ' <span class="muted" style="font-size:12px">' + esc(fmtMD(t.due)) + (t.due < d ? ' · 기한 지남' : "") + '</span>' : "") + '</div>' +
      '<div class="rp-seg">' + Object.keys(RP_STATE).map(function (k) {
        return '<button class="mini' + (t.state === k ? " on" : "") + '" data-rpk="' + ti + '|' + k + '"' + RPK + '>' + RP_STATE[k] + '</button>';
      }).join("") + '</div>' +
      '<input type="text" data-rpn="' + ti + '" value="' + esc(t.note) + '" placeholder="한 줄 (보류면 왜)"' + RPK + '></div>';
  }).join("") : '<p class="muted" style="font-size:13px">그 날까지 기한인 내 할 일이 없다.</p>';

  h += '<h3 class="rp-h">할 일에 없던 업무</h3>' +
    rep.extra.map(function (x, xi) {
      return '<div class="row rp-extra"><select data-rpx="' + xi + '|kind"' + RPK + '>' +
        RP_KINDS.map(function (k) { return '<option' + (k === x.kind ? " selected" : "") + '>' + k + '</option>'; }).join("") + '</select>' +
        '<input type="text" data-rpx="' + xi + '|text" value="' + esc(x.text) + '" placeholder="무엇을 했나" style="flex:1"' + RPK + '>' +
        '<button class="x" data-rpxdel="' + xi + '"' + RPK + ' title="이 줄 빼기">×</button></div>';
    }).join("") +
    '<button class="mini" data-rpxadd' + RPK + '>＋ 한 줄</button>';

  h += '<h3 class="rp-h">팀장에게</h3>' +
    '<textarea data-rpf="toLead" rows="2" placeholder="막힌 것 · 필요한 것 · 데스크에 부탁할 것 (없으면 비움)"' + RPK + '>' + esc(rep.toLead) + '</textarea>';

  h += (chk.warn.length ? '<div class="rp-warn">' + chk.warn.map(esc).join("<br>") + '</div>' : "") +
    '<div class="row" style="margin-top:10px"><button class="btn" data-rpsave' + RPK + '>' + (saved && saved.submitted ? "다시 내기" : "제출") + '</button>' +
    '<span class="muted" style="font-size:12px">' + (S.ro ? "팀장만 본다. 다른 선생님은 못 본다." : "팀장 것도 같은 칸에 적는다.") + '</span></div>';
  box.innerHTML = h;
  rpWireMine(box);
}
function rpWireMine(box) {
  var rep = S.rpEdit.rep;
  var re = function () { keepScrollIn("#sec-report", renderReport); };
  // 글자 칸은 **다시 그리지 않는다** — 다시 그리면 치던 칸에서 포커스가 날아간다
  $$("[data-rpc]", box).forEach(function (i) {
    i.oninput = function () { var k = i.getAttribute("data-rpc").split("|"); rep.classes[+k[0]][k[1]] = i.value; };
  });
  $$("[data-rps]", box).forEach(function (i) {
    var k = i.getAttribute("data-rps").split("|"), s = rep.classes[+k[0]].students[+k[1]];
    if (k[2] === "note") i.oninput = function () { s.note = i.value; };
    else if (k[2] === "called") i.onchange = function () { s.called = i.checked; re(); };
    else i.onchange = function () { s.att = i.value; if (s.att !== "결석") s.called = false; re(); };   // 결석일 때만 «연락함» 이 뜬다
  });
  $$("[data-rpk]", box).forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute("data-rpk").split("|"), t = rep.tasks[+k[0]];
      t.state = t.state === k[1] ? "" : k[1]; re();                // 한 번 더 누르면 푼다
    };
  });
  $$("[data-rpn]", box).forEach(function (i) { i.oninput = function () { rep.tasks[+i.getAttribute("data-rpn")].note = i.value; }; });
  $$("[data-rpx]", box).forEach(function (i) {
    var k = i.getAttribute("data-rpx").split("|");
    var f = function () { rep.extra[+k[0]][k[1]] = i.value; };
    i.oninput = f; i.onchange = f;
  });
  $$("[data-rpxdel]", box).forEach(function (b) { b.onclick = function () { rep.extra.splice(+b.getAttribute("data-rpxdel"), 1); re(); }; });
  var add = $("[data-rpxadd]", box);
  if (add) add.onclick = function () { rep.extra.push({ kind: RP_KINDS[0], text: "" }); re(); };
  $$("[data-rpf]", box).forEach(function (i) { i.oninput = function () { rep[i.getAttribute("data-rpf")] = i.value; }; });
  // 명단 변동
  var mroster = rpMyRoster(rep.tid, rep.date);
  $$("[data-rpmadd]", box).forEach(function (b) {
    b.onclick = function () {
      rep.moves.push({ kind: b.getAttribute("data-rpmadd"), sid: "", pid: "", name: "", fromCid: "", fromName: "", toCid: "", toName: "", date: rep.date, note: "" });
      re();
    };
  });
  $$("[data-rpmdel]", box).forEach(function (b) { b.onclick = function () { rep.moves.splice(+b.getAttribute("data-rpmdel"), 1); re(); }; });
  $$("[data-rpm]", box).forEach(function (i) {
    var k = i.getAttribute("data-rpm").split("|"), m = rep.moves[+k[0]];
    if (k[1] === "who") i.onchange = function () {
      var p = i.value.split("|"), r = mroster.filter(function (x) { return x.cid === p[0] && x.sid === p[1]; })[0];
      Object.assign(m, r ? { sid: r.sid, pid: r.pid, name: r.name, fromCid: r.cid, fromName: r.cname }
                         : { sid: "", pid: "", name: "", fromCid: "", fromName: "" });
      if (m.toCid && m.toCid === m.fromCid) { m.toCid = ""; m.toName = ""; }   // 같은 반으로는 못 간다
      re();
    };
    else if (k[1] === "to") i.onchange = function () {
      if (i.value === "__other") { m.toCid = ""; m.toName = ""; m.toOther = true; }
      else { m.toCid = i.value; m.toName = i.value ? className(i.value) : ""; m.toOther = false; }
      re();
    };
    else if (k[1] === "date") i.onchange = function () { m.date = i.value || rep.date; };
    else i.oninput = function () { m[k[1]] = i.value; };      // toName · note — 다시 그리지 않는다
  });
  var go = $("[data-rpsave]", box);
  if (go) go.onclick = async function () {
    var chk = rpCheck(rep);
    if (chk.stop.length) { alert(chk.stop.join("\n")); return; }
    if (chk.warn.length && !confirm("이대로 낼까?\n\n" + chk.warn.join("\n"))) return;
    go.disabled = true;
    try { await saveDailyReport(rep); S.rpEdit = null; renderBanner(); renderReport(); }
    catch (e) { go.disabled = false; alert("내지 못했다: " + e.message); }
  };
}

            (m.pid && (m.kind === "leave" || m.toCid || rpInClass(m.fromCid, m))

// ---------- 월간계획 (2026-09-11) ----------
//
// 업무 달력과 **따로 둔다**(마왕님). 업무 달력은 «내가 이번 주에 뭘 하나» — 할 일·시험·종강·일정이 다 뜬다.
// 월간계획은 **팀 단위로 이 달에 끝낼 것**만. 9/10 계획표 첫 판을 보고 마왕님이
//   «월간 계획표에 들어가야 하는 건 반 단위가 아니고 팀 단위» · «내신 일정은 뺀다 — 내신 참여표 가서 보라고» 했다.
// 그래서 여기에는 할 일·학생 시험을 **자동으로 안 얹는다.** 손으로 고른 것만 올라간다.
// 쉬는 날만은 업무 달력의 것(holidayOf)을 그대로 쓴다 — 두 달력이 쉬는 날을 다르게 말하면 안 된다.
// 9/11 간부회의 원장님: «달력에 왜 상담은 안 적혀 있어요?» · «HTML 은 구닥다리, 마크다운으로 AI 가 읽게» →
//   종류에 «상담» 을 두고, 한 달을 마크다운으로 뽑는 단추를 둔다.
//
//   dash/monthPlan { months: { "2026-09": { goal, items: [...], notes: [{ id, title, text }], updated } }, updated }
//   item { id, kind: "goal"|"consult", text, desc, from, to, tent, when, who, state, task }
//     kind — 처음엔 끝낼 것(goal)·일정(event)·상담 셋이었는데 마왕님 «끝낼 것과 일정의 차이를 모르겠다, 합쳐» (같은 날).
//            **업무·상담 둘**이다. 옛 «event» 는 읽을 때 업무로 본다(plKind).
//     task — «할 일로 보내기» 로 만든 할 일 id. 그 할 일이 끝나면 여기서도 «완료» 로 보인다(plState)
//     tent — 날짜가 잠정(«추석 특강 — 미정» 을 9/23·24 에 흐리게 올려 두던 것)
//     when — «중산고 9/15 · 나머지 9/18» 처럼 날짜 하나로 안 되는 언제. 비우면 날짜로 쓴다
// dash 는 규칙이 이미 «팀 읽기 · 팀장 쓰기» 다 — 새 규칙을 게시할 일이 없다.
var PL_KIND = { goal: "업무", consult: "상담" };
function plKind(it) { return it && it.kind === "consult" ? "consult" : "goal"; }
var PL_STATE = ["예정", "진행", "결정 필요", "완료"];
// 담당 추천은 할 일과 같은 말(whoOptions)을 쓴다. 할 일로 보냈을 때 누구 일인지를 그 말로 가르기 때문이다.
// ⚠ «팀 전원» 은 할 일이 모르는 말이다(«전원» 이 앞에 와야 걸린다) — 그대로 보내면 아무에게도 안 걸려
//   **팀장 전용 할 일로 조용히 빠진다.** 보낼 때 «전원» 으로 바꾼다(plWhoForTask).
function plWhoForTask(who) {
  return String(who || "").split(/\s*·\s*/).map(function (w) { return w === "팀 전원" ? "전원" : w; }).join(" · ");
}
function plYmOf(d) { return String(d || "").slice(0, 7); }
function plYmShift(ym, n) { var y = +ym.slice(0, 4), m = +ym.slice(5, 7) - 1 + n; var dt = new Date(y, m, 1); return dt.getFullYear() + "-" + pad2(dt.getMonth() + 1); }
function plYmText(ym) { return ym.slice(0, 4) + "년 " + (+ym.slice(5, 7)) + "월"; }
function plMonth(ym) {
  var m = ((S.plan || {}).months || {})[ym] || {};
  return { goal: m.goal || "", items: (m.items || []).slice(), notes: (m.notes || []).slice(), updated: m.updated || 0 };
}
function plEnd(it) { return it.to && it.to >= it.from ? it.to : it.from; }
function plId() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
// 그 날 칸에 놓이는 것. 상담을 위에.
function plOn(ym, d) {
  var rank = { consult: 0, goal: 1 };
  return plMonth(ym).items.filter(function (it) { return it.from && it.from <= d && d <= plEnd(it); })
    .sort(function (a, b) { return rank[plKind(a)] - rank[plKind(b)] || String(a.text).localeCompare(String(b.text), "ko"); });
}
function plWhen(it) {
  if (it.when) return it.when;
  if (!it.from) return "미정";
  return fmtMD(it.from) + (plEnd(it) !== it.from ? " ~ " + fmtMD(plEnd(it)) : "") + (it.tent ? " (잠정)" : "");
}
// 할 일로 보낸 것이면 그 할 일의 형편. 할 일이 끝나면(끝냄 표시가 담당 전원) 여기도 «완료».
// 선생님은 팀장 전용 할 일을 못 읽는다 — 못 찾으면 적힌 상태 그대로 둔다.
function plTask(it) {
  if (!it.task) return null;
  var t = taskById(it.task);
  if (!t) return { gone: true };
  var tids = taskTids(t), by = taskDoneBy(t);
  return { t: t, done: t.status === "done" || (tids.length > 0 && by.length === tids.length), n: by.length, of: tids.length };
}
function plState(it) { var k = plTask(it); return k && k.done ? "완료" : (it.state || "예정"); }
// 이 달의 것 전부 — 날짜 순, 날짜 없는 것은 뒤. 끝난 것은 맨 뒤.
function plGoals(ym) {
  return plMonth(ym).items.slice().sort(function (a, b) {
    var da = plState(a) === "완료" ? 1 : 0, db2 = plState(b) === "완료" ? 1 : 0;
    if (da !== db2) return da - db2;
    return String(a.from || "9999").localeCompare(String(b.from || "9999"));
  });
}
// 지난달에 못 끝낸 것 — 이 달에 아직 안 옮긴 것만(글자로 본다).
function plCarryable(ym) {
  var here = {}; plMonth(ym).items.forEach(function (it) { here[it.text] = true; });
  return plGoals(plYmShift(ym, -1)).filter(function (it) { return plState(it) !== "완료" && !here[it.text]; });
}
// 그 달의 쉬는 날을 이어진 덩어리로 — «9/24(목) ~ 9/25(금) 추석» 한 줄로.
function plHolidays(ym) {
  var out = [];
  daysOfMonth(ym).forEach(function (d) {
    var h = holidayOf(d); if (!h) return;
    var last = out[out.length - 1];
    if (last && last.text === h && addDays(last.to, 1) === d) last.to = d; else out.push({ from: d, to: d, text: h });
  });
  return out;
}
// 원장님께·나스에 — 마크다운. AI 가 읽는다(9/11 간부회의).
function plMarkdown(ym) {
  var m = plMonth(ym), L = [];
  L.push("# 고등팀 " + plYmText(ym) + " 계획"); L.push("");
  if (m.goal) { L.push("> " + m.goal); L.push(""); }
  var gs = plGoals(ym);
  L.push("## 이 달에 팀이 끝낼 것");
  if (!gs.length) L.push("- (없음)");
  gs.forEach(function (it) {
    L.push("- [" + plState(it) + "] " + (plKind(it) === "consult" ? "(상담) " : "") + "**" + it.text + "** — " + plWhen(it) + (it.who ? " · " + it.who : ""));
    if (it.desc) L.push("  - " + it.desc);
  });
  var hs = plHolidays(ym);
  if (hs.length) {
    L.push(""); L.push("## 쉬는 날");
    hs.forEach(function (h) { L.push("- " + fmtMD(h.from) + (h.to !== h.from ? " ~ " + fmtMD(h.to) : "") + " " + h.text); });
  }
  if (m.notes.length) {
    L.push(""); L.push("## 규칙");
    m.notes.forEach(function (n) { L.push("- " + (n.title ? "**" + n.title + "** — " : "") + n.text); });
  }
  return L.join("\n");
}
// 저장 — 팀장만(규칙도 같다). 한 달치를 통째로 바꿔 끼운다.
async function plSaveMonth(ym, m) {
  if (S.ro) throw new Error("월간계획은 팀장만 고친다");
  var now = Date.now();
  var months = Object.assign({}, (S.plan || {}).months || {});
  months[ym] = { goal: String(m.goal || "").trim(), items: m.items, notes: m.notes, updated: now };
  await dashDoc("monthPlan").set({ months: months, updated: now });
  S.plan = { months: months, updated: now };
}
function plCleanItem(d) {
  var it = { id: d.id || plId(), kind: plKind(d), text: String(d.text || "").trim(),
    desc: String(d.desc || "").trim(), from: d.from || "", to: "", tent: !!d.tent, when: String(d.when || "").trim(),
    who: String(d.who || "").trim(), state: PL_STATE.indexOf(d.state) >= 0 ? d.state : "예정" };
  if (d.to && it.from && d.to > it.from) it.to = d.to;
  if (d.task) it.task = d.task;
  return it;
}
function plCheckItem(it) {
  if (!it.text) return "무엇을 적어야 한다";
  return "";
}

// ---- 할 일로 보내기 ----
// 계획의 한 줄을 **사람에게 맡긴다.** 할 일 메뉴에 한 줄이 생기고(담당·기한), 계획 줄은 그 할 일을 가리킨다.
// ⚠ 글자·날짜를 두 벌로 맞추지 않는다 — 계획은 계획의 말, 할 일은 할 일의 말이다(쪼개 맡길 수도 있다).
//   이어 주는 것은 **끝났나** 하나. 할 일이 끝나면 계획 줄이 «완료» 로 보인다(plState).
// 날짜가 잠정이면 날짜 기한을 안 넣는다 — 할 일 메뉴에서 «기한 지남» 으로 빨갛게 뜨면 안 된다.
// 날짜가 없고 «언제» 글자가 있으면 그 글자가 기한이다(할 일은 «이번 주» 같은 글자 기한을 받는다).
// 설명(desc)은 안 넘긴다 — 할 일 줄에 적을 칸이 없다. 계획에 남아 있다.
function plTaskRec(ym, it) {
  var due = it.from && !it.tent ? plEnd(it) : (it.when || "");
  var rec = { id: newTaskId(), status: "open", created: TODAY, text: it.text, who: plWhoForTask(it.who),
    src: (+ym.slice(5, 7)) + "월 월간계획", plan: ym + "/" + it.id };
  if (due) rec.due = due;
  return rec;
}
async function plSendTask(ym, it) {
  if (S.ro) throw new Error("팀장만 보낸다");
  var key = ym + "/" + it.id;
  // 이미 보낸 것이 있으면(계획 저장만 실패했던 경우) 새로 만들지 않고 다시 잇는다
  var t = S.tasks.filter(function (x) { return x.plan === key; })[0];
  if (!t) { t = plTaskRec(ym, it); S.tasks.push(t); await saveTasks(); }
  var m = plMonth(ym), hit = false;
  m.items = m.items.map(function (x) { if (x.id !== it.id) return x; hit = true; return Object.assign({}, it, { task: t.id }); });
  if (!hit) m.items.push(Object.assign({}, it, { task: t.id }));
  await plSaveMonth(ym, m);
  return t;
}
function plSendUi(ym, it) {
  var rec = plTaskRec(ym, it);
  var msg = "할 일 메뉴에 이렇게 넣습니다.\n\n· " + rec.text + "\n· 담당: " + (rec.who || "(없음)") + (taskShared(rec) ? "" : "\n   ⚠ 우리 팀 선생님이 안 걸려서 팀장만 보는 할 일이 된다") +
    "\n· 기한: " + (rec.due ? fmtMD(rec.due) : "없음" + (it.tent ? " (날짜가 잠정이라)" : "")) +
    "\n\n할 일이 끝나면 계획에서도 «완료» 로 보입니다.";
  if (!confirm(msg)) return;
  plSendTask(ym, it).then(function () { S.plEdit = null; renderPlan(); if (typeof renderTasks === "function") renderTasks(); },
    function (e) { alert("보내지 못했다: " + e.message); });
}

// ---- 화면 ----
function renderPlan() {
  var el = $("#sec-plan");
  if (!el) return;
  if (!S.plYm) S.plYm = plYmOf(TODAY);
  var ym = S.plYm, m = plMonth(ym), lead = !S.ro;
  var h = '<h2>월간계획 <span class="sp"></span>' +
    '<button class="mini" data-plm="-1" data-keep>‹</button><b style="font-size:14px">' + esc(plYmText(ym)) + '</b>' +
    '<button class="mini" data-plm="1" data-keep>›</button>' +
    (ym !== plYmOf(TODAY) ? '<button class="mini" data-plm="0" data-keep>이번 달</button>' : "") + '</h2>' +
    '<p class="muted" style="font-size:12px;margin:0 0 8px">팀 단위로 이 달에 끝낼 것. 할 일·학생 시험은 저절로 안 얹는다 — 학생별 시험은 내신 참여표, 내 일은 업무 달력에서. 사람에게 맡길 것은 «할 일로 보내기».</p>';
  if (S.plan === null) { el.innerHTML = h + '<p class="muted">불러오는 중…</p>'; plWire(el, ym); return; }

  // 한 달 그림
  if (lead) h += '<div class="pl-goal"><b>한 달 그림</b><input type="text" data-plgoal value="' + esc(m.goal) + '" placeholder="이 달을 한 줄로 — 예: 추석 전후 이탈 막고, 10월 설명회 자리를 비워 둔다"></div>';
  else if (m.goal) h += '<div class="pl-goal"><b>한 달 그림</b><span>' + esc(m.goal) + '</span></div>';

  // 달력
  var grid = monthGrid(ym);
  h += '<div class="calleg"><span class="plc goal">업무</span><span class="plc consult">상담</span>' +
    '<span class="plc tent">잠정</span><span class="plc offc">쉬는 날</span>' + (lead ? '<span>· 날짜 칸을 누르면 그 날에 넣는다</span>' : "") + '</div>' +
    '<div class="calwrap"><div class="plcal"><div class="plrow">' +
    ["월", "화", "수", "목", "금", "토", "일"].map(function (w, i) { return '<div class="mhead' + (i >= 5 ? " wend" : "") + '">' + w + '</div>'; }).join("") + '</div>';
  for (var w = 0; w < grid.length; w += 7) {
    h += '<div class="plrow">' + grid.slice(w, w + 7).map(function (d) {
      var out = plYmOf(d) !== ym, hol = holidayOf(d), o = holEvent(d), dow = parseYmd(d).getDay();
      var its = plOn(ym, d);
      return '<div class="pld' + (out ? " out" : "") + (hol ? " off" : "") + (dow === 0 || dow === 6 ? " wend" : "") + (d === TODAY ? " today" : "") +
        (lead ? " pick" : "") + '" data-pld="' + d + '"><div class="pln">' + (+d.slice(8)) +
        (hol ? '<span class="hol">' + esc(hol) + '</span>' : (o && !o.off ? '<span class="norm">' + esc(o.text || "정상수업") + '</span>' : "")) + '</div>' +
        its.map(function (it) {
          return '<div class="plc ' + plKind(it) + (it.tent ? " tent" : "") + (plState(it) === "완료" ? " done" : "") + '"' + (lead ? ' data-pli="' + esc(it.id) + '"' : "") +
            ' title="' + esc(it.text + (it.desc ? " — " + it.desc : "") + (it.who ? " · " + it.who : "")) + '">' +
            esc(it.text) + (it.tent ? " — 미정" : "") + '</div>';
        }).join("") + '</div>';
    }).join("") + '</div>';
  }
  h += '</div></div>';

  // 이 달에 팀이 끝낼 것
  var gs = plGoals(ym);
  h += '<h3 class="rp-h">이 달에 팀이 끝낼 것</h3>';
  h += gs.length ? '<div class="rpwrap"><table class="rp-t pl-t"><thead><tr><th>무엇</th><th style="width:170px">언제</th><th style="width:120px">누가</th><th style="width:90px">상태</th><th style="width:140px">할 일</th></tr></thead><tbody>' +
    gs.map(function (it) {
      var st = plState(it), k = plTask(it);
      return '<tr class="' + (st === "완료" ? "rp-dim" : "") + (lead ? " pick" : "") + '"' + (lead ? ' data-pli="' + esc(it.id) + '"' : "") + '>' +
        '<td>' + (plKind(it) === "consult" ? '<span class="plc consult" style="display:inline-block;margin:0 4px 0 0">상담</span>' : "") + '<b>' + esc(it.text) + '</b>' +
        (it.desc ? '<div class="muted" style="font-size:12px">' + esc(it.desc) + '</div>' : "") + '</td>' +
        '<td>' + esc(plWhen(it)) + '</td><td>' + esc(it.who || "—") + '</td>' +
        '<td><span class="pill ' + ({ "완료": "green", "진행": "blue", "결정 필요": "orange" }[st] || "") + '">' + esc(st) + '</span></td>' +
        '<td>' + (k && !k.gone ? '<span class="pill blue" title="할 일 메뉴에 있다">할 일' + (k.of > 1 ? " · 끝냄 " + k.n + "/" + k.of : k.done ? " · 끝남" : "") + '</span>'
          : k && k.gone && lead ? '<span class="muted" style="font-size:12px">할 일이 지워졌다</span> ' : "") +
          (lead && (!k || k.gone) && st !== "완료" ? '<button class="mini" data-plsend="' + esc(it.id) + '">할 일로 보내기</button>' : "") + '</td></tr>';
    }).join("") + '</tbody></table></div>'
    : '<p class="muted" style="font-size:13px">' + (lead ? "아직 없다. «＋ 업무» 로 넣는다." : "아직 없다.") + '</p>';

  // 규칙 · 메모
  if (m.notes.length || lead) {
    h += '<h3 class="rp-h">규칙</h3>' + (m.notes.length ? m.notes.map(function (n) {
      return '<div class="pl-note' + (lead ? " pick" : "") + '"' + (lead ? ' data-pln="' + esc(n.id) + '"' : "") + '>' +
        (n.title ? '<b>' + esc(n.title) + '</b> ' : "") + esc(n.text) + '</div>';
    }).join("") : '<p class="muted" style="font-size:13px">«추석 휴강 9/24·25, 9/26 정상수업» 처럼 이 달 내내 지킬 것.</p>');
  }

  // 단추 · 폼
  var carry = lead ? plCarryable(ym) : [];
  h += '<div class="row noprint" style="margin-top:12px">' +
    (lead ? '<button class="mini" data-pladd="goal">＋ 업무</button>' +
      '<button class="mini" data-pladd="consult">＋ 상담</button><button class="mini" data-pladd="note">＋ 규칙</button>' +
      (carry.length ? '<button class="mini" data-plcarry>지난달에 못 끝낸 것 가져오기 ' + carry.length + '</button>' : "") : "") +
    '<span class="sp"></span><button class="mini" data-plmd data-keep>마크다운 복사</button></div>' +
    '<div id="pl-form"></div>' +
    (S.plMd === ym ? '<textarea class="rp-dig" rows="14" readonly data-keep>' + esc(plMarkdown(ym)) + '</textarea>' : "");
  el.innerHTML = h;
  plWire(el, ym);
  if (S.plEdit && S.plEdit.ym === ym) plDrawForm($("#pl-form", el), ym);
}
function plWire(el, ym) {
  $$("[data-plm]", el).forEach(function (b) {
    b.onclick = function () { var n = +b.getAttribute("data-plm"); S.plYm = n === 0 ? plYmOf(TODAY) : plYmShift(S.plYm, n); S.plEdit = null; S.plMd = ""; renderPlan(); };
  });
  if (S.ro) { plWireMd(el, ym); return; }
  var g = $("[data-plgoal]", el);
  if (g) g.onchange = function () {
    var m = plMonth(ym); m.goal = g.value;
    plSaveMonth(ym, m).catch(function (e) { alert("저장하지 못했다: " + e.message); });
  };
  var open = function (ed) { S.plEdit = ed; renderPlan(); var f = $("#pl-form"); if (f && f.scrollIntoView) f.scrollIntoView({ block: "nearest" }); };
  $$("[data-pladd]", el).forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute("data-pladd");
      if (k === "note") open({ ym: ym, type: "note", d: { id: "", title: "", text: "" } });
      else open({ ym: ym, type: "item", d: { id: "", kind: k, text: "", desc: "", from: "", to: "", tent: false, when: "", who: "", state: "예정" } });
    };
  });
  $$("[data-pld]", el).forEach(function (c) {
    c.onclick = function (e) {
      if (e.target.closest && e.target.closest("[data-pli]")) return;
      open({ ym: ym, type: "item", d: { id: "", kind: "goal", text: "", desc: "", from: c.getAttribute("data-pld"), to: "", tent: false, when: "", who: "", state: "예정" } });
    };
  });
  $$("[data-pli]", el).forEach(function (c) {
    c.onclick = function (e) {
      if (e.stopPropagation) e.stopPropagation();
      var it = plMonth(ym).items.filter(function (x) { return x.id === c.getAttribute("data-pli"); })[0];
      if (it) open({ ym: ym, type: "item", d: Object.assign({}, it) });
    };
  });
  $$("[data-pln]", el).forEach(function (c) {
    c.onclick = function () {
      var n = plMonth(ym).notes.filter(function (x) { return x.id === c.getAttribute("data-pln"); })[0];
      if (n) open({ ym: ym, type: "note", d: Object.assign({}, n) });
    };
  });
  // 표의 «할 일로 보내기» — 줄 누르기(고치기)와 안 섞이게
  $$("[data-plsend]", el).forEach(function (b) {
    b.onclick = function (e) {
      if (e.stopPropagation) e.stopPropagation();
      var it = plMonth(ym).items.filter(function (x) { return x.id === b.getAttribute("data-plsend"); })[0];
      if (it) plSendUi(ym, it);
    };
  });
  var cr = $("[data-plcarry]", el);
  if (cr) cr.onclick = function () {
    var list = plCarryable(ym);
    if (!confirm("지난달에 못 끝낸 " + list.length + "건을 이 달로 가져옵니다 — 날짜는 비워서.\n\n" + list.map(function (x) { return "· " + x.text; }).join("\n"))) return;
    var m = plMonth(ym);
    list.forEach(function (x) { m.items.push(Object.assign({}, x, { id: plId(), from: "", to: "", tent: false, when: "" })); });
    plSaveMonth(ym, m).then(renderPlan, function (e) { alert("저장하지 못했다: " + e.message); });
  };
  plWireMd(el, ym);
}
function plWireMd(el, ym) {
  var b = $("[data-plmd]", el);
  if (b) b.onclick = function () {
    var txt = plMarkdown(ym);
    S.plMd = ym; renderPlan();
    var ok = function () { var x = $("[data-plmd]"); if (x) x.textContent = "복사했다"; };
    try { navigator.clipboard.writeText(txt).then(ok, function () {}); } catch (e) {}
  };

// ---------- 회의록 ----------
//
// 볼트(`40 팀장업무/회의록`)가 원본이고, `tools/push-minutes.mjs` 가 그걸 이 앱 DB로 올린다.
// 여기서는 **읽기만** 한다 — 고칠 곳이 둘이면 어느 쪽이 맞는지 알 수 없다.

// 선생님은 «공개: 팀» 인 회의록만 받아온다. 간부회의는 목록에도 안 뜬다.

async function loadMinutes() {
  var col = tdb.collection("minutes");
