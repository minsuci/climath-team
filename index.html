<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>한민수의 대시보드</title>
<!--
  한민수의 대시보드 — 수업관리 앱(climath-class)과 별개의 앱.
  관리자 한 사람만 쓰는 화면이라 빌드도 React도 없다. 순수 JS로 그린다.

  Firebase 프로젝트를 둘 쓴다:
    climath-class (기본 앱)  — 수업관리 앱의 DB. **읽기만 한다.**
        teachers / classes / students / appConfig.examTerm / appConfig.schoolTerms
        classes/{cid}/exams / classes/{cid}/days/{date}/scores
    climath-team  ("team" 앱) — 대시보드 자기 것. dash/tasks(팀 할 일) · dash/config(연동 시트)
  로그인은 /api/auth 가 수업관리 앱의 로그인 API로 PIN을 확인한 뒤 두 프로젝트의 토큰을 함께 준다.
  구글시트는 /api/sheets 가 climath-team 서비스 계정으로 읽는다.
-->
<style>
  :root {
    --navy: #1b2a4a; --navy2: #24375f; --orange: #f08a24; --bg: #f3f5f9; --card: #fff;
    --line: #e3e7ee; --text: #1f2937; --muted: #6b7280; --red: #d94848; --green: #2f9e5f;
    --yellow: #f2c94c; --blue: #3b6fd9;
  }
  * { box-sizing: border-box; }
  /* iOS 사파리는 작은 글씨를 저 혼자 키운다. 높이를 못 박은 칸에서 글자가 위아래로 잘린다. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif; }
  a { color: var(--blue); text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  input, select, textarea { font: inherit; }
  .top { background: linear-gradient(90deg, var(--navy), var(--navy2)); color: #fff;
    padding: 12px 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .top h1 { font-size: 18px; margin: 0; letter-spacing: -0.01em; }
  .top h1 b { color: var(--orange); }
  .top .date { opacity: .85; font-size: 13px; }
  .top .sp { flex: 1; }
  .top a, .top button.link { color: #fff; opacity: .9; font-size: 13px; background: none;
    border: 1px solid rgba(255,255,255,.35); border-radius: 6px; padding: 4px 10px; }
  .top a:hover, .top button.link:hover { opacity: 1; background: rgba(255,255,255,.1); }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 14px; }
  .grid { display: block; }
  .nav { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 12px; }
  .nav button { font: inherit; font-size: 14px; padding: 7px 14px; border: 1px solid var(--line); background: #fff;
    border-radius: 8px; color: var(--text); }
  .nav button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .nav button .b { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 5px; border-radius: 9px;
    font-size: 11px; background: #eef1f6; color: #374151; }
  .nav button.on .b { background: rgba(255,255,255,.2); color: #fff; }
  .nav button .b.red { background: #fde8e8; color: #b42318; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; min-width: 0; }
  .card.wide { grid-column: 1 / -1; }
  .card h2 { margin: 0 0 10px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .card h2 .n { font-weight: 400; color: var(--muted); font-size: 12px; }
  .card h2 .sp { flex: 1; }
  .card h2 button, .mini { font-size: 12px; padding: 3px 9px; border: 1px solid var(--line);
    background: #fff; border-radius: 6px; color: var(--text); }
  .card h2 button:hover, .mini:hover { background: #f5f7fb; }
  .mini.on { background: var(--navy); color: #fff; border-color: var(--navy); }
  .mini.warn { border-color: var(--orange); color: #b35d00; }
  .stat { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .stat div { background: #f7f8fb; border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; min-width: 84px; }
  .stat b { display: block; font-size: 20px; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 12px; }
  .stat .bad b { color: var(--red); }
  .stat .good b { color: var(--green); }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border-bottom: 1px solid var(--line); padding: 5px 7px; text-align: left;
    vertical-align: top; white-space: nowrap; }
  th { background: #f7f8fb; font-weight: 600; color: #374151; position: sticky; top: 0; }
  td.wrapc { white-space: normal; }
  .tbl { overflow: auto; max-height: calc(100vh - 330px); min-height: 120px; border: 1px solid var(--line); border-radius: 8px; }
  .tbl.tall { max-height: calc(100vh - 330px); }
  .muted { color: var(--muted); }
  .red { color: var(--red); } .green { color: var(--green); } .orange { color: #b35d00; }
  .pill { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 10px;
    background: #eef1f6; color: #374151; margin-right: 3px; }
  .pill.red { background: #fde8e8; color: #b42318; }
  .pill.green { background: #e3f5ea; color: #1f7a45; }
  .pill.yellow { background: #fff4d6; color: #8a5a00; }
  .pill.blue { background: #e4ecfb; color: #234e9e; }
  /* 앞으로 2주 — 내신 시작에 붙는 학생 이름 */
  .whoat { margin: 3px 0 2px; line-height: 1.9; }
  .whoat .nm { display: inline-block; background: #f1f3f7; border-radius: 10px; padding: 1px 8px;
    margin: 0 3px 2px 0; font-size: 12px; }
  .whoat .nm i { font-style: normal; color: var(--muted); font-size: 11px; margin-left: 4px; }
  .whoat .nm i.none { color: var(--red); }

  /* 근거 자료 */
  .srcs { display: flex; flex-direction: column; gap: 8px; }
  .src { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: #fafbfc; }
  .src.on { background: #fff; }
  .src .sh { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; font-size: 14px; }
  .src .row { margin: 6px 0 4px; }
  .src input[type=text] { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  .src .err:empty { display: none; }
  .dvday { margin: 12px 0 4px; font-size: 13px; padding-bottom: 3px; border-bottom: 1px solid var(--line); }
  .dvrow { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; padding: 3px 0; font-size: 13px; }
  .dvrow .dvmsg { color: inherit; text-decoration: none; }  .dvrow .dvmsg:hover { text-decoration: underline; }
  .dvrow .dvsha { font-size: 11px; margin-left: auto; font-family: monospace; }

  /* 회의록 */
  .mdoc { border: 1px solid var(--line); border-radius: 10px; background: #fff; padding: 14px 18px; margin-top: 10px; }
  .mdoc h2 { font-size: 17px; margin: 0 0 8px; }
  .mdoc h3 { font-size: 15px; margin: 18px 0 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  .mdoc h4 { font-size: 14px; margin: 14px 0 4px; color: var(--navy2); }
  .mdoc h5, .mdoc h6 { font-size: 13px; margin: 10px 0 4px; }
  .mdoc p { margin: 6px 0; line-height: 1.65; }
  .mdoc ul, .mdoc ol { margin: 6px 0; padding-left: 20px; }
  .mdoc li { margin: 3px 0; line-height: 1.6; }
  .mdoc code { background: #f1f3f7; border-radius: 3px; padding: 1px 4px; font-size: 12px; }
  .mdoc pre { background: #f7f8fb; border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
    overflow-x: auto; font-size: 12px; margin: 8px 0; }
  .mdoc hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }
  .mdoc blockquote { margin: 8px 0; padding: 8px 12px; border-left: 3px solid var(--line);
    background: #f7f8fb; border-radius: 0 6px 6px 0; }
  .mdoc blockquote.yellow { border-color: var(--yellow); background: #fff9e8; }
  .mdoc blockquote.blue { border-color: var(--blue); background: #eef3fb; }
  .mdoc blockquote.green { border-color: var(--green); background: #eef8f1; }
  .mdoc blockquote > b { display: block; margin-bottom: 3px; }
  .mdoc blockquote p:first-child { margin-top: 0; }
  .mdoc .tbl { margin: 8px 0; }
  .atts { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-top: 6px; }
  .hlkey { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px;
    background: #f7f8fb; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; margin-bottom: 10px; }
  .hlkey .k { border-radius: 10px; padding: 1px 8px; font-weight: 700; }
  .hlkey .k.task { background: #fbd5d5; color: #7f1d1d; }
  .hlkey .k.hit { background: #cdeed7; color: #14532d; }
  /* 덩어리째 — 이름만 칠하면 무슨 이야기인지가 안 보인다 */
  .mdoc p.hl-hit, .mdoc li.hl-hit, .mdoc blockquote.hl-hit { background: #eaf7ef; box-shadow: inset 3px 0 0 #2f9e5f; }
  .mdoc p.hl-task, .mdoc li.hl-task, .mdoc blockquote.hl-task { background: #fdecec; box-shadow: inset 3px 0 0 #d94848; }
  .mdoc p.hl-hit, .mdoc p.hl-task { padding: 4px 8px; border-radius: 4px; }
  .mdoc li.hl-hit, .mdoc li.hl-task { padding: 2px 6px; border-radius: 4px; list-style-position: inside; }
  .mdoc tr.hl-hit td { background: #eaf7ef; }
  .mdoc tr.hl-task td { background: #fdecec; }
  .mdoc tr.hl-hit td:first-child { box-shadow: inset 3px 0 0 #2f9e5f; }
  .mdoc tr.hl-task td:first-child { box-shadow: inset 3px 0 0 #d94848; }
  .mdoc mark { border-radius: 3px; padding: 0 2px; }
  .mdoc mark.hit { background: #cdeed7; color: #14532d; }
  .mdoc mark.task { background: #fbd5d5; color: #7f1d1d; font-weight: 700;
    box-shadow: 0 0 0 1px #f0a8a8; }
  .mmeta { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 10px; font-size: 13px; }

  /* 학년 업무 달력 */
  .todo { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; background: #fff; }
  .todo .task { border-bottom: 1px solid var(--line); }
  .todo .task:last-child { border-bottom: 0; }
  .calwrap { overflow-x: auto; }
  /* 월간 — 날 칸은 배경, 막대는 그 위에 눕는다 */
  .mon { min-width: 800px; margin-bottom: 12px; }
  .mhrow, .mweek { display: grid; grid-template-columns: repeat(7, minmax(112px, 1fr)); gap: 4px; }
  .mweek { grid-auto-rows: min-content; margin-bottom: 4px; }
  .mhead { text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0; font-weight: 600; }
  .mhead.wend { color: #b35d00; }
  .mday { border: 1px solid var(--line); border-radius: 6px; background: #fff; min-height: 66px;
    cursor: pointer; z-index: 0; }
  .mday:hover { border-color: var(--navy); }
  .mday.wend { background: #fafbfc; }
  .mday.out { opacity: .5; }
  .mday.inweek { background: #eef3fb; border-color: #c7d6ee; }
  .mn { font-size: 12px; font-weight: 700; z-index: 1; pointer-events: none;
    padding: 3px 5px 0; display: flex; align-items: center; gap: 4px; }
  .mn.out { opacity: .45; }
  .mn.today { color: var(--navy); }
  .mn .tn { background: var(--orange); color: #fff; border-radius: 8px; font-size: 10px;
    padding: 0 5px; font-weight: 700; }
  /* 이어지는 막대 */
  /* ⚠ 높이를 못 박지 않는다. 글꼴이 커지거나 줄바꿈이 생기면 글자가 잘린다. */
  .bar { z-index: 1; pointer-events: none; font-size: 11px; line-height: 1.5; min-height: 17px;
    margin: 0 1px 2px; padding: 1px 5px; border-radius: 0; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap; background: #eef1f6; color: #374151; }
  .bar.s { border-top-left-radius: 8px; border-bottom-left-radius: 8px; margin-left: 3px; }
  .bar.e { border-top-right-radius: 8px; border-bottom-right-radius: 8px; margin-right: 3px; }
  .bar .cont { opacity: .75; }
  .bar .n { display: inline-block; min-width: 13px; text-align: center; border-radius: 7px;
    background: rgba(0,0,0,.14); font-size: 9px; padding: 0 3px; margin-right: 1px; }
  .bar.exam { background: #f0ece5; color: #7c6f5f; }
  .bar.math { background: #fae3e2; color: #d6453f; font-weight: 700; }
  .bar.back { background: #e3edf5; color: #2b5f8a; }
  .bar.test { background: #fde8e8; color: #b42318; font-weight: 700; }
  .bar.class { background: #e5e7eb; color: #4b5563; }
  .wbars { display: grid; grid-template-columns: repeat(7, minmax(132px, 1fr)); gap: 6px;
    min-width: 940px; margin-bottom: 6px; }
  .wk-h { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; font-size: 14px;
    border-top: 1px solid var(--line); padding-top: 10px; }
  .cal { display: grid; grid-template-columns: repeat(7, minmax(132px, 1fr)); gap: 6px; min-width: 940px; }
  .cday { border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 5px 6px; min-height: 128px; }
  .cday.wend { background: #fafbfc; }
  .cday.today { border-color: var(--navy); box-shadow: inset 0 2px 0 var(--navy); }
  .cday .ch { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted);
    border-bottom: 1px solid var(--line); padding-bottom: 3px; margin-bottom: 4px; }
  .cday .ch b { font-size: 14px; color: var(--text); }
  .cday.today .ch b { color: var(--navy); }
  .cday .ch .add { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 15px;
    line-height: 1; padding: 0 2px; cursor: pointer; }
  .cday .ch .add:hover { color: var(--navy); }
  .cday .chip { font-size: 11px; padding: 2px 5px; border-radius: 4px; margin-bottom: 3px;
    background: #eef1f6; color: #374151; white-space: normal; line-height: 1.4; }
  .cday .chip.school { background: #fff4d6; color: #8a5a00; }
  .cday .chip.test { background: #fde8e8; color: #b42318; }
  .cday .ctask { display: flex; gap: 4px; align-items: flex-start; font-size: 12px; margin-bottom: 3px; }
  .cday .ctask input { margin: 2px 0 0; }
  .cday .ctask.done span { text-decoration: line-through; color: var(--muted); }
  .cday .ctask i { font-style: normal; font-size: 10px; color: var(--muted); }
  .cday .ctask i.rep { color: #234e9e; }

  /* 반별 배치표 — 열 하나가 반 */
  .gridwrap { overflow: auto; max-height: calc(100vh - 300px); border: 1px solid var(--line); border-radius: 8px; }
  table.cgrid { border-collapse: separate; border-spacing: 0; width: auto; font-size: 12px; }
  table.cgrid th, table.cgrid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 3px 6px; white-space: nowrap; vertical-align: middle; }
  table.cgrid thead th { position: sticky; top: 0; z-index: 2; background: #eef1f6; text-align: center;
    min-width: 132px; max-width: 190px; padding: 5px 7px; }
  table.cgrid thead th.mine { background: #dce6f8; box-shadow: inset 0 3px 0 var(--navy); }
  table.cgrid .cn { font-weight: 700; white-space: normal; line-height: 1.25; }
  table.cgrid .cm { font-weight: 400; color: var(--muted); font-size: 11px; }
  table.cgrid .cnt { font-weight: 700; color: var(--text); }
  table.cgrid .cnt.red { color: var(--red); } table.cgrid .cnt.orange { color: #b35d00; }
  table.cgrid th.rn { position: sticky; left: 0; z-index: 3; background: #f7f8fb; color: var(--muted);
    text-align: right; min-width: 30px; font-weight: 400; }
  table.cgrid thead th.rn { z-index: 4; }
  table.cgrid td { background: #fff; }
  table.cgrid td.dim { opacity: .22; }
  table.cgrid .nm { display: inline-block; padding: 1px 6px; border-radius: 4px; }
  table.cgrid .nm i { font-style: normal; opacity: .65; margin-left: 2px; font-size: 11px; }
  table.cgrid .sch { margin-left: 4px; font-size: 10px; color: var(--muted); }

  /* 명단 편집 시트 */
  /* 기본 table 은 width:100% 라 화면이 좁으면 칸을 줄여 글씨를 자른다.
     최소 폭을 박아 두면 대신 상자가 가로로 굴러간다. */
  table.sheet-t { min-width: 880px; }
  table.sheet-t td { padding: 2px 4px; }
  /* 가로로 밀어도 누구 줄인지 보이게 번호·이름은 왼쪽에 붙여 둔다.
     배경은 tr.gN td 가 이미 칠해 주므로 따로 주지 않는다(학년 색이 살아 있어야 한다). */
  table.sheet-t th:nth-child(1), table.sheet-t td:nth-child(1) { position: sticky; left: 0; z-index: 1; }
  table.sheet-t th:nth-child(2), table.sheet-t td:nth-child(2) { position: sticky; left: 34px; z-index: 1;
    box-shadow: 1px 0 0 var(--line); }
  table.sheet-t thead th:nth-child(1), table.sheet-t thead th:nth-child(2) { z-index: 3; }
  table.sheet-t tr.clsrow td { position: static; }
  table.sheet-t input[type=text], table.sheet-t select { width: 100%; border: 1px solid transparent; background: transparent;
    border-radius: 4px; padding: 3px 5px; font: inherit; font-size: 13px; color: inherit; }
  table.sheet-t input[type=text]:hover, table.sheet-t select:hover { border-color: var(--line); background: #fff; }
  table.sheet-t input[type=text]:focus, table.sheet-t select:focus { border-color: var(--navy); background: #fff; outline: none; }
  table.sheet-t input.ok, table.sheet-t select.ok { background: #e3f5ea; border-color: #2f9e5f; }
  table.sheet-t input.bad, table.sheet-t select.bad { background: #fde8e8; border-color: var(--red); }
  table.sheet-t .rowbtns { white-space: nowrap; }
  table.sheet-t .rowbtns .pin { padding: 2px 6px; font-size: 11px; margin-right: 2px; }
  table.sheet-t .cls-btn { max-width: 180px; overflow: hidden; text-overflow: ellipsis; text-align: left; }
  table.sheet-t tr.clsrow td { background: #f7f8fb; white-space: normal; }
  table.sheet-t tr.newrow input { border: 1px dashed var(--line); background: #fff; }
  table.sheet-t tr.jump td { box-shadow: inset 0 0 0 2px var(--orange); }
  table.cgrid .nm.ghost { background: #fde8e8; color: #b42318; text-decoration: line-through;
    outline: 1px dashed #d94848; }
  table.cgrid .nm[data-open] { cursor: pointer; }
  table.cgrid .nm[data-open]:hover { outline: 2px solid var(--navy); }

  tr.skip td { opacity: .45; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 10px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }
  table.sheet-t.ts { min-width: 780px; }
  table.sheet-t.tm { min-width: 1020px; }
  table.sheet-t.ts input[type=number] { text-align: right; }
  table.sheet-t.ts input.green { color: #1f7a45; font-weight: 700; }
  table.sheet-t.ts input.blue { color: #234e9e; font-weight: 700; }
  table.sheet-t.ts input.red { color: #b42318; font-weight: 700; }

  th.sortable { cursor: pointer; user-select: none; white-space: nowrap; }
  th.sortable:hover { background: #eef1f6; }
  th.sortable .ar { font-size: 10px; color: var(--navy); }
  th.sortable .ar.off { color: #c3cad6; }

  /* 내신 참여표 — 날짜 띠·칠하는 달력 */
  table.cgrid.strip th, table.cgrid.strip td { min-width: 21px; max-width: 21px; padding: 3px 1px;
    text-align: center; font-size: 11px; }
  table.cgrid.strip th.rn, table.cgrid.strip thead th.rn { min-width: 78px; max-width: 78px; text-align: left;
    padding: 3px 6px; font-size: 12px; font-weight: 600; color: var(--text); }
  table.cgrid.strip th.wd { font-size: 9px; padding: 1px; font-weight: 400; }
  table.cgrid.strip thead th { min-height: 0; }
  table.cgrid.paint td:hover { outline: 2px solid var(--navy); }
  .entry { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; }
  .entry .row { margin: 4px 0; }
  .entry input[type=text] { border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }

  /* 학년 색 — 표 줄과 알약이 같은 색 */

  tr.g2 td { background: #fff7e3; }  .pill.g2, .nm.g2 { background: #ffe7a8; color: #7a5200; }   /* 고2 노랑 */
  tr.g3 td { background: #fdecf1; }  .pill.g3, .nm.g3 { background: #f9cfdb; color: #9b2246; }   /* 고3 분홍 */
  tr.g9 td { background: #f3f4f6; }  .pill.g9, .nm.g9 { background: #e5e7eb; color: #4b5563; }   /* 학년 없음 */
  .chips input.mini { padding: 3px 8px; }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }

  .btn { background: var(--navy); color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; }
  .btn.o { background: var(--orange); }
  .btn.g { background: #fff; color: var(--text); border: 1px solid var(--line); }
  .btn:disabled { opacity: .5; cursor: default; }
  .task { display: flex; gap: 8px; align-items: flex-start; padding: 6px 4px;
    border-bottom: 1px solid var(--line); }
  .task:last-child { border-bottom: 0; }
  .task input[type=checkbox] { margin-top: 3px; }
  .task .t { flex: 1; min-width: 0; }
  .task .t.done { text-decoration: line-through; color: var(--muted); }
  .task .m { font-size: 12px; color: var(--muted); }
  .task .m .over { color: var(--red); font-weight: 600; }
  .task .m .soon { color: #b35d00; font-weight: 600; }

  .login select, .login input { width: 100%; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; margin-bottom: 10px; }
  .login .btn { width: 100%; padding: 10px; }
  .empty { color: var(--muted); padding: 12px 4px; }
  .sheet { margin-top: 10px; }
  .sheet h3 { margin: 0 0 6px; font-size: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .sheet h3 .sp { flex: 1; }

  @media (max-width: 760px) {
    .nav button { padding: 6px 10px; font-size: 13px; }

  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
"use strict";
// ---------- 기본 ----------
var firebaseConfig = {
  apiKey: "AIzaSyBIhpjPGsA1tH9AFspHtNifeeHUnhN0XUA",
  authDomain: "climath-class.firebaseapp.com",
  projectId: "climath-class",
  storageBucket: "climath-class.firebasestorage.app",
  messagingSenderId: "321968656061",
  appId: "1:321968656061:web:29d98c125c7480d44371d4"
};
var teamConfig = {
  apiKey: "AIzaSyCbxX46XDur_qL91rjicKjqhpCY2Lqem88",
  authDomain: "climath-team.firebaseapp.com",
  projectId: "climath-team",
  storageBucket: "climath-team.firebasestorage.app",
  messagingSenderId: "590208483967",
  appId: "1:590208483967:web:2c2f7e529482df03aab54a"
};
firebase.initializeApp(firebaseConfig);                       // 수업관리 앱 DB — 읽기만
var teamApp = firebase.initializeApp(teamConfig, "team");     // 대시보드 DB — 할 일·시트 목록
var db = firebase.firestore();
var tdb = firebase.firestore(teamApp);
var teamAuth = firebase.auth(teamApp);
function dashDoc(name) { return tdb.collection("dash").doc(name); }
async function signOutAll() { try { await teamAuth.signOut(); } catch (e) {} try { await firebase.auth().signOut(); } catch (e) {} }

var $ = function (s, el) { return (el || document).querySelector(s); };
var $$ = function (s, el) { return Array.prototype.slice.call((el || document).querySelectorAll(s)); };
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function pad2(n) { return (n < 10 ? "0" : "") + n; }
function ymd(d) { return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
var TODAY = ymd(new Date());
var DOW = ["일", "월", "화", "수", "목", "금", "토"];
function parseYmd(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ""); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
function fmtMD(s) { var d = parseYmd(s); return d ? (d.getMonth() + 1) + "/" + d.getDate() + "(" + DOW[d.getDay()] + ")" : (s || ""); }
function daysFromToday(s) { var d = parseYmd(s); if (!d) return null; return Math.round((d - parseYmd(TODAY)) / 864e5); }
function dday(s) { var n = daysFromToday(s); if (n === null) return ""; return n === 0 ? "오늘" : n > 0 ? "D-" + n : "D+" + (-n); }
function addDays(s, n) { var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function isEnded(r) { return !!(r && r.endDate && TODAY > r.endDate); }
function activeClass(c) { return !(c.endDate && TODAY > c.endDate); }
var GRADES = ["중3", "고1", "고2", "고3"];
var gradeRank = function (g) { var i = GRADES.indexOf(g); return i < 0 ? 99 : i; };

// ---------- 상태 ----------
var S = {
  claims: null, teachers: [], classes: [], students: [], term: "", schoolTerms: {},
  exams: {},      // cid -> { sid -> doc }
  scores: {},     // cid -> [ {date, ...score} ]
  tasks: [], config: { sources: {} }, teamOk: true, teamErr: "",
  calGrade: "전체", calAnchor: "", calAdd: "",
  minutes: null, minutesLoading: false, minutesErr: "", minPick: "", minQ: "", minName: "",
  dev: null, devLoading: false, devErr: "", devWho: "", devApp: "", devKindPick: "", devDays: 14, devQ: "", devEdit: false,
  filterWho: "", stFilter: "", stQuery: "", stView: "grid", stOpen: "", stJump: "", byPid: {}, notes: {},
  exGrade: "", exEntry: null, exForm: {}, exDays: [], exMonth: "", exMode: "exam", exAnchor: "", exSort: null,
  tests: [], testPick: "", testScores: {}, tsForm: false, tsSort: null, tsPaste: false,
  srcEdit: "", sheetScan: null, pullPick: null, pullOver: false,
  pullOpen: false, pullRedo: false, pullFrom: "", pullTo: "", pullKind: "중간", jobUnsub: null,
  showDone: false, saEmail: "",
  stLog: [],      // 명단 변경 기록 (앱·대시보드 양쪽)
};

async function authApi(body) {
  var r = await fetch("/api/auth", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  var j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ("요청 실패 (" + r.status + ")"));
  return j || {};
}
// 수업관리 앱의 `/api/auth` 를 브라우저에서 바로 부른다. 그쪽은 CORS 를 열어 두었고,
// **class 토큰으로 스스로 권한을 본다** — 우리 서버가 한 번 더 감쌀 이유가 없다.
// (학교 일정은 CORS 가 없어서 서버가 중계한다. 여기는 다르다)
var CLASS_API = "https://climath-class.vercel.app/api/auth";
async function classAuthApi(body) {
  var u = firebase.auth().currentUser;
  if (!u) throw new Error("로그인이 풀렸다. 새로고침 해주세요");
  var idToken = await u.getIdToken();
  var r = await fetch(CLASS_API, { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ idToken: idToken }, body)) });
  var j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ("요청 실패 (" + r.status + ")"));
  return j || {};
}
// 학생 PIN 초기화. 새 비번을 **정해주지 않고** 초기 PIN 으로 되돌린다 —
// 선생님이 정한 비번은 그것대로 남의 손을 거친 비번이 된다. 학생이 다음에 들어올 때 스스로 정한다.
function stResetPin(name) { return classAuthApi({ action: "resetStudentPin", name: name }); }

async function sheetsApi(body) {
  var u = teamAuth.currentUser;
  if (!u) throw new Error("로그인이 필요합니다");
  var idToken = await u.getIdToken();
  var r = await fetch("/api/sheets", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(Object.assign({ idToken: idToken }, body)) });
  var j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ("요청 실패 (" + r.status + ")"));
  return j || {};
}

// ---------- 로그인 ----------
var root = $("#root");
// 로그인에 실패한 이유. 실패 직후 signOut 이 onAuthStateChanged 를 깨워 renderLogin 이
// 한 번 더 돌기 때문에, 인자로만 넘기면 메시지가 지워진다. 다음 시도 때 비운다.
var LOGIN_ERR = "";
function renderLogin(msg) {
  root.innerHTML =
    '<div class="top"><h1>한민수의 <b>대시보드</b></h1><span class="date">' + fmtMD(TODAY) + '</span></div>' +
    '<div class="wrap"><div class="card login"><h2>선생님 로그인</h2>' +
    '<select id="lg-t"><option value="">불러오는 중...</option></select>' +
    '<input id="lg-p" type="password" inputmode="numeric" placeholder="PIN" autocomplete="current-password">' +
    '<button class="btn" id="lg-go">들어가기</button>' +
    '<div class="err" id="lg-err">' + esc(msg || LOGIN_ERR || "") + '</div>' +
    '<p class="muted" style="font-size:12px">수업관리 앱과 같은 계정이다. 관리자만 들어올 수 있다.</p></div></div>';
  authApi({ action: "teachers" }).then(function (r) {
    var ts = (r.teachers || []).filter(function (t) { return t.status !== "pending"; });
    $("#lg-t").innerHTML = ts.map(function (t) {
      return '<option value="' + esc(t.tid) + '"' + (t.role === "owner" ? " selected" : "") + '>' + esc(t.name) + (t.role === "owner" ? " (관리자)" : "") + '</option>';
    }).join("");
  }).catch(function (e) { $("#lg-err").textContent = e.message; });
  var go = async function () {
    var tid = $("#lg-t").value, pin = $("#lg-p").value;
    if (!pin) { $("#lg-err").textContent = "PIN을 넣어주세요"; return; }
    LOGIN_ERR = ""; $("#lg-err").textContent = "";
    var btn = $("#lg-go"); btn.disabled = true; btn.textContent = "확인 중...";
    // 프로젝트 둘에 차례로 로그인한다. 그 사이 boot()이 돌면 "한쪽만 로그인됨"으로 보고
    // 방금 된 로그인을 도로 끊는다. 끝날 때까지 막아둔다.
    LOGGING_IN = true;
    try {
      var r = await authApi({ action: "login", tid: tid, pin: pin });
      await firebase.auth().signInWithCustomToken(r.classToken);
      await teamAuth.signInWithCustomToken(r.teamToken);
      LOGGING_IN = false;
      await boot();
    } catch (e) {
      LOGGING_IN = false;
      LOGIN_ERR = loginHint(e);
      try { await signOutAll(); } catch (x) {}
      renderLogin();
    }
  };
  $("#lg-go").onclick = go;
  $("#lg-p").addEventListener("keydown", function (e) { if (e.key === "Enter") go(); });
}

// 파이어베이스 오류 코드를 "그래서 뭘 하면 되는지"로. 코드만 보고는 알 수가 없다.
function loginHint(e) {
  var c = (e && e.code) || "", m = (e && e.message) || String(e);
  if (/configuration-not-found/.test(c + m))
    return "climath-team 프로젝트에 Authentication이 아직 켜지지 않았습니다.\n" +
      "Firebase 콘솔 → climath-team → Authentication → 시작하기 를 누르면 됩니다 (로그인 방법은 켜지 않아도 됩니다).";
  if (/invalid-custom-token|custom token format/.test(c + m))
    return "대시보드 서버가 만든 토큰을 파이어베이스가 거절했습니다.\n" +
      "Vercel 환경변수 TEAM_SERVICE_ACCOUNT 가 climath-team 프로젝트의 키가 맞는지 확인해 주세요.";
  if (/network|Failed to fetch/i.test(m)) return "네트워크에 닿지 않았습니다. 잠시 뒤 다시 해주세요.";
  return m;
}

async function boot() {
  var u = firebase.auth().currentUser, tu = teamAuth.currentUser;
  if (!u || !tu) { if (u || tu) await signOutAll(); renderLogin(); return; }
  var tr = await u.getIdTokenResult();
  var c = tr.claims || {};
  if (c.role !== "owner") {
    await signOutAll();
    renderLogin("관리자 계정만 들어올 수 있습니다 (" + (c.role || "역할 없음") + ")");
    return;
  }
  S.claims = c;
  renderShell();
  await loadCore();
  renderAll();
  loadExams().then(renderExams);
  loadScores().then(renderScores);
  loadSheetsAll();
}
// 두 프로젝트의 로그인 복구가 따로 끝난다. 둘 다 첫 응답을 준 뒤에만 boot 한다 —
// 안 그러면 한쪽만 복구된 순간 로그인 화면이 잠깐 떴다가 대시보드로 바뀐다.
// 로그인하는 중에도 막는다 — 첫 프로젝트가 끝난 순간 boot 이 돌면 signOutAll 로 되돌린다.
var authReady = { c: false, t: false }, bootTimer = null, LOGGING_IN = false;
function scheduleBoot() {
  if (LOGGING_IN) return;
  if (!authReady.c || !authReady.t) return;
  clearTimeout(bootTimer);
  bootTimer = setTimeout(function () { boot().catch(function (e) { renderLogin(e.message); }); }, 30);
}
firebase.auth().onAuthStateChanged(function () { authReady.c = true; scheduleBoot(); });
teamAuth.onAuthStateChanged(function () { authReady.t = true; scheduleBoot(); });

// ---------- 뼈대 ----------
function renderShell() {
  root.innerHTML =
    '<div class="top"><h1>한민수의 <b>대시보드</b></h1><span class="date">' + fmtMD(TODAY) + '</span><span class="sp"></span>' +
    '<button class="link" id="btn-reload">새로고침</button>' +
    '<button class="link" id="btn-out">로그아웃</button></div>' +
    '<div class="wrap"><div id="banner"></div><div class="nav">' +
    PAGES.map(function (p) { return '<button data-page="' + p[0] + '">' + p[1] + '<span class="b" id="nb-' + p[0] + '" hidden></span></button>'; }).join("") +
    '</div><div class="grid">' +
    PAGES.map(function (p) { return '<div class="card" id="sec-' + p[0] + '" hidden></div>'; }).join("") +
    '</div></div>';
  $("#btn-out").onclick = function () { signOutAll(); };
  $("#btn-reload").onclick = function () { location.reload(); };
  $$(".nav button").forEach(function (b) { b.onclick = function () { showPage(b.getAttribute("data-page")); }; });
  showPage(currentPage());
}
// 한 페이지에 상자 하나. 마지막에 본 페이지를 기억하고, 주소의 #페이지 로도 연다.
var PAGES = [["cal", "업무 달력"], ["tasks", "할 일"], ["minutes", "회의록"], ["dev", "개발 현황"], ["week", "앞으로 2주"], ["students", "학생 명단"], ["terms", "학교 일정"],
  ["exams", "내신 참여표"], ["scores", "시험 성적"], ["sheets", "근거 자료"]];
function isPage(id) { return PAGES.some(function (p) { return p[0] === id; }); }
function currentPage() {
  var h = (location.hash || "").replace("#", "");
  if (isPage(h)) return h;
  try { var v = localStorage.getItem("dash.page"); if (isPage(v)) return v; } catch (e) {}
  return "tasks";
}
function showPage(id) {
  PAGES.forEach(function (p) { var el = $("#sec-" + p[0]); if (el) el.hidden = p[0] !== id; });
  $$(".nav button").forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-page") === id); });
  try { localStorage.setItem("dash.page", id); } catch (e) {}
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  // 회의록 본문은 길다. 그 메뉴를 처음 열 때만 받아온다.
  if (id === "minutes" && S.minutes === null && !S.minutesLoading) {
    S.minutesLoading = true;
    loadMinutes().then(function () { S.minutesLoading = false; renderMinutes(); })
      .catch(function (e) { S.minutesLoading = false; S.minutesErr = e.message; renderMinutes(); });
  }
  // 개발 현황은 깃허브를 부른다. 이것도 그 메뉴를 열 때만.
  if (id === "dev" && S.dev === null && !S.devLoading) {
    S.devLoading = true;
    loadDev().then(function () { S.devLoading = false; renderDev(); })
      .catch(function (e) { S.devLoading = false; S.devErr = e.message; renderDev(); });
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", function () { if (S.claims) showPage(currentPage()); });
// 메뉴 단추에 붙는 숫자. 빨간 건 손봐야 할 것.
function navBadge(id, n, red) {
  var el = $("#nb-" + id); if (!el) return;
  el.hidden = !n; el.textContent = n; el.className = "b" + (red ? " red" : "");
}
function renderAll() { renderBanner(); renderCal(); renderTasks(); renderMinutes(); renderDev(); renderWeek(); renderStudents(); renderTerms(); renderExams(); renderScores(); renderSheets(); }

// ---------- 불러오기 ----------
async function loadCore() {
  var jobs = [
    db.collection("teachers").orderBy("time").get().then(function (s) { S.teachers = []; s.forEach(function (d) { S.teachers.push(Object.assign({ tid: d.id }, d.data())); }); }),
    db.collection("classes").get().then(function (s) { S.classes = []; s.forEach(function (d) { S.classes.push(Object.assign({ id: d.id }, d.data())); }); S.classes.sort(function (a, b) { return (a.order || 0) - (b.order || 0); }); }),
    db.collection("students").get().then(function (s) { S.students = []; s.forEach(function (d) { S.students.push(Object.assign({ pid: d.id }, d.data())); }); }),
    db.collection("appConfig").doc("examTerm").get().then(function (d) { S.term = d.exists ? (d.data().term || "") : ""; }),
    db.collection("appConfig").doc("schoolTerms").get().then(function (d) { S.schoolTerms = d.exists ? d.data() : {}; }),
    dashDoc("tasks").get().then(function (d) { S.tasks = d.exists ? (d.data().items || []) : []; S.teamOk = true; })
      .catch(function (e) { S.teamOk = false; S.teamErr = e.code || e.message; }),
    dashDoc("students").get().then(function (d) { S.notes = (d.exists && d.data().notes) || {}; }).catch(function () {}),
    loadTests(),
    db.collection("appConfig").doc("studentLog").get()
      .then(function (d) { S.stLog = (d.exists && d.data().items) || []; }).catch(function () { S.stLog = []; }),
    dashDoc("config").get().then(function (d) { S.config = d.exists ? Object.assign({ sources: {} }, d.data()) : { sources: {} }; })
      .catch(function () {}),
  ];
  await Promise.all(jobs);
}

function mdInline(t) {

        body.map(function (r) {

    var cur = null;
    list.forEach(function (r) {
      if (cur && r.s <= cur.e) {                 // 하루라도 겹치면 한 막대
        if (r.e > cur.e) cur.e = r.e;
        cur.items.push(r);
        return;
      }
      cur = { s: r.s, e: r.e, kind: k, items: [r] };
      out.push(cur);
    });
  });
  out.forEach(function (m) {
    var names = m.items.map(function (x) { return x.text; });
    m.full = names.join(" · ");
    m.n = m.items.length;
    m.text = m.n === 1 ? names[0] : names[0] + " 외 " + (m.n - 1);
  });
  out.sort(function (a, b) {
    return a.s < b.s ? -1 : a.s > b.s ? 1 : (b.e < a.e ? -1 : b.e > a.e ? 1 : 0);
  });
  return out;
}
// 이레치 날짜 배열에 막대를 눕힌다. 겹치는 것은 층(lane)을 달리한다.
// 주 경계에서 잘린 쪽은 모서리를 안 둥글게 해서 **이어진다는 것**을 보인다.
function weekSegments(ranges, days) {
  var from = days[0], to = days[days.length - 1], segs = [], lanes = [];
  ranges.forEach(function (r) {
    if (r.e < from || r.s > to) return;
    var a = days.indexOf(r.s < from ? from : r.s);
    var b = days.indexOf(r.e > to ? to : r.e);
    if (a < 0 || b < 0) return;
    var seg = { a: a, b: b, kind: r.kind, text: r.text, full: r.full || r.text, n: r.n || 1,
                head: r.s >= from, tail: r.e <= to };
    var i = 0;
    while (lanes[i] && lanes[i].some(function (x) { return !(seg.b < x.a || seg.a > x.b); })) i++;
    lanes[i] = lanes[i] || [];
    lanes[i].push(seg);
    seg.lane = i;
    segs.push(seg);
  });
  return { segs: segs, lanes: lanes.length };
}
function barHtml(g, rowBase) {
  return '<div class="bar ' + g.kind + (g.head ? " s" : "") + (g.tail ? " e" : "") + '"' +
    ' style="grid-column:' + (g.a + 1) + '/span ' + (g.b - g.a + 1) + ';grid-row:' + (rowBase + g.lane) + '"' +
    ' title="' + esc(g.full) + '">' +
    (g.n > 1 ? '<b class="n">' + g.n + '</b> ' : "") +
    (g.head ? esc(g.text) : '<span class="cont">◂ ' + esc(g.text) + '</span>') + '</div>';
}

// 이번 주까지 해야 할 일 — 기한 지난 것과 이 주 안의 것. 반복은 그 주의 각 요일마다 한 건.
function dueThrough(want, days) {
  var last = days[days.length - 1], out = [];
  S.tasks.forEach(function (t) {
    if (!gradeHit(taskGrade(t), want)) return;
    if (t.repeat && t.repeat.dow && t.repeat.dow.length) {
      days.forEach(function (d) {
        if (!taskOnDate(t, d) || taskDoneOn(t, d)) return;
        out.push({ t: t, date: d, late: d < TODAY });
      });
      return;
    }
    if (t.status === "done" || !t.due || t.due > last) return;
    out.push({ t: t, date: t.due, late: t.due < TODAY });
  });
  out.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
  return out;
}

async function toggleTask(id, date) {

    (t.src ? ' <span class="muted">· ' + esc(t.src) + '</span>' : "") + '</div></div>' +
    '<button class="x" title="지우기">×</button></div>';
}
// 볼트 「할 일 추적」 표 → 항목. 셀 순서는 할 일 | 담당 | 기한 | 출처 | 상태 (완료 표는 마지막이 완료일).
function importMarkdown(md) {
  var n = 0, have = {};
  S.tasks.forEach(function (t) { have[t.text] = 1; });
  md.split(/\r?\n/).forEach(function (line) {
    if (!/^\s*\|/.test(line)) return;
    var cells = line.split("|").slice(1, -1).map(function (c) { return c.replace(/\[\[|\]\]|\*\*/g, "").trim(); });
    if (cells.length < 3) return;
    if (/^-+$/.test(cells[0]) || cells[0] === "할 일") return;
    var text = cells[0]; if (!text || have[text]) return;
    var st = cells[4] || "";
    var status = /완료|^\d{4}-/.test(st) ? "done" : /진행/.test(st) ? "doing" : /보류/.test(st) ? "hold" : "open";
    S.tasks.push({ id: newId(), text: text, who: cells[1] || "", due: parseDueText(cells[2] || ""), dueText: cells[2] || "",
      src: cells[3] || "", status: status, created: TODAY, done: status === "done" ? (/^\d{4}-/.test(st) ? st.slice(0, 10) : TODAY) : "" });
    have[text] = 1; n++;
  });
  return n;
}
// "9/4 (목)" · "~9/11" · "9/4~5" 같은 글을 날짜로. 못 읽으면 글자를 그대로 둔다.
function parseDueText(s) {
  var m = /(\d{1,2})\s*\/\s*(\d{1,2})/.exec(s);
  if (!m) return s;
  var y = new Date().getFullYear(); var mo = +m[1], d = +m[2];
  // 12월에 1월 기한이면 다음 해
  if (mo < new Date().getMonth() + 1 - 6) y += 1;
  return y + "-" + pad2(mo) + "-" + pad2(d);
}

// ---------- 이번 주 ----------
// 그 학교·학년에 다니는 우리 학생. 어느 반인지도 같이 — "누가 언제 안 오나"가 이 화면의 물음이다.
function studentsAt(school, grade) {
  var inCls = {};
  activeClasses().forEach(function (c) {
    rosterStudents(c).forEach(function (r) { if (r.pid) (inCls[r.pid] = inCls[r.pid] || []).push(c.name); });
  });
  return S.students.filter(function (x) { return x.school === school && x.grade === grade; })
    .map(function (x) { return { name: x.name, cls: (inCls[x.pid] || []).join(", ") }; })
    .sort(function (a, b) { return String(a.name).localeCompare(String(b.name), "ko"); });
}

function renderWeek() {

    (dates.length ? '<div class="tbl"><table><tbody>' + dates.map(function (d) {

        grouped[d].map(function (i) {

            { task: "할 일", school: "학교", class: "반" }[i.kind] + '</span>' + esc(i.text) +
            (i.who ? (i.who.length
              ? '<div class="whoat"><b>' + i.who.length + '명</b> ' + i.who.map(function (x) {

                }).join("") + '</div>'

        }).join("<br>") + '</td></tr>';

function gradeOf(r) { var p = personOf(r); return r.grade || (p && p.grade) || ""; }

function stHit(name, grade, school, teacher, cls) {

  var loose = S.students.filter(function (x) { return !assignedNames(x, cols); });

function stLogAgo(t) {
  var m = Math.floor((Date.now() - t) / 60000);

// ---- 변경 기록 ----
//
// 명단은 여기와 수업관리 앱 **두 곳에서** 고친다. 저장소는 하나지만(앱 students),
// 그래서 «누가 어디서 무엇을 바꿨나» 를 아무도 모른다. 그 앎을 한 곳에 모아
// **여기서** 볼 수 있게 한다 — 그것이 이 앱이 명단의 근거지라는 뜻이다.
//
// 앱과 같은 자리(appConfig/studentLog)에 쓴다. 새 컬렉션을 만들면 앱 보안 규칙을
// 콘솔에 다시 붙여넣어야 하는데, 안 붙여넣으면 기록이 조용히 안 쌓인다.
var STUDENT_LOG_KEEP = 300;
// ⚠ 모아서 한 번에 쓴다. 여러 명 붙여넣기는 한 번에 수십 명을 만든다.
//    한 명마다 읽고 쓰면 그만큼 느려진다.
var LOG_Q = [], LOG_T = null;
function logStudentChange(act, pid, name, detail) {
  LOG_Q.push({ t: Date.now(), act: act, pid: pid || "", name: name || "",
               by: teacherName(S.claims && S.claims.tid) || "", from: "대시보드",
               detail: detail || "" });
  if (LOG_T) clearTimeout(LOG_T);
  LOG_T = setTimeout(flushStudentLog, 800);
}
async function flushStudentLog() {
  LOG_T = null;
  var q = LOG_Q; LOG_Q = [];
  if (!q.length) return;
  try {
    var ref = db.collection("appConfig").doc("studentLog");
    var d = await ref.get();
    var items = ((d.exists && d.data().items) || []).concat(q);
    items = items.slice(-STUDENT_LOG_KEEP);
    await ref.set({ items: items, updated: Date.now() }, { merge: true });
    S.stLog = items;
  } catch (e) {}   // 기록 때문에 저장이 실패하면 안 된다
}

// ---- 쓰기 (climath-class) ----
// 반 명단은 배열 하나라 통째로 다시 쓴다. **반드시 방금 읽은 것 위에 얹는다** —
// 화면이 들고 있던 옛 사본으로 저장하면 그 사이 다른 선생님이 바꾼 것이 날아간다.
// 같은 사람을 다시 넣을 때 **옛 번호를 되쓴다.** 출결·과제·질문번호·참여표·
// 강의노트 조회가 전부 이 번호로 달려 있어서, 새 번호를 만들면 지난 기록이 끊긴다.
// 뺄 때 pastIds 에 적어 두고 넣을 때 꺼내 쓴다. 동명이인은 이름을 A·B·C 로 가른다.
function rosterKey(p) { return (p && p.pid) ? "pid:" + p.pid : "name:" + ((p && p.name) || ""); }
function reuseRosterId(cls, person) {
  var past = ((cls && cls.pastIds) || {})[rosterKey(person)];
  var taken = ((cls && cls.roster) || []).some(function (r) { return r.id === past; });
  if (past && !taken) return past;
  return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
}

async function withFreshRoster(cid, fn) {
  var snap = await db.collection("classes").doc(cid).get();
  var cur = (snap.exists && snap.data().roster) || [];
  var next = fn(cur);
  if (!next) return null;
  await db.collection("classes").doc(cid).update({ roster: next });
  var c = S.classes.filter(function (x) { return x.id === cid; })[0];
  if (c) c.roster = next;
  return next;
}
async function stSave(pid, patch) {
  await db.collection("students").doc(pid).set(Object.assign({}, patch, { updated: Date.now() }), { merge: true });
  var p = S.byPid[pid]; if (p) Object.assign(p, patch);
  if ("name" in patch || "school" in patch || "grade" in patch) await stSyncRosters(p);
  logStudentChange("고침", pid, (p && p.name) || patch.name || "",
    Object.keys(patch).filter(function (k) { return k !== "name"; }).join(" · "));
}
async function stCreate(data) {
  var ref = await db.collection("students").add(Object.assign({}, data, { time: Date.now(), updated: Date.now() }));
  var p = Object.assign({ pid: ref.id }, data);
  S.students.push(p); S.byPid[ref.id] = p;
  logStudentChange("만듦", ref.id, data.name || "", "");
  return p;
}
// **반 명단에서 먼저 빼고** 사람 문서를 지운다.
// 사람만 지우면 그 사람을 가리키는 반 명단 항목이 유령으로 남는다 — 배치표에는 뜨는데
// 명단에는 없고, rosterDrift·looseRosterRows 둘 다 못 잡는다(하나는 사람이 없어서,
// 하나는 pid 가 있어서). 빼는 것은 "반에서 빼기"와 같은 일이라 기록은 그대로 남는다.
async function stDelete(pid) {
  var inCls = classesOfPid(pid);
  for (var i = 0; i < inCls.length; i++) await stUnassign(inCls[i].id, pid);
  var gone = S.byPid[pid];
  await db.collection("students").doc(pid).delete();
  logStudentChange("지움", pid, (gone && gone.name) || "", "");
  S.students = S.students.filter(function (x) { return x.pid !== pid; });
  delete S.byPid[pid];
  if (S.notes[pid]) { delete S.notes[pid]; try { await saveNotes(); } catch (e) {} }
}
async function stAssign(cid, person) {
  var cls = S.classes.filter(function (x) { return x.id === cid; })[0];
  var added = await withFreshRoster(cid, function (roster) {
    if (roster.some(function (r) { return r.pid === person.pid; })) return null;
    var id = reuseRosterId({ roster: roster, pastIds: cls && cls.pastIds }, person);
    return roster.concat([{ id: id,
      pid: person.pid, name: person.name, school: person.school || "", grade: person.grade || "" }]);
  });
  if (added) logStudentChange("반에 넣음", person.pid, person.name || "", className(cid));
}
async function stUnassign(cid, pid) {
  var p = S.byPid[pid], gone = null;
  await withFreshRoster(cid, function (roster) {
    gone = roster.filter(function (r) { return r.pid === pid; })[0] || null;
    return roster.filter(function (r) { return r.pid !== pid; });
  });
  // 뺀 번호를 적어 둔다. 다시 넣을 때 되써야 지난 기록이 안 끊긴다.
  // ⚠ 점 표기로 쓰면 안 된다. Firestore 는 점을 필드 경로로 읽는데 우리 열쇠에는
  //    «:»과 한글이 들어가서 백틱으로 감싸야 한다. 통째로 읽어 얹는다.
  if (gone) {
    try {
      var snap = await db.collection("classes").doc(cid).get();
      var past = (snap.exists && snap.data().pastIds) || {};
      past[rosterKey(gone)] = gone.id;
      await db.collection("classes").doc(cid).update({ pastIds: past });
      var c = S.classes.filter(function (x) { return x.id === cid; })[0];
      if (c) c.pastIds = past;
    } catch (e) {}
  }
  logStudentChange("반에서 뺌", pid, (p && p.name) || "", className(cid));
}
// 사람 정보 → 그 사람이 든 모든 반 명단의 미러. 이름도 함께 보낸다 —
// 안 보내면 출석부·참여표가 옛 이름을 계속 쓴다.
async function stSyncRosters(person) {
  for (var i = 0; i < S.classes.length; i++) {
    var c = S.classes[i];
    if (!(c.roster || []).some(function (r) { return r.pid === person.pid; })) continue;
    await withFreshRoster(c.id, function (roster) {
      return roster.map(function (r) {
        if (r.pid !== person.pid) return r;
        var n = Object.assign({}, r, { school: person.school || "", grade: person.grade || "" });
        if (person.name) n.name = person.name;
        return n;
      });
    });
  }
}
// 반 명단의 미러가 사람 정보와 어긋난 것
function rosterDrift() {
  var out = [];
  activeClasses().forEach(function (c) {
    (c.roster || []).forEach(function (r) {
      if (!r.pid) return;

      if ((r.name || "") !== (p.name || "") || (r.school || "") !== (p.school || "") || (r.grade || "") !== (p.grade || ""))
        out.push({ cid: c.id, cname: c.name, pid: r.pid });

async function fixDrift() {
  var d = rosterDrift(), seen = {}, n = 0;

}
// 지워진 사람을 가리키는 반 명단 항목. 배치표에만 뜨고 명단에는 없다.
// 옛 판(2026-09-04)이 사람만 지워서 생긴 것들이 남아 있을 수 있다.
function orphanRosterRows() {

}
async function removeOrphans() {

}
// 반에는 있는데 사람 정보가 없는 항목(pid 없음). 명단에 안 떠서 통째로 안 보인다.
function looseRosterRows() {
  var out = [];
  activeClasses().forEach(function (c) {
    (c.roster || []).forEach(function (r) { if (!r.teacher && !r.pid && !isEnded(r)) out.push({ cid: c.id, cname: c.name, r: r }); });
  });

}
// 이름이 하나뿐일 때만 잇는다. 겹치면 사람이 골라야 한다 — 동명이인을 섞으면 되돌리기 어렵다.
async function linkLoose() {
  var rows = looseRosterRows(), byName = {};
  rows.forEach(function (x) { (byName[x.r.name] = byName[x.r.name] || []).push(x); });
  var made = 0, skip = 0;
  for (var name in byName) {
    var group = byName[name];
    var existing = S.students.filter(function (x) { return x.name === name; });
    if (existing.length > 1 || group.length > 1) { skip += group.length; continue; }
    var person = existing[0] || await stCreate({ name: name, school: group[0].r.school || "", grade: group[0].r.grade || "", homeroom: "" });
    var g = group[0];
    await withFreshRoster(g.cid, function (roster) {
      return roster.map(function (r) { return r.id === g.r.id ? Object.assign({}, r, { pid: person.pid }) : r; });
    });

}

function bulkParseGrade(tok) {
  if (GRADES.indexOf(tok) >= 0) return tok;
  var m = { "9": "중3", "10": "고1", "11": "고2", "12": "고3", "중3": "중3" };
  return m[tok] || "";
}
function parseBulkLine(line) {
  var t = line.split(/[\t,]|\s{1,}/).map(function (x) { return x.trim(); }).filter(Boolean);
  if (!t.length) return null;
  var name = t.shift(), grade = "", school = "";
  for (var i = 0; i < t.length; i++) {

  return { name: name, grade: grade, school: school, homeroom: "" };
}

// ---------- 학교 일정 ----------
//
// 학교·학년마다 내신 기간과 수학시험 날짜를 한 번만 적어두는 곳(`appConfig/schoolTerms`).
// 참여표가 여기서 기본값을 가져간다. 수업관리 앱의 SchoolTermBoard 와 **같은 문서**를 쓴다.
//
// 시험 기간 찾아오기는 앱의 `/api/schedule` 을 중계해서 쓴다 — 나이스 → 학교 홈페이지 →
// 게시판 첨부문서(→ AI) 네 단계가 이미 그쪽에 쌓여 있다.

var termKeyOf = function (t) { return String(t || "").replace(/[^0-9A-Za-z가-힣]+/g, "_"); };
var schedKey = function (term, school, grade) { return termKeyOf(term) + "__" + school + "__" + grade; };
// **넘긴 칸만** 보낸다. merge:true 는 지도 안까지 합쳐주므로 나머지 칸은 그대로 남는다.
// 통째로 보내면 화면이 들고 있던 옛 사본으로 덮게 되어, 시작 → 끝을 이어 고칠 때 시작이 날아간다.
async function saveSchoolTerm(term, school, grade, v) {
  var k = schedKey(term, school, grade);
  var one = Object.assign({ term: term, school: school, grade: grade, updated: Date.now() }, v);
  var patch = {}; patch[k] = one;
  await db.collection("appConfig").doc("schoolTerms").set(patch, { merge: true });
  S.schoolTerms[k] = Object.assign({}, S.schoolTerms[k], one);
}

// ---- 불러오기는 화면 밖에서 돈다 ----
// 학교마다 몇 초에서 몇십 초씩 걸린다. 화면에 매어두면 다른 메뉴를 누르는 순간 통째로 날아간다.
var PULL_JOB = { running: false, done: 0, total: 0, now: "", msg: "", diffs: [], stop: false, subs: [] };
function jobSnap() { var o = {}; for (var k in PULL_JOB) if (k !== "subs") o[k] = PULL_JOB[k]; o.diffs = PULL_JOB.diffs.slice(); return o; }
function jobEmit() { var sn = jobSnap(); PULL_JOB.subs.slice().forEach(function (f) { try { f(sn); } catch (e) {} }); }
function jobSub(fn) { PULL_JOB.subs.push(fn); fn(jobSnap()); return function () { var i = PULL_JOB.subs.indexOf(fn); if (i >= 0) PULL_JOB.subs.splice(i, 1); }; }

async function fetchSchedule(school, from, to, kind) {
  var u = firebase.auth().currentUser, tu = teamAuth.currentUser;
  if (!u || !tu) throw new Error("로그인이 풀렸습니다");
  var r = await fetch("/api/schedule", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ idToken: await tu.getIdToken(), classToken: await u.getIdToken(),
      school: school, from: from, to: to, kind: kind }) });
  var j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ("불러오지 못했어요 (" + r.status + ")"));
  return j || {};
}
// 서버가 이름을 셋 중 하나로 못박아 보낸다. 이것 말고는 옛 양식이거나 손으로 적은 것이다.
var CANON_LABEL = /^(중간고사|기말고사|졸업고사)$/;
function planNote(plan) {
  var bs = (plan && plan.blocks) || [];
  if (!bs.length) return "";
  var line = bs.map(function (b) {
    var d = b.start.slice(5).replace("-", "/");
    var e = b.end && b.end !== b.start ? "~" + b.end.slice(8) : "";
    return b.name + " " + d + e;
  }).join(" · ");
  return line + (plan.pending ? " · 기말 아직" : "");
}
var PULL_CONC = 4;   // 학교끼리는 상관이 없다. 한 줄로 세우면 느린 학교가 곧 전체 시간이 된다
async function runPull(term, targets, from, to, kind) {
  if (PULL_JOB.running) return;
  var names = []; targets.forEach(function (t) { if (names.indexOf(t.school) < 0) names.push(t.school); });
  PULL_JOB.running = true; PULL_JOB.done = 0; PULL_JOB.total = names.length;
  PULL_JOB.now = ""; PULL_JOB.msg = ""; PULL_JOB.diffs = []; PULL_JOB.stop = false;
  jobEmit();
  var filled = 0, same = 0, relabeled = 0;
  var notFound = [], noExam = [], noData = [], fromDoc = [], dupe = [];
  var inflight = [], next = 0;
  var showNow = function () { PULL_JOB.now = inflight.join(", "); };

  async function pullOne(school) {
    var r;
    try { r = await fetchSchedule(school, from, to, kind); }
    catch (e) { notFound.push(school + "(" + e.message + ")"); return; }
    // ⚠ 이유를 버리면 "못 찾음: 서운중" 만 남아 왜인지 알 길이 없다.
    //    2026-09-04에 이것 때문에 짐작으로 팠다 — 실제로는 학교 **이름** 때문에 못 찾은 것이었다.
    if (r.error) { notFound.push(school + " — " + r.error); return; }
    if (!r.hasAny) { noData.push(school + (r.docReason ? " (" + r.docReason + ")" : "")); return; }
    if (r.dupes && r.dupes.length) dupe.push(school + " (" + r.dupes.join("·") + "에도 있음)");
    if (r.via === "doc") fromDoc.push(school + (r.docTitle ? " (" + r.docTitle + ")" : ""));
    // 그림에서 읽은 것은 대조할 원문이 없다. 요일로 걸렀어도 사람이 한 번 봐야 한다.
    else if (r.via === "image") fromDoc.push(school + " (그림)");
    // 왜 못 찾았는지를 화면에 그대로 보여준다. 안 그러면 "그냥 안 된다"밖에 알 수 없다.
    else if (r.docReason) noExam.push(school + " — " + r.docReason);
    var note = planNote(r.plan);
    var srcU = (r.src && r.src.url) || "", srcN = (r.src && r.src.name) || "";
    var mine = targets.filter(function (x) { return x.school === school; });
    for (var i = 0; i < mine.length; i++) {
      var t = mine[i];
      var g = r.byGrade && r.byGrade[t.grade];
      // 시험을 못 찾았어도 학기 계획과 근거 링크는 적어둔다 —
      // "이번 회차에 시험이 없다"와 "못 찾았다"를 가르는 유일한 단서이고, 손으로 채울 때 바로 필요하다.
      var put = {};
      if (note) put.plan = note;
      if (srcU && !t.cur.srcUrl) { put.srcUrl = srcU; put.srcName = srcN; }
      if (Object.keys(put).length) { try { await saveSchoolTerm(term, t.school, t.grade, put); } catch (e) {} }
      if (!g) { noExam.push(t.school + " " + t.grade); continue; }
      if (t.cur.start === g.start && t.cur.end === g.end) {
        // 날짜는 맞는데 이름이 옛 나이스 이름 그대로일 수 있다. 이미 셋 중 하나면 손대지 않는다 —
        // 선생님이 직접 적어 넣은 것을 덮어쓰지 않으려는 것이다.
        if (g.name && t.cur.label !== g.name && !CANON_LABEL.test(t.cur.label || "")) {
          try { await saveSchoolTerm(term, t.school, t.grade, { label: g.name }); relabeled++; } catch (e) {}
        }
        same++; continue;
      }
      // 이미 적어둔 것이 다르면 **덮지 않는다.** 학교가 바꿨을 수도, 사람이 맞게 고쳤을 수도 있다.
      if (t.cur.start || t.cur.end) {
        PULL_JOB.diffs.push({ school: t.school, grade: t.grade, mine: Object.assign({}, t.cur),
                              neis: { start: g.start, end: g.end }, name: g.name });
        jobEmit();
        continue;
      }
      try { await saveSchoolTerm(term, t.school, t.grade, { start: g.start, end: g.end, label: g.name || "" }); filled++; }
      catch (e) { notFound.push(t.school + "(저장 실패)"); }
    }
  }
  async function worker() {
    while (next < names.length && !PULL_JOB.stop) {
      var school = names[next++];
      inflight.push(school); showNow(); jobEmit();
      try { await pullOne(school); } catch (e) {}
      inflight.splice(inflight.indexOf(school), 1);
      PULL_JOB.done++; showNow(); jobEmit();
    }
  }
  var ws = []; for (var w = 0; w < Math.min(PULL_CONC, names.length); w++) ws.push(worker());
  await Promise.all(ws);
  var parts = [];
  if (filled) parts.push("채움 " + filled + "칸");
  if (same) parts.push("이미 맞음 " + same);
  if (relabeled) parts.push("시험 이름 정리 " + relabeled + "칸");
  if (PULL_JOB.diffs.length) parts.push("다른 값 " + PULL_JOB.diffs.length + "건");
  if (noExam.length) parts.push("이 회차 시험 없음: " + noExam.join(", "));
  if (noData.length) parts.push("학사일정 자체가 없음: " + noData.join(", "));
  if (fromDoc.length) parts.push("첨부문서에서 읽음(확인 필요): " + fromDoc.join(", "));
  if (dupe.length) parts.push("같은 이름 학교 있음: " + dupe.join(", "));
  if (notFound.length) parts.push("못 찾음: " + notFound.join(", "));
  PULL_JOB.msg = parts.length ? parts.join(" · ") : "바뀐 것이 없다";
  PULL_JOB.running = false; PULL_JOB.now = "";
  jobEmit();
}

// 화면에 놓을 줄 — 학생이 실제로 다니는 (학교·학년) + 이 회차에 이미 적어둔 것
function termRows() {
  var m = {};
  Object.keys(S.schoolTerms).forEach(function (k) {
    var v = S.schoolTerms[k];
    if (v && v.term === S.term && v.school) m[v.school + "__" + v.grade] = Object.assign({ n: 0 }, v);
  });
  S.students.forEach(function (x) {
    if (!x.school || !x.grade) return;
    var k = x.school + "__" + x.grade;
    if (!m[k]) m[k] = { term: S.term, school: x.school, grade: x.grade, n: 0 };
    m[k].n++;
  });
  var out = Object.keys(m).map(function (k) { return m[k]; });
  out.sort(function (a, b) {
    return gradeRank(a.grade) - gradeRank(b.grade) || String(a.school).localeCompare(String(b.school), "ko");
  });
  return out;
}

function renderTermsJobOnly() {

function jobBoxHtml(job) {
  if (!job.running && !job.msg && !job.diffs.length) return '<div id="tm-jobbox"></div>';
  return '<div id="tm-jobbox" class="banner" style="margin:0 0 10px">' +
    (job.running ? '<div><b>찾는 중 ' + job.done + '/' + job.total + '</b>' + (job.now ? ' <span class="muted">' + esc(job.now) + '</span>' : "") +
      ' <button class="mini" id="tm-stop">멈추기</button></div>' : "") +
    (job.msg ? '<div style="font-size:13px">' + esc(job.msg) + '</div>' : "") +
    (job.diffs.length ? '<div style="margin-top:6px"><b>이미 적어둔 것과 다르다</b> — 덮지 않았다. 맞는 쪽을 고른다.' +
      job.diffs.map(function (d, i) {
        return '<div style="font-size:13px;margin-top:4px">' + esc(d.school + " " + d.grade) + ' · 지금 <b>' +

// ---------- 내신 참여표 ----------
//
// 수업관리 앱의 ExamBoard/ExamEntry 와 **같은 자리에 같은 모양으로** 쓴다.
//   classes/{cid}/exams/{회차키}__{sid}   회차키 = 회차의 / 와 공백을 _ 로 바꾼 것
//   회차는 학원 전체로 하나 — appConfig/examTerm
// 그래서 여기서 만든 것이 앱의 참여표에 그대로 뜨고, 학생이 낸 것도 여기 그대로 보인다.
//
// 이 표가 답하는 질문은 "누가 언제 안 오고 언제 돌아오나"다. 그래서 본체는 표가 아니라
// **날짜 띠**다 (원본 구글시트가 그랬다).

var EXAM_MARKS = {
  prep: { t: "직", label: "직보 (수학시험 전날)", bg: "#f6e7df", fg: "#c2703f" },
  math: { t: "수", label: "수학시험", bg: "#fae3e2", fg: "#d6453f" },
  exam: { t: "시", label: "내신기간", bg: "#f0ece5", fg: "#7c6f5f" },
  back: { t: "첫", label: "복귀 (정규 첫 등원)", bg: "#e3edf5", fg: "#2b5f8a" },
};
var PAINT_MODES = [
  { key: "exam", label: "시험기간", bg: "#f0ece5", fg: "#7c6f5f" },
  { key: "math", label: "수학시험", bg: "#fae3e2", fg: "#d6453f" },
  { key: "prep", label: "직보", bg: "#f6e7df", fg: "#c2703f" },
  { key: "back", label: "복귀", bg: "#e3edf5", fg: "#2b5f8a" },
  { key: "erase", label: "지우개", bg: "#fff", fg: "#8a7f72" },
];
// 앱의 목록과 같아야 한다 — 자유 입력이면 중동고/중동고등학교/중동이 섞여 같은 학교인지
// 판별 자체가 안 된다. 비교하려면 먼저 값이 같아야 한다.
var KNOWN_SCHOOLS = ["개포고", "건대부고", "경기고", "경기여고", "경신고", "광남고", "단대부고", "대성고",
  "덕수고", "반포고", "배명고", "배문고", "배재고", "보인고", "상문고", "서울고",
  "서초고", "선덕고", "숙명여고", "언남고", "영동고", "은광여고", "잠신고", "정신여고",
  "중대부고", "중동고", "중산고", "중흥고", "진선여고", "창문여고", "한대부고", "현대고",
  "효성고", "휘문고"];
var DAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];
var examKey = function (term, sid) { return String(term).replace(/[\/\s]+/g, "_") + "__" + sid; };
var examSig = function (v) { return [v.start || "", v.end || "", v.math || ""].join("~"); };
var isIndividual = function (c) { return c && c.type === "individual"; };
function isActiveOn(st, d) {
  if (!st) return false;
  if (st.startDate && d < st.startDate) return false;
  if (st.endDate && d > st.endDate) return false;
  return true;
}
function dayAfter(d) { return d && parseYmd(d) ? addDays(d, 1) : ""; }
function dayBefore(d) { return d && parseYmd(d) ? addDays(d, -1) : ""; }
function monthOf(d) { return String(d || "").slice(0, 7); }
function shiftMonth(ym, delta) {
  var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
  var d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
}
function daysOfMonth(ym) {
  var out = [], y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
  var last = new Date(y, m, 0).getDate();
  for (var i = 1; i <= last; i++) out.push(y + "-" + pad2(m) + "-" + pad2(i));
  return out;
}
// 안 오는 구간은 내신기간이 아니라 **직보 다음날 ~ 복귀 전날**이다.
// 직보가 마지막 수업이고 그 다음 오는 날이 복귀라, 시험이 끝난 뒤라도 복귀 전이면 안 온다.
function outRange(v) {
  return { s: (v && v.prep) ? dayAfter(v.prep) : ((v && v.start) || ""),
           e: (v && v.back) ? dayBefore(v.back) : ((v && v.end) || "") };
}
function isOutOn(v, d) { var r = outRange(v); return !!(r.s && r.e && d >= r.s && d <= r.e); }
// 수업일 판정. **반 요일을 안 보는 함수를 쓰면 그 달 전체가 수업일이 되어 31회로 나온다.**
// 제출에 요일이 적혀 있으면 그걸 먼저 쓴다 — 나중에 반 요일이 바뀌어도 그때 센 회차가 재현된다.
function isClassDay(cls, st, d, v) {
  if (!isActiveOn(st, d)) return false;
  var dow = new Date(d + "T00:00:00").getDay();
  var days = (v && v.days && v.days.length) ? v.days
           : (isIndividual(cls) ? (st.days || []) : (cls.classDays || []));
  return days.indexOf(dow) >= 0;
}
// 그 달의 등원 회차 — **수강료에 쓰는 숫자다.**
// 띠는 복귀일에서 끝나지만 회차는 그 달 전체로 센다. 띠로 세면 그 뒤 수업일이 빠진다.
function attendCount(cls, st, v, monthDays, examMonth) {
  var come = {}, total = 0, skip = 0;
  monthDays.forEach(function (d) {
    if (!isClassDay(cls, st, d, v)) return;
    total++;
    if (isOutOn(v, d)) { skip++; return; }
    come[d] = 1;
  });
  // 직보·복귀는 수업 요일이 아니어도 오는 날이다. 그 달 안에 있을 때만.
  [(v && v.prep) || "", (v && v.back) || ""].forEach(function (d) {
    if (!d || monthOf(d) !== examMonth || come[d]) return;
    come[d] = 1;
  });
  return { total: total, skip: skip, come: Object.keys(come).length };
}
function markOf(v, d) {
  if (v.math && d === v.math) return EXAM_MARKS.math;
  if (v.prep && d === v.prep) return EXAM_MARKS.prep;
  if (v.back && d === v.back) return EXAM_MARKS.back;
  if (v.start && v.end && d >= v.start && d <= v.end) return EXAM_MARKS.exam;
  return null;
}
function examSchoolOpts() {
  var m = {};
  KNOWN_SCHOOLS.forEach(function (x) { m[x] = 1; });
  S.students.forEach(function (x) { if (x.school) m[x.school] = 1; });
  Object.keys(S.schoolTerms).forEach(function (k) { var v = S.schoolTerms[k]; if (v && v.school) m[v.school] = 1; });
  return Object.keys(m).sort();
}

async function loadExams() {
  if (!S.term) return;
  var cs = activeClasses();
  await Promise.all(cs.map(function (c) {
    return db.collection("classes").doc(c.id).collection("exams").where("term", "==", S.term).get().then(function (s) {
      var m = {}; s.forEach(function (d) { var v = d.data(); m[v.sid] = v; }); S.exams[c.id] = m;
    }).catch(function () { S.exams[c.id] = {}; });
  }));
}
async function saveExamTerm(term) {
  await db.collection("appConfig").doc("examTerm").set({ term: term, time: Date.now() }, { merge: true });
  S.term = term;
}
async function saveExam(cid, sid, data) {
  await db.collection("classes").doc(cid).collection("exams").doc(examKey(S.term, sid))
    .set(Object.assign({}, data, { term: S.term, sid: sid, updated: Date.now() }), { merge: true });
  S.exams[cid] = S.exams[cid] || {};
  S.exams[cid][sid] = Object.assign({}, S.exams[cid][sid], data, { term: S.term, sid: sid });
}
async function deleteExam(cid, sid) {
  await db.collection("classes").doc(cid).collection("exams").doc(examKey(S.term, sid)).delete();
  if (S.exams[cid]) delete S.exams[cid][sid];
}
// 학교 일정(appConfig/schoolTerms)에 적어둔 값. 대신 입력을 열 때 빈 칸을 이걸로 채운다.
function schedFor(school, grade) {
  var key = String(S.term || "").replace(/[^0-9A-Za-z가-힣]+/g, "_") + "__" + school + "__" + grade;
  return S.schoolTerms[key] || null;
}

// ---- 학교 일정으로 한꺼번에 채우기 ----
//
// 학교 일정은 이 앱에서만 채운다(2026-09-04 결정). 선생님들은 앱에서 참여표를
// **보기만** 하므로, 일정 → 참여표로 옮기는 일도 여기서 해야 한다.
//
// 자동으로 덮지 않는다 — 분반마다 진짜 다를 수 있고, 학생이 맞게 낸 것을
// 지워버리면 되돌릴 방법이 없다. 그래서 «안 낸 사람 채우기» 와
// «다르게 낸 사람 맞추기» 를 나눠 두고 각각 물어본다.
function schedFields(x, sc, keep) {
  return {
    name: x.st.name, school: sc.school, grade: sc.grade,
    start: sc.start, end: sc.end, math: sc.math || "",
    // 직보를 손으로 고쳐둔 사람은 그대로 둔다 (전날이 아니면 일부러 바꾼 것)
    prep: (keep && keep.prep && keep.prep !== dayBefore(keep.math)) ? keep.prep
          : (sc.math ? dayBefore(sc.math) : ""),
    // 복귀는 선생님이 학생별로 정한다. 이미 정해둔 게 있으면 안 건드린다.
    back: (keep && keep.back) || sc.back || "",
    note: (keep && keep.note) || "",
    byTeacher: true, fromSchedule: true,
  };
}
// 안 낸 사람 중 학교 일정이 있는 사람 / 이미 냈는데 일정과 다른 사람
function fillTargets(rows) {
  var fillable = [], off = [];
  rows.forEach(function (x) {
    if (!x.school || !x.grade) return;
    var sc = schedFor(x.school, x.grade);
    if (!sc || !sc.start) return;
    if (!x.v) { fillable.push({ x: x, s: sc }); return; }
    if (examSig(x.v) !== examSig(sc) || x.v.school !== sc.school || x.v.grade !== sc.grade)
      off.push({ x: x, s: sc });
  });
  return { fillable: fillable, off: off };
}
async function runFill(list, keepOld, btn, label) {
  if (!list.length) return;
  btn.disabled = true; btn.textContent = "…";
  var n = 0;
  try {
    for (var i = 0; i < list.length; i++) {
      var it = list[i];
      await saveExam(it.x.cls.id, it.x.st.id, schedFields(it.x, it.s, keepOld ? it.x.v : null));
      n++;
    }
    renderExams();
    alert(label + " " + n + "명 ✓");
  } catch (e) {
    renderExams();
    alert("하다 멈췄다 (" + n + "명까지): " + e.message);
  }
}

// 표에 놓을 줄 — 담당 반을 가로질러 모은다. 반별로 보면 "이번 주에 누가 빠지나"를 못 본다.
function examRows() {
  var out = [];
  activeClasses().forEach(function (c) {
    rosterStudents(c).forEach(function (r) {
      var v = (S.exams[c.id] || {})[r.id] || null;
      var grade = (v && v.grade) || gradeOf(r) || "";
      out.push({ cls: c, st: r, v: v, grade: grade, school: (v && v.school) || schoolOf(r) || "" });
    });
  });
  return out;
}

// ----- 정렬 -----
// 열 머리를 누르면 오름 → 내림 → 원래 순서(반 차례 · 명단 차례)로 돈다.
// 빈 칸은 방향과 상관없이 **늘 맨 아래** — 안 채운 사람을 찾으려고 정렬하는 게 아니다.
//
// ⚠ 띠와 표가 **같은 목록**을 써야 한다. 따로 걸면 이름은 같은 줄에 있는데
//   날짜 칸이 다른 사람 것이 되어버린다. 그래서 여기서 한 번만 걸고 둘 다 그걸 따라간다.
var EX_SORTS = [
  { key: "name", label: "이름" }, { key: "cls", label: "반" }, { key: "homeroom", label: "담임" },
  { key: "school", label: "학교" }, { key: "start", label: "내신기간" }, { key: "math", label: "수학" },
  { key: "come", label: "등원" },
];
function homeroomOf(st) {
  var p = st.pid ? S.byPid[st.pid] : null;
  return p && p.homeroom ? teacherName(p.homeroom) : "";
}
function examSortRows(rows, monthDays, examMonth) {
  var so = S.exSort;
  if (!so) return rows;
  var keyOf = function (x) {
    var v = x.v;
    if (so.key === "name") return x.st.name || "";
    if (so.key === "cls") return x.cls.name || "";
    if (so.key === "homeroom") return homeroomOf(x.st);
    if (so.key === "school") return (v && v.school) || x.school || "";
    if (so.key === "start") return (v && v.start) || "";     // YYYY-MM-DD 라 글자 순 = 날짜 순
    if (so.key === "math") return (v && v.math) || "";
    if (so.key === "come") {
      if (!v) return "";
      var n = attendCount(x.cls, x.st, v, monthDays, examMonth).come;
      return ("00" + n).slice(-3);                            // 숫자를 글자 순으로 비교하려고
    }
    return "";
  };
  var byName = function (a, b) { return String(a.st.name || "").localeCompare(String(b.st.name || ""), "ko"); };
  return rows.slice().sort(function (a, b) {
    var ka = keyOf(a), kb = keyOf(b);
    if (!ka && !kb) return byName(a, b);
    if (!ka) return 1;            // 빈 칸은 늘 아래
    if (!kb) return -1;
    var c = ka.localeCompare(kb, "ko");
    return (so.dir === "desc" ? -c : c) || byName(a, b);
  });
}
function exSortTh(key, label, style) {
  var on = S.exSort && S.exSort.key === key;
  return '<th class="sortable" data-esort="' + key + '"' + (style ? ' style="' + style + '"' : "") + '>' + esc(label) +
    ' <span class="ar' + (on ? "" : " off") + '">' + (on ? (S.exSort.dir === "asc" ? "▲" : "▼") : "↕") + '</span></th>';
}

function renderExams() {
  var el = $("#sec-exams");
  if (!S.term) {
    navBadge("exams", 0, false);
    el.innerHTML = '<h2>내신 참여표</h2>' +
      '<div class="row"><input type="text" id="ex-term" placeholder="예: 2026 2학기 중간" style="max-width:240px">' +
      '<button class="btn" id="ex-open">회차 열기</button></div>' +
      '<p class="muted" style="font-size:13px">회차를 열면 학생 화면에 <b>내신</b> 탭이 생기고, 여기와 수업관리 앱 양쪽에서 참여표를 만들 수 있다. ' +
      '회차는 학원 전체로 하나다.</p>';
    $("#ex-open").onclick = async function () {
      var t = $("#ex-term").value.trim(); if (!t) return;
      this.disabled = true;
      try { await saveExamTerm(t); await loadExams(); renderExams(); } catch (e) { this.disabled = false; alert("열지 못했다: " + e.message); }
    };
    return;
  }

  var all = examRows();
  var grades = {}; GRADES.forEach(function (g) { grades[g] = 0; });
  all.forEach(function (x) { if (grades[x.grade] !== undefined) grades[x.grade]++; });
  if (!S.exGrade || grades[S.exGrade] === undefined) {
    S.exGrade = GRADES.filter(function (g) { return grades[g] > 0; })[0] || "고1";
  }
  var rows = all.filter(function (x) { return x.grade === S.exGrade; });
  navBadge("exams", all.filter(function (x) { return !x.v; }).length, true);

  // 띠 = 시험 있는 달 1일 ~ 가장 늦은 복귀일. 회차 달 = 등원 회차를 세는 달.
  // 정렬과 상관없이 같은 값이라 먼저 구한다 (등원 회차 정렬이 이걸 쓴다).
  var startsAll = [], endsAll = [];
  rows.filter(function (x) { return x.v; }).forEach(function (x) {
    if (x.v.start) startsAll.push(x.v.start);
    if (x.v.back) endsAll.push(x.v.back); else if (x.v.end) endsAll.push(x.v.end);
  });
  startsAll.sort(); endsAll.sort();
  var examMonth = startsAll.length ? monthOf(startsAll[0]) : "";
  var strip = [];
  if (startsAll.length) {
    var to = endsAll.length ? endsAll[endsAll.length - 1] : startsAll[startsAll.length - 1];
    var d = examMonth + "-01";
    while (d <= to && strip.length < 120) { strip.push(d); d = addDays(d, 1); }
  }
  var monthDays = examMonth ? daysOfMonth(examMonth) : [];

  // 정렬은 여기서 한 번만. 띠와 표가 같은 목록을 따라간다.
  rows = examSortRows(rows, monthDays, examMonth);
  var done = rows.filter(function (x) { return x.v; }), miss = rows.filter(function (x) { return !x.v; });

  // 같은 학교·학년인데 기간이 갈린 것. 자동으로 고치지 않는다 — 분반마다 진짜 다를 수 있다.
  var sigs = {};
  done.forEach(function (x) {
    var k = x.v.school + "__" + x.grade;
    (sigs[k] = sigs[k] || {})[examSig(x.v)] = (sigs[k][examSig(x.v)] || 0) + 1;
  });
  var clash = Object.keys(sigs).filter(function (k) { return Object.keys(sigs[k]).length > 1; });

  el.innerHTML = '<h2>내신 참여표 <span class="n">' + esc(S.term) + '</span><span class="sp"></span>' +
    '<button class="mini" id="ex-edit-term">회차 바꾸기</button>' +
    '<button class="mini" id="ex-re">다시 읽기</button>' +
    '</h2>' +
    '<div class="chips">' + GRADES.map(function (g) {
      return '<button class="mini ' + (g === S.exGrade ? "on" : "") + '" data-eg="' + g + '">' +
        '<span class="pill ' + gradeCls(g) + '">' + g + '</span> ' + grades[g] + '</button>' ;
    }).join("") +
    '<span class="sp" style="flex:1"></span><span class="muted" style="font-size:12px">정렬</span>' +
    EX_SORTS.map(function (o) {
      var on = S.exSort && S.exSort.key === o.key;
      return '<button class="mini ' + (on ? "on" : "") + '" data-esort="' + o.key + '">' + o.label +
        (on ? (S.exSort.dir === "asc" ? " ▲" : " ▼") : "") + '</button>';
    }).join("") +
    (S.exSort ? '<button class="mini" data-esort="">원래 순서</button>' : "") + '</div>' +
    '<div class="stat"><div class="' + (miss.length ? "bad" : "good") + '"><b>' + done.length + '/' + rows.length + '</b><span>낸 사람</span></div>' +
    '<div><b>' + (examMonth ? Number(examMonth.slice(5)) + "월" : "—") + '</b><span>회차 달</span></div>' +
    (clash.length ? '<div class="bad"><b>' + clash.length + '</b><span>일정 갈림</span></div>' : "") + '</div>' +
    (clash.length ? '<div class="banner" style="margin:0 0 10px"><b>같은 학교·학년인데 일정이 다르다</b> — ' +
      esc(clash.map(function (k) { return k.split("__")[0] + " " + k.split("__")[1]; }).join(", ")) +
      '. 분반마다 진짜 다를 수 있어 자동으로 고치지 않는다. 표에서 확인하고 고칠 것.</div>' : "") +
    fillBoxHtml(rows) +
    '<div id="ex-entry"></div>' +
    (strip.length ? stripHtml(strip, done) : '<div class="empty">아직 낸 사람이 없다. 아래에서 학생을 눌러 넣는다.</div>') +
    tableHtml(rows, monthDays, examMonth) +
    (miss.length ? '<div style="margin-top:10px"><b style="font-size:13px">아직 안 낸 학생 ' + miss.length + '명</b> ' +
      '<span class="muted" style="font-size:12px">— 이름을 누르면 대신 넣는다</span><div class="chips" style="margin-top:6px">' +
      miss.map(function (x) { return '<button class="mini warn" data-ent="' + esc(x.cls.id + "|" + x.st.id) + '">' + esc(x.st.name) + ' <span class="muted">' + esc(x.cls.name) + '</span></button>'; }).join("") +
      '</div></div>' : '<p class="green" style="font-size:13px;margin-top:10px">' + esc(S.exGrade) + ' 전원이 냈다.</p>') +
    '<p class="muted" style="font-size:12px;margin-top:8px">' +
    Object.keys(EXAM_MARKS).map(function (k) { var m = EXAM_MARKS[k];
      return '<span class="pill" style="background:' + m.bg + ';color:' + m.fg + '">' + m.t + '</span> ' + esc(m.label); }).join(" · ") +
    '</p>';

  $$("[data-eg]", el).forEach(function (b) { b.onclick = function () { S.exGrade = b.getAttribute("data-eg"); S.exEntry = null; renderExams(); }; });
  // 오름 → 내림 → 원래 순서. 같은 칩·같은 열 머리 어느 쪽을 눌러도 같이 돈다.
  $$("[data-esort]", el).forEach(function (b) {
    b.onclick = function () {
      var k = b.getAttribute("data-esort");
      if (!k) S.exSort = null;
      else if (!S.exSort || S.exSort.key !== k) S.exSort = { key: k, dir: "asc" };
      else if (S.exSort.dir === "asc") S.exSort = { key: k, dir: "desc" };
      else S.exSort = null;
      keepScroll(renderExams);
    };
  });
  $$("[data-ent]", el).forEach(function (b) { b.onclick = function () { openEntry(b.getAttribute("data-ent")); }; });
  $$("[data-fix]", el).forEach(function (b) { b.onclick = function () { openEntry(b.getAttribute("data-fix")); }; });
  $$("[data-del]", el).forEach(function (b) {
    b.onclick = async function () {
      var kk = b.getAttribute("data-del").split("|");
      if (!confirm("이 제출을 지운다. 학생이 다시 낼 수 있다.")) return;
      try { await deleteExam(kk[0], kk[1]); renderExams(); } catch (e) { alert("지우지 못했다: " + e.message); }
    };
  });
  $$("[data-back]", el).forEach(function (inp) {
    inp.onchange = async function () {
      var kk = inp.getAttribute("data-back").split("|");
      try { await saveExam(kk[0], kk[1], { back: inp.value }); renderExams(); }
      catch (e) { alert("저장하지 못했다: " + e.message); }
    };
  });
  $("#ex-re").onclick = function () { S.exams = {}; loadExams().then(renderExams); };
  // 학교 일정으로 채우기. 덮어쓰는 쪽은 몇 명인지 이름까지 보여주고 묻는다.
  if ($("#ex-fill")) $("#ex-fill").onclick = function () {
    var t = window.__FILL;
    if (!confirm("학교 일정으로 " + t.fillable.length + "명을 채운다.\n이미 낸 학생은 안 건드린다. 계속할까?")) return;
    runFill(t.fillable, false, this, "채웠다");
  };
  if ($("#ex-sync")) $("#ex-sync").onclick = function () {
    var t = window.__FILL;
    if (!confirm("학교 일정과 다르게 낸 " + t.off.length + "명을 일정에 맞춘다.\n" +
      "손으로 고친 직보와 복귀 날짜는 그대로 둔다. 계속할까?\n\n" +
      t.off.slice(0, 15).map(function (o) { return "  " + o.x.st.name + " (" + o.x.cls.name + ")"; }).join("\n") +
      (t.off.length > 15 ? "\n  … 외 " + (t.off.length - 15) + "명" : ""))) return;
    runFill(t.off, true, this, "맞췄다");
  };
  $("#ex-edit-term").onclick = async function () {
    var t = prompt("회차 이름 (학원 전체로 하나다)", S.term);
    if (t === null || !t.trim() || t.trim() === S.term) return;
    try { await saveExamTerm(t.trim()); S.exams = {}; await loadExams(); renderExams(); }
    catch (e) { alert("바꾸지 못했다: " + e.message); }
  };
  if (S.exEntry) drawEntry();
}

function stripHtml(strip, done) {
  var head = '<tr><th class="rn">이름</th>' + strip.map(function (d) {
    var day = Number(d.slice(8));

  }).join("") + '</tr><tr><th class="rn"></th>' + strip.map(function (d) {
    var w = new Date(d + "T00:00:00").getDay();
    return '<th class="wd" style="color:' + (w === 0 ? "#d6453f" : w === 6 ? "#2b5f8a" : "#8a7f72") + '">' + DAY_NAMES[w] + '</th>';
  }).join("") + '</tr>';

// ---- 대신 입력 — 달력에 칠한다 ----
function openEntry(key) {
  var kk = key.split("|"), cid = kk[0], sid = kk[1];
  var cls = S.classes.filter(function (c) { return c.id === cid; })[0];
  var st = (cls.roster || []).filter(function (r) { return r.id === sid; })[0];
  var cur = (S.exams[cid] || {})[sid] || null;
  var school = (cur && cur.school) || schoolOf(st) || "";
  var grade = (cur && cur.grade) || gradeOf(st) || S.exGrade;
  var sch = (!cur && school && grade) ? schedFor(school, grade) : null;   // 학교 일정에서 빈 칸 채우기
  S.exEntry = { cid: cid, sid: sid, cls: cls, st: st, fromSched: !!sch };
  S.exForm = {
    school: school, grade: grade,
    start: (cur && cur.start) || (sch && sch.start) || "",
    end: (cur && cur.end) || (sch && sch.end) || "",
    math: (cur && cur.math) || (sch && sch.math) || "",
    prep: (cur && cur.prep) || (sch && sch.math ? dayBefore(sch.math) : "") || "",
    back: (cur && cur.back) || (sch && sch.back) || "",
    note: (cur && cur.note) || "",
  };
  S.exDays = (cur && cur.days && cur.days.length) ? cur.days.slice()
           : (isIndividual(cls) ? ((st.days || []).slice()) : ((cls.classDays || []).slice()));
  S.exMonth = monthOf(S.exForm.start || S.exForm.math || TODAY);
  S.exMode = "exam"; S.exAnchor = "";
  renderExams();
  var box = $("#ex-entry"); if (box) try { box.scrollIntoView({ block: "center" }); } catch (e) {}
}
function drawEntry() {
  var box = $("#ex-entry"); if (!box) return;
  box.innerHTML = entryHtml();
  bindEntry();
}
function entryHtml() {

      return '<button class="mini ' + (S.exDays.indexOf(i) >= 0 ? "on" : "") + '" data-end="' + i + '">' + d + '</button>'; }).join("") +
    '<span class="muted" style="font-size:12px">달력의 수업일과 등원 회차가 여기서 나온다</span></div>' +

    '<span class="sp" style="flex:1"></span><button class="mini" data-enmo="-1">‹</button>' +

      : S.exMode === "erase" ? "지울 칸을 누른다" : "해당 날짜를 누른다 (다시 누르면 지워진다)") + '</div>' +

    (f.math ? ' · 수학 <b>' + esc(fmtMD(f.math)) + '</b>' : "") +

}
function paintMark(d) {
  var f = S.exForm;
  if (f.math && d === f.math) return EXAM_MARKS.math;
  if (f.prep && d === f.prep) return EXAM_MARKS.prep;
  if (f.back && d === f.back) return EXAM_MARKS.back;
  if (S.exAnchor && d === S.exAnchor) return EXAM_MARKS.exam;
  if (f.start && f.end && d >= f.start && d <= f.end) return EXAM_MARKS.exam;
  return null;
}
function paint(d) {
  var f = S.exForm;
  if (S.exMode === "erase") {
    if (f.math === d) f.math = "";
    if (f.prep === d) f.prep = "";
    if (f.back === d) f.back = "";
    if (f.start && f.end && d >= f.start && d <= f.end) { f.start = ""; f.end = ""; }
    S.exAnchor = ""; return;
  }
  if (S.exMode === "exam") {
    if (!S.exAnchor) { S.exAnchor = d; f.start = d; f.end = d; return; }
    f.start = S.exAnchor < d ? S.exAnchor : d;
    f.end = S.exAnchor < d ? d : S.exAnchor;
    S.exAnchor = ""; return;
  }
  var k = S.exMode, was = f[k];
  f[k] = (was === d) ? "" : d;
  // 수학시험을 정하면 직보는 그 전날로 따라간다. 직접 고쳐둔 것은 놔둔다.
  if (k === "math" && (!f.prep || f.prep === dayBefore(was))) f.prep = f.math ? dayBefore(f.math) : "";
}
