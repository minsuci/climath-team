  var arr = [];
  s.forEach(function (d) { arr.push(Object.assign({ id: d.id }, d.data())); });
  arr.sort(function (a, b) { return (b.date || "") < (a.date || "") ? -1 : (b.date || "") > (a.date || "") ? 1 : 0; });
  S.minutes = arr;
  return arr;
}
// 마크다운을 화면에 그린다. 볼트 노트에 실제로 쓰는 것만 다룬다 —
// 제목·굵게·목록·표·인용(콜아웃)·코드·취소선·링크. 라이브러리를 안 쓴다(CDN 하나가 늘면 그게 죽을 때 같이 죽는다).
// 참석 줄에서 사람을 뽑는다. "대치 — 원장 · 고우빈 팀장 · 한민수" 처럼 적혀 있다.
// 이름만 쥐어야 본문에서 찾을 수 있다 — 본문은 «고우빈 팀장» 이라고도 «고우빈» 이라고도 쓴다.
function attendNames(attend) {
  var out = [], seen = {};
  String(attend || "").split(/[·,\/]/).forEach(function (t) {
    t = t.trim().replace(/^[^\s—]+\s*—\s*/, "").trim();     // 앞의 «대치 —» 를 뗀다
    if (!t) return;
    var name = t.split(/\s+/)[0];
    if (name.length < 2) name = t;                          // «원장» 처럼 직함이 곧 이름인 경우
    if (!name || seen[name]) return;
    seen[name] = 1;
    out.push({ name: name, label: t });
  });
  return out;
}
// 회의록은 사람을 **이름으로만 부르지 않는다.** "예비고1 담당 강사", "담임 전원", "고등부", "전원" —
// 이런 자리도 그 사람 것이다. 이름만 찾으면 정작 자기가 맡은 일을 놓친다.
//
// 소속은 **앱이 아는 것으로만** 판단한다 — 그 선생님이 맡은 반 이름에서 학년을 읽는다.
// 반 이름이 "예비고1S 월금" 이면 «예비고1» 이 그 사람의 학년이다.
var GRADE_TOKENS = ["예비고1", "예비고2", "예비고3", "고3", "고2", "고1", "중3", "중2", "중1"];
function gradeTokenOf(nm) {
  for (var i = 0; i < GRADE_TOKENS.length; i++) if (String(nm).indexOf(GRADE_TOKENS[i]) >= 0) return GRADE_TOKENS[i];
  return "";
}
// ⚠ 사람을 가리키는 말만 넣는다. 맨 «예비고1» 은 학생 이야기에도 나오므로 넣지 않는다
//   ("예비고1 D등급 명단" 은 선생님 일이 아니다).
var ROLE_WORDS = ["담당 강사", "담당 선생님", "담당 교사", "담당", "강사", "선생님", "담임"];
function personGroups(name, note) {
  var out = ["전원"];
  var t = S.teachers.filter(function (x) { return x.name === name; })[0];
  if (t) {
    out.push("고등부");
    var cls = (t.classIds || []).map(function (id) { return className(id); });
    if (cls.length) { out.push("담임 전원"); out.push("담임"); }
    var toks = {};
    cls.forEach(function (n) { var g = gradeTokenOf(n); if (g) toks[g] = 1; });
    Object.keys(toks).forEach(function (g) {
      ROLE_WORDS.forEach(function (w) { out.push(g + " " + w); });
    });
  }
  // «간부» 는 그 회의에 앉은 사람들이다. 회의마다 다르므로 참석 줄로 본다.
  if (note && /간부/.test(String(note.kind || "")) && String(note.attend || "").indexOf(name) >= 0) out.push("간부");
  return out;
}

// 지금 칠하는 사람. 표를 그리는 동안에는 HI_TASK 가 켜져 «맡은 일» 로 칠해진다.
var HI = null, HI_TASK = false, HI_SEC = "";
function hiTerms() {
  if (!HI) return [];
  var out = [HI.name].concat(HI.groups || []).filter(Boolean);
  // 긴 것부터 — «예비고1 담당 강사» 를 «예비고1 담당» 으로 잘라 먹으면 안 된다
  return out.sort(function (a, b) { return b.length - a.length; });
}
// ⚠ 앞 글자가 한글·숫자·영문이면 딴 낱말의 꼬리다. «예비고1 담당» 안의 «고1 담당» 을 잡으면 안 된다.
function findTerm(text, term, from) {
  var at = text.indexOf(term, from || 0);
  while (at > 0 && /[0-9A-Za-z가-힣]/.test(text.charAt(at - 1))) at = text.indexOf(term, at + 1);
  return at;
}
// ⚠ 태그 안은 건드리지 않는다. 통째로 바꾸면 href·class 속으로도 들어가 화면이 깨진다.
function markName(html) {
  var terms = hiTerms();
  if (!terms.length) return html;
  var cls = HI_TASK ? "task" : "hit";
  return html.split(/(<[^>]*>)/).map(function (part, i) {
    if (i % 2) return part;
    var out = "", rest = part;
    while (rest) {
      var best = -1, bestT = "";
      for (var k = 0; k < terms.length; k++) {
        var at = findTerm(rest, terms[k]);
        if (at < 0) continue;
        if (best < 0 || at < best || (at === best && terms[k].length > bestT.length)) { best = at; bestT = terms[k]; }
      }
      if (best < 0) { out += rest; break; }
      var grp = bestT !== HI.name;
      out += rest.slice(0, best) +
        '<mark class="' + cls + (grp ? " g" : "") + '"' + (grp ? ' title="' + esc(HI.name) + " — " + esc(bestT) + '"' : "") +
        '>' + bestT + '</mark>';
      rest = rest.slice(best + bestT.length);
    }
    return out;
  }).join("");
}
// 이 표가 «누가 무엇을 맡았는가» 를 적는 표인가.
//  (1) 머리에 담당·누구·담당자 칸이 있거나
//  (2) 바로 위 제목이 «할 일»·«지시» 면 그 표는 통째로 임무다
// 이름만 칠하면 **그 줄이 무슨 이야기인지**가 안 보인다. 이름이 든 덩어리를 통째로 칠한다.
// 붉은 것이 하나라도 있으면 그 덩어리는 임무다 — 초록보다 세다.
function hiClass(html) {
  if (!HI) return "";
  // ⚠ 닫는 따옴표까지 보면 안 된다. 소속으로 걸린 것은 class="task g" 라 안 잡힌다.
  if (html.indexOf('<mark class="task') >= 0) return " hl-task";
  if (html.indexOf('<mark class="hit') >= 0) return " hl-hit";
  return "";
}
function hiAttr(html) { var c = hiClass(html); return c ? ' class="' + c.trim() + '"' : ""; }

function taskTable(head) {
  if (/할 일|지시/.test(HI_SEC)) return { all: true, cols: [] };
  var cols = [];
  head.forEach(function (c, i) { if (/^(담당|담당자|누구)$/.test(String(c).trim())) cols.push(i); });
  return { all: false, cols: cols };
}

function mdInline(t) {
  return esc(t)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/~~([^~]+)~~/g, "<del>$1</del>")
    .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g, "$2")      // [[대상|보일 글자]]
    .replace(/\[\[([^\]]+)\]\]/g, "$1")                  // 볼트 링크는 여기서 갈 곳이 없다
    .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
}
function mdInlineHi(t) { return markName(mdInline(t)); }
var CALLOUT = { note: ["알림", "blue"], warning: ["주의", "yellow"], important: ["중요", "yellow"],
                tip: ["도움말", "green"], quote: ["", ""] };
function mdToHtml(md) {
  var lines = String(md || "").split(/\r?\n/), out = [], i = 0;
  var para = [];
  var flush = function () {
    if (!para.length) return;
    var inner = mdInlineHi(para.join(" "));
    out.push("<p" + hiAttr(inner) + ">" + inner + "</p>");
    para = [];
  };
  while (i < lines.length) {
    var L = lines[i];
    // 코드 덩어리
    if (/^```/.test(L)) {
      flush(); i++;
      var buf = [];
      while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push("<pre>" + esc(buf.join("\n")) + "</pre>");
      continue;
    }
    // 표 — 다음 줄이 구분선이어야 표다
    if (/^\s*\|/.test(L) && i + 1 < lines.length && /^\s*\|[\s:\-|]+\|\s*$/.test(lines[i + 1])) {
      flush();
      var cells = function (x) { return x.trim().replace(/^\||\|$/g, "").split("|").map(function (c) { return c.trim(); }); };
      var head = cells(L);
      i += 2;
      var body = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) body.push(cells(lines[i++]));
      var tt = taskTable(head);
      out.push('<div class="tbl" style="max-height:none"><table><thead><tr>' +
        head.map(function (c) { return "<th>" + mdInline(c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
        body.map(function (r) {
          var cells = r.map(function (c, ci) {
            HI_TASK = tt.all || tt.cols.indexOf(ci) >= 0;
            var cell = '<td class="wrapc">' + mdInlineHi(c) + "</td>";
            HI_TASK = false;
            return cell;
          }).join("");
          // 담당 칸에만 이름이 있어도 **그 줄 전체**가 그 사람 일이다
          return "<tr" + hiAttr(cells) + ">" + cells + "</tr>";
        }).join("") + "</tbody></table></div>");
      continue;
    }
    // 인용 · 콜아웃
    if (/^\s*>/.test(L)) {
      flush();
      var q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ""));
      var kind = "quote", title = "";
      var m0 = /^\[!(\w+)\]\s*(.*)$/.exec(q[0] || "");
      if (m0) { kind = m0[1].toLowerCase(); title = m0[2] || (CALLOUT[kind] ? CALLOUT[kind][0] : ""); q.shift(); }
      var cls = (CALLOUT[kind] || CALLOUT.quote)[1];
      var qin = (title ? "<b>" + mdInlineHi(title) + "</b>" : "") + mdToHtml(q.join("\n"));
      out.push('<blockquote class="' + cls + hiClass(qin) + '">' + qin + "</blockquote>");
      continue;
    }
    // 제목
    var h = /^(#{1,6})\s+(.*)$/.exec(L);
    if (h) { flush(); HI_SEC = h[2]; var lv = Math.min(h[1].length + 1, 6); out.push("<h" + lv + ">" + mdInlineHi(h[2]) + "</h" + lv + ">"); i++; continue; }
    // 목록
    if (/^\s*([-*]|\d+\.)\s+/.test(L)) {
      flush();
      var ord = /^\s*\d+\./.test(L), items = [];
      while (i < lines.length && /^\s*([-*]|\d+\.)\s+/.test(lines[i])) {
        var it = lines[i++].replace(/^\s*([-*]|\d+\.)\s+/, "");
        // 이어지는 줄(들여쓴 것)은 같은 항목이다
        while (i < lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*]|\d+\.)\s+/.test(lines[i])) it += " " + lines[i++].trim();
        items.push(it);
      }
      // 목록도 «할 일»·«지시» 절 아래면 임무로 본다 — 담당이 표가 아니라 줄로 적히기도 한다.
      HI_TASK = /할 일|지시/.test(HI_SEC);
      out.push("<" + (ord ? "ol" : "ul") + ">" + items.map(function (x) {
        var inner = mdInlineHi(x);
        return "<li" + hiAttr(inner) + ">" + inner + "</li>";
      }).join("") + "</" + (ord ? "ol" : "ul") + ">");
      HI_TASK = false;
      continue;
    }
    if (/^\s*---+\s*$/.test(L)) { flush(); out.push("<hr>"); i++; continue; }
    if (!L.trim()) { flush(); i++; continue; }
    para.push(L.trim()); i++;
  }
  flush();
  return out.join("");
}

    var b = days.indexOf(r.e > to ? to : r.e);

    var seg = { a: a, b: b, kind: r.kind, text: r.text, full: r.full || r.text, n: r.n || 1,
                color: r.color || "", id: r.id || "", task: !!r.task, refs: r.refs || [], head: r.s >= from, tail: r.e <= to };
    var i = 0;
    while (lanes[i] && lanes[i].some(function (x) { return !(seg.b < x.a || seg.a > x.b); })) i++;
    lanes[i] = lanes[i] || [];

  { k: "green",  n: "초록", fg: "#1f6b3a", bg: "#cdeed7" },
  { k: "blue",   n: "파랑", fg: "#1d4f9c", bg: "#cfe2ff" },
  { k: "purple", n: "보라", fg: "#6b21a8", bg: "#ece2fb" },

function evSpan(e) { return evEnd(e) > e.from; }        // 이틀 이상이면 막대로 눕는다
// 일정은 **모두의 것**이라 담당으로 안 가른다. 학년 탭만 탄다.
function evHit(e, want) { return gradeHit(e.grade || "공통", want); }

    // ⚠ 다만 «안 쉼» 으로 고친 것(over && !off)은 **보통 일정으로 뜬다.** 연휴에 특강을 연다고

//
// 팀으로 쓰는 데 없던 것은 **끝냈다고 표시할 자리**였다. 회의록에서 자기 임무를 찾는 것까지는 됐는데
// 그 다음이 없었다. 그렇다고 선생님에게 공용 목록(dash/tasks)을 열어 주면 남의 줄까지 고칠 수 있다.

// 그래서 둘로 나눈다.

function pushRowWire() {

      }).join("") + (list.length > 8 ? '<div class="bi muted" data-bell="1">외 ' + (list.length - 8) + '건</div>' : "")

// ---- 지켜보기 ----
// 여기까지는 «다시 열 때» 만 알렸다. 그러면 팀장이 할 일을 넣어도 선생님 화면은 그대로다 —
// 알림이라 부를 수 없다. 그래서 할 일 문서를 **지켜본다**(onSnapshot).
//
// ⚠ 내 쓰기에도 곧바로 한 번 돈다(Firestore 가 서버 답을 기다리지 않고 먼저 알려준다).
//   그래서 «내가 만든 줄»을 `MY_NEW` 로 빼 두는 것이 여기서도 필요하다.
// ⚠ 처음 붙을 때도 한 번 돈다. 그때는 이미 loadCore 가 읽어둔 것과 같으므로 그냥 다시 셈하면 된다.
// ⚠ `S.tasks` 는 세 곳을 합친 것이다(공개분·팀장분·각자분). 한 곳만 갈아 끼우고 다시 합친다.
var WATCH = [];
function stopWatch() { WATCH.forEach(function (f) { try { f(); } catch (e) {} }); WATCH = []; }
// ⚠ [[입력 중에 다시 그리면 한 글자만 쳐진다]] — 지켜보기가 남의 보고를 받아 다시 그리면
//   내가 치던 글이 통째로 날아간다. 적는 중이면 미뤄 두고, 손을 뗄 때(blur) 그린다.
var TASKS_STALE = false;
function typingInTasks() {
  var a = typeof document !== "undefined" ? document.activeElement : null;
  var root = $("#sec-tasks");
  if (!a || !root || typeof root.contains !== "function") return false;
  var tag = String(a.tagName || "").toLowerCase();
  return (tag === "input" || tag === "textarea") && root.contains(a);
}
function renderTasksSafe() {
  if (typingInTasks()) { TASKS_STALE = true; return; }
  TASKS_STALE = false;
  renderTasks();
}
function rebuildTasks(part, items) {
  if (part === "open") S.tasksOpen = items;
  if (part === "lead") S.tasksLead = items;
  if (part === "own") S.own = items;
  S.tasks = (S.tasksOpen || []).concat(S.tasksLead || []).concat(ownTasks());
  initNewTasks();
  // ⚠ 그릴 자리가 없을 수 있다 — 로그아웃하는 사이에 스냅샷이 한 번 더 오면 화면은 이미 로그인 칸이다.
  //   renderTasks 는 el 이 없으면 그 자리에서 터진다(다른 render 와 달리 막는 줄이 없다).
  if (!$("#sec-tasks")) return;
  renderBell();
  renderTasksSafe();
  renderDone();
  renderExec();
  renderCal();
  renderWeek();
}
function watchTasks() {
  if (!S.teamOk || typeof tdb.collection("dash").doc("tasks").onSnapshot !== "function") return;
  stopWatch();
  var on = function (ref, fn) {
    try { WATCH.push(ref.onSnapshot(fn, function () {})); } catch (e) {}
  };
  on(tdb.collection("dash").doc("tasks"), function (d) {
    rebuildTasks("open", d.exists ? (d.data().items || []) : []);
  });
  // 팀장 전용 문서는 선생님이 못 읽는다. 붙이면 규칙 오류만 난다.
  if (!S.ro) on(tdb.collection("dash").doc("tasksLead"), function (d) {
    rebuildTasks("lead", d.exists ? (d.data().items || []) : []);
  });
  on(tdb.collection("dash").doc("calEvents"), function (d) {
    S.events = d.exists ? (d.data().items || []) : [];
    if ($("#sec-cal")) renderCal();
    if ($("#sec-plan")) renderPlan();     // 쉬는 날을 같이 쓴다
  });
  // 월간계획. 고치는 중(폼이 열림)이면 다시 그리지 않는다 — 치던 칸이 날아간다.
  on(tdb.collection("dash").doc("monthPlan"), function (d) {
    S.plan = d.exists ? d.data() : { months: {} };
    if ($("#sec-plan") && !S.plEdit) renderPlan();
  });
  on(tdb.collection("myTasks"), function (s2) {
    var m = {}; s2.forEach(function (d) { m[d.id] = d.data() || {}; });
    rebuildTasks("own", m);
  });
  // 누가 «내 완료» 를 눌렀나. 안 지켜보면 **완료 현황이 로그인한 순간 그대로 멈춘다** —
  // 강사가 지금 표시해도 팀장 화면은 새로고침 전까지 «안 했다» 로 보인다. 할 일의 2/3 도 같다.
  // ⚠ 종과 달리 여기서는 **내가 누른 것도 센다.** 이건 «새로 온 것» 이 아니라 «누가 무엇을 끝냈나» 다.
  on(tdb.collection("marks"), function (s2) {
    var m = {}; s2.forEach(function (d) { m[d.id] = d.data() || {}; });
    S.marks = m;
    if (!$("#sec-tasks")) return;      // 로그아웃 중 스냅샷 방어
    renderTasksSafe(); renderDone(); renderExec();
  });
}

// 내가 눌러야 하는 줄이면 단추, 여럿이 걸린 줄이면 «몇 명 했나»
function myMarkBtn(t) {

// ---- 보고받는 일 (2026-09-08) ----
//
// 어떤 일은 «했다» 만으로는 부족하다 — **무엇을 했는지 한 줄**이 있어야 팀장이 다음을 정한다.
// 할 일에 `report: true` 를 달면 그 줄의 «내 완료» 자리가 **적는 칸**으로 바뀌고,
// 적어서 넣으면 그것이 곧 완료다(완료 현황에 글까지 같이 뜬다).
//
// ⚠ 저장은 `marks/<tid>.reports[할일id]` — **새 컬렉션을 만들지 않는다.** 만들면 규칙을
//   콘솔에 다시 붙여넣어야 하는데 marks 는 이미 «자기 문서만 쓴다» 로 열려 있다.
//   종의 seenTasks 와 같은 이유다.
// ⚠ set() 은 문서를 통째로 갈아친다. done·seenTasks 를 얹지 않으면 **보고 한 번에 그것들이 날아간다.**
function reportOf(t, tid) {

// ---------- 회의록에서 할 일 끌어오기 (2026-09-07) ----------
//
// 회의록마다 «## 할 일» 표가 있다 (할 일 | 담당 | 기한). 그것을 그대로 읽어
// **아직 안 들어온 것**을 찾아 준다.
//
// ⚠ 찾아만 주고 **넣는 것은 팀장이 누른다.** 회의록의 할 일은 그대로 옮기면 안 되는 것이 섞인다 —
//   데스크 회의록의 «전부 데스크 몫이라 할 일 추적에는 안 넣는다» 같은 것이 그렇고,
//   이미 볼트에서 손질해 들어온 것도 글자가 조금 달라 겹쳐 들어온다.
//   자동으로 밀어 넣으면 목록이 쓰레기가 되고, 그러면 아무도 안 본다.
// ⚠ 선생님은 할 일을 못 쓴다. 이 기능은 통째로 팀장 것이다.
function mdSection(md, name) {
  var lines = String(md || "").split(/\r?\n/), out = [], on = false;
  for (var i = 0; i < lines.length; i++) {
    var h = /^(#{1,6})\s+(.*)$/.exec(lines[i]);
    if (h) { on = h[2].trim().indexOf(name) === 0; continue; }
    if (on) out.push(lines[i]);
  }
  return out.join("\n");
}
// 회의록 표는 «할 일 | 담당 | 기한» 세 칸이다 (볼트 「할 일 추적」과 달리 출처·상태가 없다).
function parseMinuteTable(md) {
  var rows = [];
  md.split(/\r?\n/).forEach(function (line) {
    if (!/^\s*\|/.test(line)) return;
    var cells = line.split("|").slice(1, -1).map(function (c) { return c.replace(/\[\[|\]\]|\*\*|~~/g, "").trim(); });
    if (cells.length < 2) return;
    if (/^-+$/.test(cells[0]) || cells[0] === "할 일") return;
    if (!cells[0]) return;
    rows.push({ text: cells[0], who: cells[1] || "", dueText: cells[2] || "" });
  });
  return rows;
}
function minuteTasks(m) {
  return parseMinuteTable(mdSection(m.md || "", "할 일")).map(function (r) {
    return { text: r.text, who: r.who, dueText: r.dueText, due: parseDueText(r.dueText),
             src: m.title || m.id, from: m.id };
  });
}
function taskSkipped() { return (S.config && S.config.taskSkip) || []; }
// 아직 안 들어온 것. 이미 있는 할 일과 «안 넣기로 한 것»은 뺀다.
function newFromMinutes() {
  if (S.ro || !S.minutes) return [];
  var have = {}, skip = {};
  S.tasks.forEach(function (t) { have[t.text] = 1; });
  taskSkipped().forEach(function (k) { skip[k] = 1; });
  var out = [], seen = {};
  S.minutes.forEach(function (m) {
    minuteTasks(m).forEach(function (r) {
      var key = r.from + "|" + r.text;
      if (have[r.text] || skip[key] || seen[key]) return;
      seen[key] = 1; out.push(r);
    });
  });
  return out;
}
// ⚠ 여기서 들어오는 것은 **전부 초안**이다. 선생님에게는 팀장이 «보내기» 를 눌러야 간다.
async function addFromMinutes(rows) {

    S.tasks.push({ id: newTaskId(), text: r.text, who: r.who, due: r.due, dueText: r.dueText,

}
// 초안을 공개분으로 내린다. 담당에 강사가 없으면 내려도 팀장 목록에 그대로 남는다(그게 맞다).
async function publishDrafts(ids) {
  var set = {}; ids.forEach(function (id) { set[id] = 1; });
  var sent = [];
  S.tasks.forEach(function (t) { if (set[t.id]) { delete t.draft; sent.push(t); } });
  await saveTasks();
  pushNewTasks(sent);   // 여기가 선생님 화면에 처음 뜨는 순간이다 — 알릴 곳도 여기다
}

// «안 넣기»는 기억해 둔다. 안 그러면 누를 때마다 도로 올라와서 결국 안내를 무시하게 된다.

// 볼트 「할 일 추적」 표 → 항목. 셀 순서는 할 일 | 담당 | 기한 | 출처 | 상태 (완료 표는 마지막이 완료일).
function importMarkdown(md) {
  var n = 0, have = {};
  S.tasks.forEach(function (t) { have[t.text] = 1; });
  md.split(/\r?\n/).forEach(function (line) {
    if (!/^\s*\|/.test(line)) return;
    var cells = line.split("|").slice(1, -1).map(function (c) { return c.replace(/\[\[|\]\]|\*\*/g, "").trim(); });
    if (cells.length < 3) return;
    if (/^-+$/.test(cells[0]) || cells[0] === "할 일") return;
    var text = cells[0]; if (!text || have[text]) return;
    var st = cells[4] || "";
    var status = /완료|^\d{4}-/.test(st) ? "done" : /진행/.test(st) ? "doing" : /보류/.test(st) ? "hold" : "open";
    // 붙여넣기도 한 번에 여러 줄이 들어온다 — 회의록에서 끌어온 것과 같이 **초안**으로 받는다.
    S.tasks.push({ id: newTaskId(), text: text, who: cells[1] || "", due: parseDueText(cells[2] || ""), dueText: cells[2] || "",
      src: cells[3] || "", status: status, created: TODAY, draft: true,
      done: status === "done" ? (/^\d{4}-/.test(st) ? st.slice(0, 10) : TODAY) : "" });
    have[text] = 1; n++;
  });
  return n;
}
// "9/4 (목)" · "~9/11" · "9/4~5" 같은 글을 날짜로. 못 읽으면 글자를 그대로 둔다.
function parseDueText(s) {
  var m = /(\d{1,2})\s*\/\s*(\d{1,2})/.exec(s);
  if (!m) return s;
  var y = new Date().getFullYear(); var mo = +m[1], d = +m[2];
  // 12월에 1월 기한이면 다음 해
  if (mo < new Date().getMonth() + 1 - 6) y += 1;
  return y + "-" + pad2(mo) + "-" + pad2(d);
}

// ---------- 이번 주 ----------
// 그 학교·학년에 다니는 우리 학생. 어느 반인지도 같이 — "누가 언제 안 오나"가 이 화면의 물음이다.
function studentsAt(school, grade) {
  var inCls = {};
  activeClasses().forEach(function (c) {
    rosterStudents(c).forEach(function (r) { if (r.pid) (inCls[r.pid] = inCls[r.pid] || []).push(c.name); });
  });
  return S.students.filter(function (x) { return x.school === school && x.grade === grade; })
    .map(function (x) { return { name: x.name, cls: (inCls[x.pid] || []).join(", ") }; })

// ---------- 학생 명단 ----------
// 학년별 색. 배치표의 이름과 표의 줄이 같은 색을 쓴다.
var GRADE_CLS = { "중3": "g0", "고1": "g1", "고2": "g2", "고3": "g3" };
var GRADE_NUM = { "중3": 9, "고1": 10, "고2": 11, "고3": 12 };
function gradeCls(g) { return GRADE_CLS[g] || "g9"; }
// 반 명단(roster)에 학교·학년이 미러돼 있다. 없으면 사람(students)에서 찾는다.
function personOf(r) { return r.pid ? (S.byPid[r.pid] || null) : null; }
function gradeOf(r) { var p = personOf(r); return r.grade || (p && p.grade) || ""; }
function schoolOf(r) { var p = personOf(r); return r.school || (p && p.school) || ""; }

function renderStudents() {
  var el = $("#sec-students");
  var st = S.students;
  S.byPid = {}; st.forEach(function (x) { S.byPid[x.pid] = x; });
  var byGrade = {}; GRADES.forEach(function (g) { byGrade[g] = 0; }); var noGrade = 0;
  st.forEach(function (x) { if (byGrade[x.grade] !== undefined) byGrade[x.grade]++; else noGrade++; });
  var assigned = {};
  activeClasses().forEach(function (c) { rosterStudents(c).forEach(function (r) { if (r.pid) (assigned[r.pid] = assigned[r.pid] || []).push(c.name); }); });
  var unassigned = st.filter(function (x) { return !assigned[x.pid]; });

    '</h2>' +
    '<div class="chips">' + chip("", "전체", st.length) +

    chip("none", "학년 없음", noGrade) +
    '<input type="text" id="st-q" class="mini" placeholder="이름·학교·담임 찾기" value="' + esc(S.stQuery || "") + '" style="min-width:170px">' +
    (unassigned.length ? '<button class="mini warn" data-gf="un">반 미배정 ' + unassigned.length + '</button>' : "") + '</div>' +

  // 찾기 칸은 아래만 다시 그린다 — 상자를 통째로 그리면 입력 포커스가 날아간다
  $("#st-q").oninput = function () {

function afterStudentBody(el, assigned) {
  if ((S.stView || "grid") === "edit") {

      var tr = $('#st-rows tr[data-pid="' + S.stJump + '"]', el);

// 고른 학년·찾는 글자에 걸리는가. 배치표에서는 지우지 않고 **흐리게** 한다 —
// 누가 어느 반에 흩어져 있는지가 배치표의 쓸모라 자리를 비우면 안 된다.
function stHit(name, grade, school, teacher, cls) {
  var f = S.stFilter || "", q = (S.stQuery || "").trim();
  if (f === "none") { if (grade && GRADES.indexOf(grade) >= 0) return false; }
  else if (f === "un") { if (cls !== "") return false; }
  else if (f && grade !== f) return false;
  if (q && [name, grade, school, teacher, cls].join(" ").indexOf(q) < 0) return false;
  return true;
}
function studentBodyHtml(view, assigned) {
  return view === "edit" ? studentEditHtml(assigned) : classGridHtml();
}

// ---- 반별 배치표 — 열 하나가 반, 아래로 학생. 고1 줄 · 예비고1 줄로 나눠 그린다 (2026-09-08) ----
//
// 마왕님 말씀 — "학생명단메뉴에 예비고1이랑 고1이랑 한줄에 있는데 위에 고1, 아래 예비고1로 정리하자".
// 반 문서에 학년 칸이 없어서 **반 이름으로 가른다** — normClassKey 로 빈칸·호수를 뗀 뒤 앞글자.
// «예비고1S» 는 «고1» 로 시작하지 않으니 /^고1/ 에 안 걸린다. 어디에도 안 걸리는 반은 «그 밖» 줄.
// 줄이 하나뿐이면 머리를 안 단다 — 반이 다 고1 이면 «고1» 이라고 굳이 쓸 것 없다.
var GRID_GROUPS = [["고3", /^고3/, "고3"], ["고2", /^고2/, "고2"], ["고1", /^고1/, "고1"], ["예비고1", /^예비고1/, "중3"]];
function classGroup(c) {
  var k = normClassKey(c.name);
  for (var i = 0; i < GRID_GROUPS.length; i++) if (GRID_GROUPS[i][1].test(k)) return GRID_GROUPS[i][0];
  return "";
}
function classGridHtml() {
  var me = S.claims ? teacherName(S.claims.tid) : "";
  var cols = activeClasses().map(function (c) {
    var ts = classTeachers(c.id);
    return { c: c, studs: rosterStudents(c), t: ts.length ? ts.join("·") : "", mine: ts.indexOf(me) >= 0 };
  });
  if (!cols.length) return '<div class="empty">반이 없다.</div>';
  // 어느 반에도 없는 학생은 맨 아래 한 열로 모은다. 안 그러면 배치표에서 통째로 사라진다.
  var loose = S.students.filter(function (x) { return !assignedNames(x, cols); });
  var byG = {}, groups = [];
  cols.forEach(function (x) { var g = classGroup(x.c); (byG[g] = byG[g] || []).push(x); });
  GRID_GROUPS.forEach(function (p) { if (byG[p[0]]) groups.push({ name: p[0], grade: p[2], cols: byG[p[0]] }); });
  if (byG[""]) groups.push({ name: "그 밖", grade: "", cols: byG[""] });
  if (loose.length) groups.push({ name: "반 미배정", grade: "", cols: [{ c: { id: "_loose", name: "반 미배정", classDays: [] }, studs: loose.map(looseRow), t: "", mine: false, loose: true }] });
  var one = groups.length === 1;
  return groups.map(function (g) {
    var n = g.cols.reduce(function (m, x) { return m + x.studs.length; }, 0);
    var head = one ? "" : '<h3 class="gh">' +
      (g.grade ? '<span class="pill ' + gradeCls(g.grade) + '">' + esc(g.name) + '</span>' : '<span class="pill' + (g.name === "반 미배정" ? " red" : "") + '">' + esc(g.name) + '</span>') +
      '<span class="muted">' + (g.name === "반 미배정" ? "" : g.cols.length + "반 · ") + n + '명</span></h3>';
    return head + classGridTable(g.cols);
  }).join("") +
    '<p class="muted" style="font-size:12px;margin:6px 0 0">이름 옆 숫자는 학년(중3=9 · 고1=10 · 고2=11 · 고3=12). ' +
    '인원이 <span class="orange">주황</span>이면 5명 이하, <span class="red">빨강</span>이면 0명이다. 파란 머리는 내가 담당인 반.</p>';
}
function classGridTable(cols) {
  var maxN = cols.reduce(function (m, x) { return Math.max(m, x.studs.length); }, 0);
  var head = cols.map(function (x) {
    var n = x.studs.length;
    var cnt = x.loose ? '<span class="cnt red">' + n + '</span>' : '<span class="cnt ' + (n === 0 ? "red" : n <= 5 ? "orange" : "") + '">' + n + '</span>';
    var days = x.loose ? "" : (x.c.type === "individual" ? "개진" : (x.c.classDays || []).join(""));
    return '<th class="' + (x.mine ? "mine" : "") + '"><div class="cn">' + esc(x.c.name) + '</div>' +
      '<div class="cm">' + (x.t ? esc(x.t) : '<span class="red">담당 없음</span>') + (days ? ' · ' + esc(days) : "") + '</div>' +
      '<div class="cm">' + cnt + '명</div></th>';
  }).join("");

  var body = "";
  for (var i = 0; i < maxN; i++) {
    body += '<tr><th class="rn">' + (i + 1) + '</th>' + cols.map(function (x) {
      var r = x.studs[i];
      if (!r) return '<td></td>';
      var g = gradeOf(r), sch = schoolOf(r);
      var hit = stHit(r.name, g, sch, x.t, x.loose ? "" : x.c.name);
      var ghost = !!(r.pid && !S.byPid[r.pid]);   // 사람이 지워졌는데 반에 남은 것
      return '<td class="' + (hit ? "" : "dim") + '" title="' +
        esc(ghost ? r.name + " — 사람 정보가 지워졌다. 명단 편집에서 반 명단에서 빼면 된다"
                  : [r.name, g, sch, x.t ? "담당 " + x.t : ""].filter(Boolean).join(" · ") + " — 눌러서 고치기") + '">' +
        '<span class="nm ' + (ghost ? "ghost" : gradeCls(g)) + '"' + (r.pid && !ghost ? ' data-open="' + esc(r.pid) + '"' : "") + '>' +
        esc(r.name) + (ghost ? "" : (GRADE_NUM[g] ? '<i>' + GRADE_NUM[g] + '</i>' : "")) + '</span>' +
        (ghost || !sch ? "" : '<span class="sch">' + esc(sch) + '</span>') + '</td>';
    }).join("") + '</tr>';
  }
  return '<div class="gridwrap"><table class="cgrid"><thead><tr><th class="rn">#</th>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
}
function assignedNames(person, cols) {

    '<details><summary>여러 명 한꺼번에 만들기 — 엑셀에서 붙여넣기</summary>' +
    '<textarea id="st-bulk" rows="6" style="width:100%" placeholder="한 줄에 한 명. 이름 학년 학교\n김서진 고1 중대부고\n설민준\t중3\t봉은중"></textarea>' +
    '<div class="row"><span class="muted">만들면서 반에 넣기</span><select id="st-bulk-cls"><option value="">넣지 않음</option>' +
    activeClasses().map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.name) + '</option>'; }).join("") + '</select>' +
    '<button class="btn o" id="st-bulk-go">만들기</button><span class="muted" id="st-bulk-msg"></span></div>' +
    '<p class="muted" style="font-size:12px">학년은 <b>중3·고1·고2·고3</b> 또는 <b>9·10·11·12</b>. 이미 있는 이름은 건너뛴다.</p></details>' +
    '<details><summary>담임별로 세기</summary>' + homeroomTableHtml(S.students) + '</details>' +
    stLogHtml() +
    '<datalist id="st-schools">' + schoolOpts().map(function (x) { return '<option value="' + esc(x) + '">'; }).join("") + '</datalist>';
}
// 앱에서 고친 것도 여기 같이 뜬다. 그래야 «앱에서 누가 뭘 바꿨는지» 를
// 대시보드만 봐도 알 수 있다 — 그것이 근거지라는 말의 실제 내용이다.
function stLogAgo(t) {
  var m = Math.floor((Date.now() - t) / 60000);
  if (m < 1) return "방금";
  if (m < 60) return m + "분 전";
  if (m < 60 * 24) return Math.floor(m / 60) + "시간 전";
  var d = new Date(t);
  return (d.getMonth() + 1) + "/" + d.getDate();
}
function stLogHtml() {
  var items = (S.stLog || []).slice().reverse();
  if (!items.length) return "";
  var fromApp = items.filter(function (x) { return x.from === "앱"; }).length;
  return '<details><summary>최근 바뀐 것 ' + items.length + '건' +
      (fromApp ? ' <span class="muted">(앱에서 ' + fromApp + '건)</span>' : "") + '</summary>' +
    '<p class="muted" style="font-size:12px;margin:6px 0">앱에서 고친 것도 여기 함께 쌓인다. ' +
      '최근 ' + STUDENT_LOG_KEEP + '건까지 남는다.</p>' +
    '<div class="tbl"><table class="sheet-t"><thead><tr>' +
    '<th style="width:70px">언제</th><th style="width:110px">학생</th><th style="width:90px">무엇</th>' +
    '<th>자세히</th><th style="width:150px">누가 · 어디서</th></tr></thead><tbody>' +
    items.slice(0, 80).map(function (x) {
      return '<tr><td class="muted">' + esc(stLogAgo(x.t)) + '</td>' +
        '<td><b>' + esc(x.name || "(이름 없음)") + '</b></td>' +
        '<td>' + esc(x.act || "") + '</td>' +
        '<td class="muted">' + esc(x.detail || "") + '</td>' +
        '<td class="muted">' + esc(x.by || "?") + ' · ' +
          '<span style="color:' + (x.from === "앱" ? "#8a7f72" : "#2b5f8a") + '">' + esc(x.from || "") + '</span></td></tr>';
    }).join("") + '</tbody></table></div></details>';
}

// 화면을 통째로 다시 그리면 표의 스크롤 상자가 새로 만들어져 **맨 위로 돌아간다.**
// 창 스크롤도 짧아진 순간 잘린다. 자리를 재놓았다가 되돌린다.
function keepScroll(fn) {
  var box = $("#sec-students .tbl"), top = box ? box.scrollTop : 0;
  var wy = window.scrollY || window.pageYOffset || 0;

// 반 배정이 바뀌면 그 줄의 반 칸과 메뉴 숫자만 고친다 (다시 그리지 않는다)
function refreshClsCell(el, pid) {

    var cls = classesOfPid(pid);

function studentBadge() {
  var has = {};
  activeClasses().forEach(function (c) { rosterStudents(c).forEach(function (r) { if (r.pid) has[r.pid] = 1; }); });
  var n = 0;

function bindClsRow(el, assigned) {

      b.disabled = true;

        b.classList.toggle("on", !on);

      } catch (e) { alert("바꾸지 못했다: " + e.message); }

function bindEdit(el, assigned) {
  var flash = function (node) { node.classList.add("ok"); setTimeout(function () { node.classList.remove("ok"); }, 900); };
  var fail = function (node, e) { node.classList.add("bad"); alert("저장하지 못했다: " + ((e && e.message) || e)); };
  // 값 고치기 — **다시 그리지 않는다.** 표를 다시 그리면 치던 칸에서 포커스가 날아간다.
  $$("#st-rows [data-f]", el).forEach(function (inp) {
    inp.onchange = async function () {
      var pid = inp.closest("tr").getAttribute("data-pid"), f = inp.getAttribute("data-f"), v = inp.value.trim();

    };
  });
  // 반 고르는 줄은 **끼워 넣고 빼기만** 한다. 다시 그리면 그 자리에서 스크롤이 튄다.
  $$("#st-rows .cls-btn", el).forEach(function (b) {
    b.onclick = function () {
      var tr = b.closest("tr"), pid = tr.getAttribute("data-pid");

      $$("#st-rows tr.clsrow", el).forEach(function (n) { n.parentNode.removeChild(n); });

      if (!wasOpen) { tr.insertAdjacentHTML("afterend", clsRowHtml(pid)); bindClsRow(el, assigned); }

  bindClsRow(el, assigned);
  // «비번 까먹었어요» 를 받아주는 자리. 앱의 학생 명단에 있는 것과 같은 일을 한다.
  $$("#st-rows .pin", el).forEach(function (b) {
    b.onclick = async function () {
      var pid = b.closest("tr").getAttribute("data-pid"), person = S.byPid[pid];

      if (!confirm(person.name + " 학생의 PIN을 초기화할까?\n\n" +
        "지금 쓰던 비번이 사라지고 초기 PIN으로 돌아간다.\n" +
        "그 학생은 다음에 들어올 때 새 PIN을 스스로 정한다.")) return;
      b.disabled = true; b.textContent = "…";
      try {
        var r = await stResetPin(person.name);
        alert(person.name + " PIN을 초기화했다.\n\n초기 PIN은 " + r.pin + " 이다. 학생에게 알려준다." +
          (r.noClass ? "\n(아직 반이 없는 학생이다)" : "") +
          (r.classes && r.classes.length ? "\n반: " + r.classes.join(", ") : ""));
      } catch (e) { alert("초기화하지 못했다: " + e.message); }
      b.disabled = false; b.textContent = "PIN";
    };
  });
  $$("#st-rows .del", el).forEach(function (b) {
    b.onclick = async function () {
      var pid = b.closest("tr").getAttribute("data-pid"), person = S.byPid[pid];
      var inCls = classesOfPid(pid);
      if (!confirm("「" + person.name + "」를 명단에서 지운다.\n\n" +
        (inCls.length ? "반 " + inCls.map(function (c) { return c.name; }).join(", ") + " 에서도 빠진다.\n" +
          "지난 출결·과제 기록은 지워지지 않지만 화면에서는 안 보이게 된다.\n" : "") +
        "되돌리려면 다시 만들어 반에 넣어야 한다.")) return;
      try { await stDelete(pid); keepScroll(renderStudents); } catch (e) { alert("지우지 못했다: " + e.message); }
    };
  });
  var nw = $("#st-new", el);
  if (nw) nw.onkeydown = async function (e) {
    if (e.key !== "Enter") return;

      await stCreate({ name: name, school: "", grade: "", homeroom: "" });

      var again = $("#st-new"); if (again) { again.focus(); }
    }
    catch (err) { nw.disabled = false; alert("만들지 못했다: " + err.message); }
  };
  var bg = $("#st-bulk-go", el);
  if (bg) bg.onclick = async function () {
    var txt = $("#st-bulk").value, cid = $("#st-bulk-cls").value, msg = $("#st-bulk-msg");
    var made = 0, skipped = [], lines = txt.split(/\r?\n/);
    bg.disabled = true; msg.textContent = "만드는 중...";
    try {
      for (var i = 0; i < lines.length; i++) {
        var one = parseBulkLine(lines[i]); if (!one) continue;
        if (S.students.some(function (x) { return x.name === one.name; })) { skipped.push(one.name); continue; }
        var person = await stCreate(one);
        if (cid) await stAssign(cid, person);
        made++;
      }
      msg.textContent = made + "명 만들었다" + (skipped.length ? " · 이미 있어 건너뜀: " + skipped.join(", ") : "");
      $("#st-bulk").value = "";
      keepScroll(renderStudents);
    } catch (e) { msg.textContent = "실패: " + e.message; }
    bg.disabled = false;
  };
  var fx = $("#st-fix", el);
  if (fx) fx.onclick = async function () {
    fx.disabled = true; fx.textContent = "반영하는 중...";
    try { var n = await fixDrift(); alert(n + "건을 반 명단에 반영했다."); keepScroll(renderStudents); }
    catch (e) { fx.disabled = false; alert("반영하지 못했다: " + e.message); }
  };
  var op = $("#st-orph", el);
  if (op) op.onclick = async function () {
    var rows = orphanRosterRows();
    if (!confirm("반 명단에서 뺀다.\n\n" + rows.map(function (x) { return x.r.name + " — " + x.cname; }).join("\n") +
      "\n\n지난 출결·과제 기록은 지워지지 않는다.")) return;
    op.disabled = true; op.textContent = "빼는 중...";
    try { var n = await removeOrphans(); alert(n + "건을 반 명단에서 뺐다."); keepScroll(renderStudents); }
    catch (e) { op.disabled = false; alert("빼지 못했다: " + e.message); }
  };
  var lk = $("#st-link", el);
  if (lk) lk.onclick = async function () {
    lk.disabled = true; lk.textContent = "잇는 중...";
    try { var r = await linkLoose(); alert(r.made + "명을 만들어 이었다." + (r.skip ? "\n이름이 겹쳐 건너뛴 것 " + r.skip + "건은 앱에서 골라야 한다." : "")); keepScroll(renderStudents); }
    catch (e) { lk.disabled = false; alert("잇지 못했다: " + e.message); }
  };
}

// ---- 변경 기록 ----
//
// 명단은 여기와 수업관리 앱 **두 곳에서** 고친다. 저장소는 하나지만(앱 students),
// 그래서 «누가 어디서 무엇을 바꿨나» 를 아무도 모른다. 그 앎을 한 곳에 모아
// **여기서** 볼 수 있게 한다 — 그것이 이 앱이 명단의 근거지라는 뜻이다.
//
// 앱과 같은 자리(appConfig/studentLog)에 쓴다. 새 컬렉션을 만들면 앱 보안 규칙을
// 콘솔에 다시 붙여넣어야 하는데, 안 붙여넣으면 기록이 조용히 안 쌓인다.
var STUDENT_LOG_KEEP = 300;
// ⚠ 모아서 한 번에 쓴다. 여러 명 붙여넣기는 한 번에 수십 명을 만든다.
//    한 명마다 읽고 쓰면 그만큼 느려진다.
var LOG_Q = [], LOG_T = null;
function logStudentChange(act, pid, name, detail) {
  LOG_Q.push({ t: Date.now(), act: act, pid: pid || "", name: name || "",
               by: teacherName(S.claims && S.claims.tid) || "", from: "팀체크",
               detail: detail || "" });
  if (LOG_T) clearTimeout(LOG_T);
  LOG_T = setTimeout(flushStudentLog, 800);
}
async function flushStudentLog() {
  LOG_T = null;
  var q = LOG_Q; LOG_Q = [];
  if (!q.length) return;
  try {
    var ref = db.collection("appConfig").doc("studentLog");
    var d = await ref.get();
    var items = ((d.exists && d.data().items) || []).concat(q);
    items = items.slice(-STUDENT_LOG_KEEP);
    await ref.set({ items: items, updated: Date.now() }, { merge: true });
    S.stLog = items;
  } catch (e) {}   // 기록 때문에 저장이 실패하면 안 된다
}

// ---- 쓰기 (climath-class) ----
// 반 명단은 배열 하나라 통째로 다시 쓴다. **반드시 방금 읽은 것 위에 얹는다** —
// 화면이 들고 있던 옛 사본으로 저장하면 그 사이 다른 선생님이 바꾼 것이 날아간다.
// 같은 사람을 다시 넣을 때 **옛 번호를 되쓴다.** 출결·과제·질문번호·참여표·
// 강의노트 조회가 전부 이 번호로 달려 있어서, 새 번호를 만들면 지난 기록이 끊긴다.
// 뺄 때 pastIds 에 적어 두고 넣을 때 꺼내 쓴다. 동명이인은 이름을 A·B·C 로 가른다.
function rosterKey(p) { return (p && p.pid) ? "pid:" + p.pid : "name:" + ((p && p.name) || ""); }
function reuseRosterId(cls, person) {
  var past = ((cls && cls.pastIds) || {})[rosterKey(person)];
  var taken = ((cls && cls.roster) || []).some(function (r) { return r.id === past; });
  if (past && !taken) return past;
  return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
}

async function withFreshRoster(cid, fn) {
  var snap = await db.collection("classes").doc(cid).get();
  var cur = (snap.exists && snap.data().roster) || [];
  var next = fn(cur);
  if (!next) return null;
  await db.collection("classes").doc(cid).update({ roster: next });
  var c = S.classes.filter(function (x) { return x.id === cid; })[0];
  if (c) c.roster = next;
  return next;
}
async function stSave(pid, patch) {
  await db.collection("students").doc(pid).set(Object.assign({}, patch, { updated: Date.now() }), { merge: true });
  var p = S.byPid[pid]; if (p) Object.assign(p, patch);
  if ("name" in patch || "school" in patch || "grade" in patch) await stSyncRosters(p);
  logStudentChange("고침", pid, (p && p.name) || patch.name || "",
    Object.keys(patch).filter(function (k) { return k !== "name"; }).join(" · "));
}
async function stCreate(data) {
  var ref = await db.collection("students").add(Object.assign({}, data, { time: Date.now(), updated: Date.now() }));
  var p = Object.assign({ pid: ref.id }, data);
  S.students.push(p); S.byPid[ref.id] = p;
  logStudentChange("만듦", ref.id, data.name || "", "");
  return p;
}
// **반 명단에서 먼저 빼고** 사람 문서를 지운다.
// 사람만 지우면 그 사람을 가리키는 반 명단 항목이 유령으로 남는다 — 배치표에는 뜨는데
// 명단에는 없고, rosterDrift·looseRosterRows 둘 다 못 잡는다(하나는 사람이 없어서,
// 하나는 pid 가 있어서). 빼는 것은 "반에서 빼기"와 같은 일이라 기록은 그대로 남는다.
async function stDelete(pid) {
  var inCls = classesOfPid(pid);
  for (var i = 0; i < inCls.length; i++) await stUnassign(inCls[i].id, pid);
  var gone = S.byPid[pid];
  await db.collection("students").doc(pid).delete();
  logStudentChange("지움", pid, (gone && gone.name) || "", "");
  S.students = S.students.filter(function (x) { return x.pid !== pid; });
  delete S.byPid[pid];
  if (S.notes[pid]) { delete S.notes[pid]; try { await saveNotes(); } catch (e) {} }
}
async function stAssign(cid, person) {
  var cls = S.classes.filter(function (x) { return x.id === cid; })[0];
  var added = await withFreshRoster(cid, function (roster) {
    if (roster.some(function (r) { return r.pid === person.pid; })) return null;
    var id = reuseRosterId({ roster: roster, pastIds: cls && cls.pastIds }, person);
    return roster.concat([{ id: id,
      pid: person.pid, name: person.name, school: person.school || "", grade: person.grade || "" }]);
  });
  if (added) logStudentChange("반에 넣음", person.pid, person.name || "", className(cid));
}
async function stUnassign(cid, pid) {
  var p = S.byPid[pid], gone = null;
  await withFreshRoster(cid, function (roster) {
    gone = roster.filter(function (r) { return r.pid === pid; })[0] || null;

function rosterDrift() {
  var out = [];
  activeClasses().forEach(function (c) {
    (c.roster || []).forEach(function (r) {
      if (!r.pid) return;
      var p = S.byPid[r.pid]; if (!p) return;
      if ((r.name || "") !== (p.name || "") || (r.school || "") !== (p.school || "") || (r.grade || "") !== (p.grade || ""))
        out.push({ cid: c.id, cname: c.name, pid: r.pid });
    });
  });
  return out;
}
async function fixDrift() {
  var d = rosterDrift(), seen = {}, n = 0;
  for (var i = 0; i < d.length; i++) {
    if (seen[d[i].pid]) continue;
    seen[d[i].pid] = 1;
    var p = S.byPid[d[i].pid]; if (!p) continue;
    await stSyncRosters(p); n++;
  }
  return d.length;
}
// 지워진 사람을 가리키는 반 명단 항목. 배치표에만 뜨고 명단에는 없다.
// 옛 판(2026-09-04)이 사람만 지워서 생긴 것들이 남아 있을 수 있다.
function orphanRosterRows() {
  var out = [];
  activeClasses().forEach(function (c) {
    (c.roster || []).forEach(function (r) {
      if (!r.teacher && r.pid && !S.byPid[r.pid] && !isEnded(r)) out.push({ cid: c.id, cname: c.name, r: r });
    });
  });

}
async function removeOrphans() {
  var rows = orphanRosterRows(), byCid = {};
  rows.forEach(function (x) { (byCid[x.cid] = byCid[x.cid] || []).push(x.r.id); });
  for (var cid in byCid) {
    var ids = byCid[cid];
    await withFreshRoster(cid, function (roster) {
      return roster.filter(function (r) { return ids.indexOf(r.id) < 0; });

  return rows.length;

// 반에는 있는데 사람 정보가 없는 항목(pid 없음). 명단에 안 떠서 통째로 안 보인다.
function looseRosterRows() {
  var out = [];
  activeClasses().forEach(function (c) {
    (c.roster || []).forEach(function (r) { if (!r.teacher && !r.pid && !isEnded(r)) out.push({ cid: c.id, cname: c.name, r: r }); });
  });

}
// 이름이 하나뿐일 때만 잇는다. 겹치면 사람이 골라야 한다 — 동명이인을 섞으면 되돌리기 어렵다.
async function linkLoose() {
  var rows = looseRosterRows(), byName = {};
  rows.forEach(function (x) { (byName[x.r.name] = byName[x.r.name] || []).push(x); });
  var made = 0, skip = 0;
  for (var name in byName) {
    var group = byName[name];
    var existing = S.students.filter(function (x) { return x.name === name; });
    if (existing.length > 1 || group.length > 1) { skip += group.length; continue; }
    var person = existing[0] || await stCreate({ name: name, school: group[0].r.school || "", grade: group[0].r.grade || "", homeroom: "" });
    var g = group[0];
    await withFreshRoster(g.cid, function (roster) {
      return roster.map(function (r) { return r.id === g.r.id ? Object.assign({}, r, { pid: person.pid }) : r; });
    });
    made++;
  }
  return { made: made, skip: skip };
}

function bulkParseGrade(tok) {
  if (GRADES.indexOf(tok) >= 0) return tok;
  var m = { "9": "중3", "10": "고1", "11": "고2", "12": "고3", "중3": "중3" };
  return m[tok] || "";
}
function parseBulkLine(line) {
  var t = line.split(/[\t,]|\s{1,}/).map(function (x) { return x.trim(); }).filter(Boolean);
  if (!t.length) return null;
  var name = t.shift(), grade = "", school = "";
  for (var i = 0; i < t.length; i++) {
    var g = bulkParseGrade(t[i]);
    if (g && !grade) { grade = g; continue; }
    school = school ? school + " " + t[i] : t[i];
  }
  return { name: name, grade: grade, school: school, homeroom: "" };
}

// ---------- 학교 일정 ----------
//
// 학교·학년마다 내신 기간과 수학시험 날짜를 한 번만 적어두는 곳(`appConfig/schoolTerms`).
// 참여표가 여기서 기본값을 가져간다. 수업관리 앱의 SchoolTermBoard 와 **같은 문서**를 쓴다.
//
// 시험 기간 찾아오기는 앱의 `/api/schedule` 을 중계해서 쓴다 — 나이스 → 학교 홈페이지 →
// 게시판 첨부문서(→ AI) 네 단계가 이미 그쪽에 쌓여 있다.

var termKeyOf = function (t) { return String(t || "").replace(/[^0-9A-Za-z가-힣]+/g, "_"); };
var schedKey = function (term, school, grade) { return termKeyOf(term) + "__" + school + "__" + grade; };
// **넘긴 칸만** 보낸다. merge:true 는 지도 안까지 합쳐주므로 나머지 칸은 그대로 남는다.
// 통째로 보내면 화면이 들고 있던 옛 사본으로 덮게 되어, 시작 → 끝을 이어 고칠 때 시작이 날아간다.
async function saveSchoolTerm(term, school, grade, v) {
  var k = schedKey(term, school, grade);
  var one = Object.assign({ term: term, school: school, grade: grade, updated: Date.now() }, v);
  var patch = {}; patch[k] = one;
  await db.collection("appConfig").doc("schoolTerms").set(patch, { merge: true });
  S.schoolTerms[k] = Object.assign({}, S.schoolTerms[k], one);
}

// ---- 불러오기는 화면 밖에서 돈다 ----
// 학교마다 몇 초에서 몇십 초씩 걸린다. 화면에 매어두면 다른 메뉴를 누르는 순간 통째로 날아간다.
var PULL_JOB = { running: false, done: 0, total: 0, now: "", msg: "", diffs: [], links: [], stop: false, subs: [] };
function jobSnap() { var o = {}; for (var k in PULL_JOB) if (k !== "subs") o[k] = PULL_JOB[k]; o.diffs = PULL_JOB.diffs.slice(); o.links = (PULL_JOB.links || []).slice(); return o; }
function jobEmit() { var sn = jobSnap(); PULL_JOB.subs.slice().forEach(function (f) { try { f(sn); } catch (e) {} }); }
function jobSub(fn) { PULL_JOB.subs.push(fn); fn(jobSnap()); return function () { var i = PULL_JOB.subs.indexOf(fn); if (i >= 0) PULL_JOB.subs.splice(i, 1); }; }

// 수학시험 날짜만 찾아오는 길. 같은 서버의 다른 갈래다(want:"math") — 학사일정이 아니라 가정통신문 게시판을 본다.
async function fetchMathDates(school, from, to, grades) {
  var tu = teamAuth.currentUser;
  if (!tu) throw new Error("로그인이 풀렸습니다");
  var r = await fetch("/api/schedule", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ idToken: await tu.getIdToken(), want: "math",
      school: school, from: ymdNum(from), to: ymdNum(to), kind: S.pullKind || "중간", grades: grades }) });
  var j = await r.json().catch(function () { return null; });
  if (!r.ok) throw new Error((j && j.error) || ("서버가 " + r.status + " 로 답했습니다"));
  return j || {};
}
function ymdNum(d) { return String(d || "").replace(/-/g, ""); }

// ⚠ 2026-09-08부터 찾아오기 서버가 **이 앱 안에** 있다. 수업관리 앱 토큰을 더 안 보낸다 —
//   저쪽에 중계하던 때의 흔적이라, 남겨 두면 «왜 앱 로그인이 필요하지» 로 읽힌다.
async function fetchSchedule(school, from, to, kind) {
  var tu = teamAuth.currentUser;
  if (!tu) throw new Error("로그인이 풀렸습니다");
  var r = await fetch("/api/schedule", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ idToken: await tu.getIdToken(),
      school: school, from: from, to: to, kind: kind }) });
  var j = null; try { j = await r.json(); } catch (e) {}
  if (!r.ok) throw new Error((j && j.error) || ("불러오지 못했어요 (" + r.status + ")"));
  return j || {};
}
// 서버가 이름을 셋 중 하나로 못박아 보낸다. 이것 말고는 옛 양식이거나 손으로 적은 것이다.
var CANON_LABEL = /^(중간고사|기말고사|졸업고사)$/;
function planNote(plan) {
  var bs = (plan && plan.blocks) || [];
  if (!bs.length) return "";
  var line = bs.map(function (b) {
    var d = b.start.slice(5).replace("-", "/");
    var e = b.end && b.end !== b.start ? "~" + b.end.slice(8) : "";
    return b.name + " " + d + e;
  }).join(" · ");
  return line + (plan.pending ? " · 기말 아직" : "");
}
var PULL_CONC = 4;   // 학교끼리는 상관이 없다. 한 줄로 세우면 느린 학교가 곧 전체 시간이 된다
var MATH_CONC = 3;   // 수학 쪽은 AI 를 부를 수 있어 분당 한도가 있다. 아래 runMathPull 의 경고를 보라
async function runPull(term, targets, from, to, kind) {
  if (PULL_JOB.running) return;
  var names = []; targets.forEach(function (t) { if (names.indexOf(t.school) < 0) names.push(t.school); });
  PULL_JOB.running = true; PULL_JOB.done = 0; PULL_JOB.total = names.length;
  PULL_JOB.now = ""; PULL_JOB.msg = ""; PULL_JOB.diffs = []; PULL_JOB.stop = false;
  jobEmit();
  var filled = 0, same = 0, relabeled = 0;
  var notFound = [], noExam = [], noData = [], fromDoc = [], dupe = [];
  var inflight = [], next = 0;
  var showNow = function () { PULL_JOB.now = inflight.join(", "); };

  async function pullOne(school) {
    var r;
    try { r = await fetchSchedule(school, from, to, kind); }
    catch (e) { notFound.push(school + "(" + e.message + ")"); return; }
    // ⚠ 이유를 버리면 "못 찾음: 서운중" 만 남아 왜인지 알 길이 없다.
    //    2026-09-04에 이것 때문에 짐작으로 팠다 — 실제로는 학교 **이름** 때문에 못 찾은 것이었다.
    if (r.error) { notFound.push(school + " — " + r.error); return; }
    if (!r.hasAny) { noData.push(school + (r.docReason ? " (" + r.docReason + ")" : "")); return; }
    if (r.dupes && r.dupes.length) dupe.push(school + " (" + r.dupes.join("·") + "에도 있음)");
    if (r.via === "doc") fromDoc.push(school + (r.docTitle ? " (" + r.docTitle + ")" : ""));
    // 그림에서 읽은 것은 대조할 원문이 없다. 요일로 걸렀어도 사람이 한 번 봐야 한다.
    else if (r.via === "image") fromDoc.push(school + " (그림)");
    // 왜 못 찾았는지를 화면에 그대로 보여준다. 안 그러면 "그냥 안 된다"밖에 알 수 없다.
    else if (r.docReason) noExam.push(school + " — " + r.docReason);
    var note = planNote(r.plan);
    var srcU = (r.src && r.src.url) || "", srcN = (r.src && r.src.name) || "";
    var mine = targets.filter(function (x) { return x.school === school; });
    for (var i = 0; i < mine.length; i++) {
      var t = mine[i];
      var g = r.byGrade && r.byGrade[t.grade];
      // 시험을 못 찾았어도 학기 계획과 근거 링크는 적어둔다 —
      // "이번 회차에 시험이 없다"와 "못 찾았다"를 가르는 유일한 단서이고, 손으로 채울 때 바로 필요하다.
      var put = {};
      if (note) put.plan = note;
      if (srcU && !t.cur.srcUrl) { put.srcUrl = srcU; put.srcName = srcN; }
      if (Object.keys(put).length) { try { await saveSchoolTerm(term, t.school, t.grade, put); } catch (e) {} }
      if (!g) { noExam.push(t.school + " " + t.grade); continue; }
      if (t.cur.start === g.start && t.cur.end === g.end) {
        // 날짜는 맞는데 이름이 옛 나이스 이름 그대로일 수 있다. 이미 셋 중 하나면 손대지 않는다 —
        // 선생님이 직접 적어 넣은 것을 덮어쓰지 않으려는 것이다.
        if (g.name && t.cur.label !== g.name && !CANON_LABEL.test(t.cur.label || "")) {
          try { await saveSchoolTerm(term, t.school, t.grade, { label: g.name }); relabeled++; } catch (e) {}
        }
        same++; continue;
      }
      // 이미 적어둔 것이 다르면 **덮지 않는다.** 학교가 바꿨을 수도, 사람이 맞게 고쳤을 수도 있다.
      if (t.cur.start || t.cur.end) {
        PULL_JOB.diffs.push({ school: t.school, grade: t.grade, mine: Object.assign({}, t.cur),
                              neis: { start: g.start, end: g.end }, name: g.name });
        jobEmit();
        continue;
      }
      try { await saveSchoolTerm(term, t.school, t.grade, { start: g.start, end: g.end, label: g.name || "" }); filled++; }
      catch (e) { notFound.push(t.school + "(저장 실패)"); }
    }
  }
  async function worker() {
    while (next < names.length && !PULL_JOB.stop) {
      var school = names[next++];
      inflight.push(school); showNow(); jobEmit();
      try { await pullOne(school); } catch (e) {}
      inflight.splice(inflight.indexOf(school), 1);
      PULL_JOB.done++; showNow(); jobEmit();
    }
  }
  var ws = []; for (var w = 0; w < Math.min(PULL_CONC, names.length); w++) ws.push(worker());
  await Promise.all(ws);
  var parts = [];
  if (filled) parts.push("채움 " + filled + "칸");
  if (same) parts.push("이미 맞음 " + same);
  if (relabeled) parts.push("시험 이름 정리 " + relabeled + "칸");
  if (PULL_JOB.diffs.length) parts.push("다른 값 " + PULL_JOB.diffs.length + "건");
  if (noExam.length) parts.push("이 회차 시험 없음: " + noExam.join(", "));
  if (noData.length) parts.push("학사일정 자체가 없음: " + noData.join(", "));
  if (fromDoc.length) parts.push("첨부문서에서 읽음(확인 필요): " + fromDoc.join(", "));
  if (dupe.length) parts.push("같은 이름 학교 있음: " + dupe.join(", "));
  if (notFound.length) parts.push("못 찾음: " + notFound.join(", "));
  PULL_JOB.msg = parts.length ? parts.join(" · ") : "바뀐 것이 없다";
  PULL_JOB.running = false; PULL_JOB.now = "";
  jobEmit();
}

// ---------- 수학시험 날짜도 나란히 찾아온다 (2026-09-12) ----------
//
// ⚠ 예전에는 **한 학교씩**이었다. 붙여넣기 도우미 안에 «홈페이지에서 찾아오기» 를 얹으면서
//   그 상자가 보고 있는 학교 하나만 부르게 된 것이다. 학교끼리는 아무 상관이 없으니
//   나란히 못 부를 이유가 없었다 — 시험 기간 쪽은 처음부터 넷씩 부르고 있었다.
//   쉰일곱 학교를 하나씩 부르면 스무 분이 넘는다. 넷씩이면 오 분이다.
// ⚠ 일감 상자(PULL_JOB)를 **같이 쓴다.** 둘을 한꺼번에 돌릴 일이 없고,
//   멈추기·진행·결과 상자를 두 벌로 만들면 한쪽만 고치는 날이 온다.
async function runMathPull(term, targets) {
  if (PULL_JOB.running) return;
  var bySchool = {};
  targets.forEach(function (t) { (bySchool[t.school] = bySchool[t.school] || []).push(t); });
  var names = Object.keys(bySchool);
  PULL_JOB.running = true; PULL_JOB.done = 0; PULL_JOB.total = names.length;
  PULL_JOB.now = ""; PULL_JOB.msg = ""; PULL_JOB.diffs = []; PULL_JOB.links = []; PULL_JOB.stop = false;
  jobEmit();
  var filled = 0, same = 0, busy = 0;
  var noSpan = [], noPost = [], noDate = [], failed = [];
  var inflight = [], next = 0;
  var showNow = function () { PULL_JOB.now = inflight.join(", "); };

  async function oneSchool(school) {
    var mine = bySchool[school];
    // 시험 기간이 없으면 날짜를 놓을 자리가 없다. 먼저 «시험 기간 찾아오기» 를 돌려야 한다.
    var span = mine.filter(function (v) { return v.start && v.end; })[0];
    if (!span) { noSpan.push(school); return; }
    var r;
    try { r = await fetchMathDates(school, span.start, span.end, mine.map(function (v) { return v.grade; })); }
    catch (e) { failed.push(school + " — " + e.message); return; }
    if (r.error) { failed.push(school + " — " + r.error); return; }
    // ⚠ AI 분당 한도에 걸린 것은 **학교 탓이 아니다.** 스무 곳을 이름으로 늘어놓으면
    //   못 찾은 학교처럼 보인다. 몇 곳인지만 세어 «잠시 뒤 다시» 라고 한 줄로 말한다.
    // 그래도 **글 링크는 남긴다.** 기다리기 싫으면 열어서 붙여넣으면 그 자리에서 읽힌다.
    if (r.busy) {
      busy++;
      if (r.post) { PULL_JOB.links.push({ school: school, post: r.post, url: r.url || "", note: "AI가 바빴다" }); jobEmit(); }
      return;
    }
    // 글은 찾았는데 글자를 못 꺼낸 것 — **링크는 준다.** 팀장이 열어 붙여넣으면 된다.
    if (r.post && !(r.rows || []).length) {
      PULL_JOB.links.push({ school: school, post: r.post, url: r.url || "", note: r.note || "" });
      noDate.push(school); jobEmit(); return;
    }
    if (!(r.rows || []).length) { noPost.push(school + (r.note ? " — " + r.note : "")); return; }
    for (var i = 0; i < mine.length; i++) {
      var t = mine[i];
      var gn = Number(String(t.grade).replace(/\D/g, "")) || 0;
      var hit = r.rows.filter(function (x) { return Number(x.grade) === gn; });
      var dates = []; hit.forEach(function (x) { if (dates.indexOf(x.date) < 0) dates.push(x.date); });
      if (!dates.length) { noDate.push(t.school + " " + t.grade); continue; }
      var why = hit.map(function (x) { return x.subject; }).filter(Boolean).join(" · ");
      if (t.math && dates.length === 1 && t.math === dates[0]) { same++; continue; }
      // **재서 읽은 것이고 날이 하나일 때만** 빈 칸을 저절로 채운다.
      // ⚠ AI 가 읽은 것은 학년을 찍을 수 있고, 날이 여럿이면 어느 것이 수학인지 모른다.
      //   그 둘은 사람이 고르게 한다 — 틀린 날이 조용히 들어가면 직보까지 어긋난다.
      if (!t.math && dates.length === 1 && r.by === "표") {
        try { await saveSchoolTerm(term, t.school, t.grade, { math: dates[0] }); filled++; }
        catch (e) { failed.push(t.school + " (저장 실패)"); }
        continue;
      }
      PULL_JOB.diffs.push({ kind: "math", school: t.school, grade: t.grade, mine: t.math || "",
                            dates: dates, why: why, by: r.by || "", post: r.post || "", url: r.url || "" });
      jobEmit();
    }
  }
  async function worker() {
    while (next < names.length && !PULL_JOB.stop) {
      var school = names[next++];
      inflight.push(school); showNow(); jobEmit();
      try { await oneSchool(school); } catch (e) {}
      inflight.splice(inflight.indexOf(school), 1);
      PULL_JOB.done++; showNow(); jobEmit();
    }
  }
  // ⚠ 시험 기간 쪽보다 하나 적게 돈다. 이쪽은 학교마다 **AI 를 부를 수 있어서** 분당 한도에 걸린다
  //   (2026-09-12 실측 — 넷씩 돌리니 열 곳이 429 였다). 한 곳 느려지는 값으로 열 곳을 건진다.
  var ws = []; for (var w = 0; w < Math.min(MATH_CONC, names.length); w++) ws.push(worker());
  await Promise.all(ws);
  var parts = [];
  if (filled) parts.push("채움 " + filled + "칸");
  if (same) parts.push("이미 맞음 " + same);
  if (PULL_JOB.diffs.length) parts.push("눈으로 고를 것 " + PULL_JOB.diffs.length + "건");
  if (busy) parts.push("AI가 바빠 못 읽음 " + busy + "곳 — 잠시 뒤 다시 돌리면 된다");
  if (noDate.length) parts.push("글은 찾았는데 날짜를 못 꺼냄: " + noDate.join(", "));
  if (noPost.length) parts.push("시간표 글이 아직 없음: " + noPost.join(", "));
  if (noSpan.length) parts.push("시험 기간이 비어 있음(먼저 채워야 한다): " + noSpan.join(", "));
  if (failed.length) parts.push("못 찾음: " + failed.join(", "));
  PULL_JOB.msg = parts.length ? parts.join(" · ") : "바뀐 것이 없다";
  PULL_JOB.running = false; PULL_JOB.now = "";
  jobEmit();
}

// 화면에 놓을 줄 — 학생이 실제로 다니는 (학교·학년) + 이 회차에 이미 적어둔 것
function termRows() {
  var m = {};
  Object.keys(S.schoolTerms).forEach(function (k) {
    var v = S.schoolTerms[k];
    if (v && v.term === S.term && v.school) m[v.school + "__" + v.grade] = Object.assign({ n: 0 }, v);
  });
  S.students.forEach(function (x) {
    if (!x.school || !x.grade) return;
    var k = x.school + "__" + x.grade;
    if (!m[k]) m[k] = { term: S.term, school: x.school, grade: x.grade, n: 0 };
    m[k].n++;
  });
  var out = Object.keys(m).map(function (k) { return m[k]; });
  out.sort(function (a, b) {
    return gradeRank(a.grade) - gradeRank(b.grade) || String(a.school).localeCompare(String(b.school), "ko");
  });
  return out;
}


// ---------- 새벽에 저 혼자 찾아 둔 것 (2026-09-13) ----------
//
// 마왕님 말씀 — "매일 아침6시마다 올라왔는지 돌려보고 잡힌건 나한테 알림으로 보고하는건 어때?"
//
// 학교는 시험 **2주쯤 전에** 시간표를 올리는데 그 날이 학교마다 다르다. 사람이 «생각나서» 누르면
// 늦거나 헛돈다. 시험이 언제인지는 앱이 이미 아니까, 때가 된 학교만 새벽에 보면 된다.
// `api/cron.js` 가 하루 한 번 돌아 `dash/mathFound` 에 적고, 새로 찾은 것이 있을 때만 알림을 보낸다.
//
// ⚠ **서버는 저장을 못 한다.** 학교 일정(appConfig/schoolTerms)은 *수업관리 앱* DB 에 있고
//   이 서버는 팀 DB 열쇠만 들고 있다. 그래서 찾은 것을 여기로 가져와
//   **손으로 돌렸을 때와 똑같은 자리**(PULL_JOB)에 놓는다 — 화면과 «넣기» 를 두 벌로 만들지 않는다.
//   거꾸로 보면 이게 안전장치다. 아무도 안 보는 새벽에 조용히 들어가는 날짜가 없다.

// 몇 시간 전인지. «2026-09-13T21:03:11Z» 은 사람이 읽을 값이 아니다.
function whenAgo(iso) {
  var t = Date.parse(iso || ""); if (!t) return "";
  var m = Math.floor((Date.now() - t) / 60000);
  if (m < 60) return m + "분 전";
  if (m < 60 * 24) return Math.floor(m / 60) + "시간 전";
  return Math.floor(m / 1440) + "일 전";
}

function adoptMathFound() {
  var f = S.mathFound;
  if (!f || S.ro || PULL_JOB.running) return;   // 손으로 돌리는 중이면 그 결과를 덮지 않는다
  var cur = {};
  termRows().forEach(function (v) { cur[v.school + "__" + v.grade] = v; });
  // ⚠ 새벽에 적힌 «지금 값»은 낡았다. 그 뒤에 팀장이 손으로 넣었을 수 있다.
  //   지금 값으로 다시 맞추고, 이미 채워진 줄은 아예 뺀다 — 다 한 일을 또 하라고 내밀면 안 된다.
  var diffs = (f.diffs || []).filter(function (d) {
    var v = cur[d.school + "__" + d.grade];
    if (!v) return false;                                  // 이 회차에 더는 없는 학교·학년
    if (v.math && (d.dates || []).length === 1 && v.math === d.dates[0]) return false;
    d.mine = v.math || "";
    if (d.mine) d.auto = false;                            // 이미 적힌 것은 절대 저절로 안 덮는다
    return true;
  });
  var links = (f.links || []).filter(function (x) {
    return Object.keys(cur).some(function (k) { return cur[k].school === x.school && !cur[k].math; });
  });
  if (!diffs.length && !links.length) return;
  PULL_JOB.diffs = diffs; PULL_JOB.links = links;
  PULL_JOB.msg = "새벽에 찾아 둔 것 · " + whenAgo(f.at);
  jobEmit();
}

// 내일 새벽에 볼 학교를 적어 둔다.
// ⚠ 서버는 학생도 학교 일정도 못 읽는다(수업관리 앱 DB). **이 목록을 넘겨주지 않으면 새벽 찾기는 볼 것이 없다.**
//   그래서 학교 일정 화면을 안 열어도 되도록 로그인할 때마다 적는다. 안 바뀌었으면 안 쓴다.
var MATH_WATCH_SIG = "";
async function saveMathWatch() {
  if (S.ro || !S.teamOk || !S.term) return;
  var rows = termRows()
    .filter(function (v) { return !v.math && v.start && v.end; })
    .map(function (v) { return { school: v.school, grade: v.grade, start: v.start, end: v.end, math: "" }; })
    .slice(0, 80);
  var doc = { by: myTid(), term: S.term, kind: /기말|졸업/.test(S.term) ? "기말" : "중간",
              rows: rows, at: new Date().toISOString() };
  var sig = doc.by + "|" + doc.term + "|" + rows.map(function (r) {
    return r.school + r.grade + r.start + r.end;
  }).join(",");
  if (sig === MATH_WATCH_SIG) return;
  MATH_WATCH_SIG = sig;
  try { await dashDoc("mathWatch").set(doc); } catch (e) {}
}

// ---------- 수학시험 날짜 넣기 (2026-09-08) ----------
//
// 마왕님 말씀 — "학교일정에서 수학시험 날짜가 아직 등록이 안됐어. 요즘 슬슬 학교 홈페이지 가정통신문이나
// 공지사항에 올라오는 것 같더라고. 수학시험날짜 넣기 기능 추가할 수 있을까?"
//
// 학사일정(나이스)에는 «2학기 중간고사» 까지만 있고 **과목별 시간표는 안 올라온다**. 그건 학교가 가정통신문·공지로 따로 낸다.
// 그 글을 **그대로 붙여넣으면** 수학 보는 날을 찾아 준다. 학교마다 홈페이지가 달라 긁어오기는 다음 일이고
// (그 파이프라인은 수업관리 앱에 있다), 붙여넣기는 어느 학교든 오늘 바로 된다.
//
// ⚠ 찾기만 하고 **넣는 것은 사람이 누른다.** 시간표를 잘못 읽으면 직보(수학시험 전날)까지 어긋나고,
//   그 날짜로 참여표가 돌아간다. 한 줄씩 «넣기» 를 누른다.
// ⚠ 시험 기간(start~end) 밖의 날짜는 빨갛게 짚어 준다 — 지난 회차 시간표를 붙여넣는 실수가 제일 흔하다.

// 수학 계열 과목. «수학여행»·«수학능력» 같은 말은 뺀다 — 가정통신문에 흔하다.
var MATH_WORD = /(공통수학|수학Ⅰ|수학Ⅱ|수학I|수학II|미적분|확률과\s*통계|확통|기하|대수|미적|수학)/;
var MATH_NOT = /수학(여행|능력|경시|학습|올림피아드|과학축전|나눔)/;
function hasMath(t) {
  var x = String(t || "");
  if (!MATH_WORD.test(x)) return false;
  // «수학여행» 만 있는 칸은 수학이 아니다. 그 말을 지우고도 남으면 과목으로 본다.
  return MATH_WORD.test(x.replace(new RegExp(MATH_NOT.source, "g"), ""));
}
// 붙여넣은 글에서 날짜 하나. 해가 없으면 회차의 해로 채운다.
function pickDate(t, year) {
  var x = String(t || ""), m;
  if ((m = /(20\d{2})\s*[-.\/년]\s*(\d{1,2})\s*[-.\/월]\s*(\d{1,2})/.exec(x))) return ymdOf(m[1], m[2], m[3]);
  if ((m = /(\d{1,2})\s*월\s*(\d{1,2})\s*일/.exec(x))) return ymdOf(year, m[1], m[2]);
  // «10.15.» 처럼 끝에 점을 찍는 학교가 많다. 점은 받되 «10.15.2025» 같은 세 토막은 위에서 이미 걸렀어야 한다.
  if ((m = /(?:^|[^\d])(\d{1,2})\s*[\/.]\s*(\d{1,2})(?!\d)(?!\s*[\/.]\s*\d)/.exec(x))) return ymdOf(year, m[1], m[2]);
  return "";
}
function ymdOf(y, mo, d) {
  y = Number(y); mo = Number(mo); d = Number(d);
  if (!y || mo < 1 || mo > 12 || d < 1 || d > 31) return "";
  return y + "-" + ("0" + mo).slice(-2) + "-" + ("0" + d).slice(-2);
}
// «1학년»·«고2»·«중3» — 시간표가 학년마다 갈려 있을 때.
function pickGrade(t) {
  var x = String(t || ""), m;
  if ((m = /(중|고)\s*([1-3])(?![0-9])/.exec(x))) return { kind: m[1], num: Number(m[2]) };
  if ((m = /([1-3])\s*학\s*년/.exec(x))) return { kind: "", num: Number(m[1]) };
  return null;
}
// 붙여넣은 글에서 «수학 보는 날» 을 뽑는다.
//
// 두 가지 모양을 본다:
//   칸 모양 — 표를 복사하면 칸이 탭으로 온다. 날짜가 머리줄에 가로로 서고 과목이 그 아래 같은 칸에 온다.
//             그래서 **같은 칸 번호**의 위쪽 날짜를 쓴다.
//   줄 모양 — "10/15(수) 1교시 국어 2교시 수학" 처럼 한 줄에 날짜와 과목이 같이 온다.
//             날짜가 없으면 바로 위의 날짜 줄(«■ 10월 15일»)을 쓴다.
function mathExamHits(text, year) {
  var lines = String(text || "").replace(/\r/g, "").split("\n");
  var colDate = {}, lastDate = "", lastDateAt = -99, grade = null, hits = [];
  var add = function (date, g, why) {
    if (!date) return;
    var key = date + "|" + (g ? (g.kind || "") + g.num : "");
    if (hits.some(function (h) { return h.key === key; })) return;
    hits.push({ key: key, date: date, kind: g ? g.kind : "", num: g ? g.num : 0, why: String(why || "").trim().slice(0, 60) });
  };
  lines.forEach(function (line, i) {
    var g = pickGrade(line); if (g) grade = g;
    var cells = line.indexOf("\t") >= 0 ? line.split("\t") : null;
    if (cells) {
      // 머리줄이면 칸마다 날짜를 적어 둔다. 과목 칸이면 그 칸 번호의 날짜를 쓴다.
      cells.forEach(function (c, ci) { var d = pickDate(c, year); if (d && !hasMath(c)) colDate[ci] = d; });
      cells.forEach(function (c, ci) {
        if (!hasMath(c)) return;
        add(pickDate(c, year) || colDate[ci] || lastDate, grade, line);
      });
      var any = cells.map(function (c) { return pickDate(c, year); }).filter(Boolean)[0];
      if (any) { lastDate = any; lastDateAt = i; }
      return;
    }
    var d = pickDate(line, year);
    if (hasMath(line)) add(d || (i - lastDateAt <= 6 ? lastDate : ""), grade, line);
    else if (d) { lastDate = d; lastDateAt = i; }
  });
  return hits;
}
// 홈페이지에서 찾아온 줄({grade:1, subject:"공통수학2", date:"2026-10-01"})을 붙여넣기와 **같은 모양**으로 만든다.
// 화면과 «넣기» 를 두 벌로 만들지 않으려는 것이다 — 어디서 왔든 팀장이 보는 것은 같아야 한다.
function mathPlanFromRows(school, rows) {
  const mine = termRows().filter(function (v) { return v.school === school; });
  return mine.map(function (v) {
    var gn = Number(String(v.grade).slice(1)) || 0;
    var hit = (rows || []).filter(function (r) { return Number(r.grade) === gn; });
    var dates = []; hit.forEach(function (r) { if (dates.indexOf(r.date) < 0) dates.push(r.date); });
    var out = { school: school, grade: v.grade, cur: v.math || "", start: v.start || "", end: v.end || "",
                date: dates.length === 1 ? dates[0] : "", many: dates.length > 1 ? dates : null,
                why: hit.map(function (r) { return r.subject; }).filter(Boolean).join(" · ") };
    if (out.date && v.start && v.end && (out.date < v.start || out.date > v.end)) out.warn = "시험 기간 밖";
    return out;
  });
}
// 찾은 것을 이 회차의 «학교|학년» 줄에 붙인다. 학년 표시가 아예 없으면 그 학교의 모든 학년에 같은 날.
function mathPlan(text, school) {
  var rows = termRows().filter(function (v) { return v.school === school; });
  // 가정통신문은 «10/15» 처럼 해를 안 적는다. 이 회차 시험이 있는 해로 채운다(없으면 오늘 해).
  var year = Number(String(rows.map(function (v) { return v.start; }).filter(Boolean)[0] || TODAY).slice(0, 4));
  var hits = mathExamHits(text, year);
  var numbered = hits.filter(function (h) { return h.num; });
  return rows.map(function (v) {
    var gk = String(v.grade).charAt(0), gn = Number(String(v.grade).slice(1)) || 0;
    var mine = numbered.length
      ? numbered.filter(function (h) { return h.num === gn && (!h.kind || h.kind === gk); })
      : hits;
    var dates = []; mine.forEach(function (h) { if (dates.indexOf(h.date) < 0) dates.push(h.date); });
    var out = { school: school, grade: v.grade, cur: v.math || "", start: v.start || "", end: v.end || "",
                date: dates.length === 1 ? dates[0] : "", many: dates.length > 1 ? dates : null,
                why: (mine[0] || {}).why || "" };
    if (out.date && v.start && v.end && (out.date < v.start || out.date > v.end)) out.warn = "시험 기간 밖";
    return out;
  });
}

//
// 수업관리 앱의 ExamBoard/ExamEntry 와 **같은 자리에 같은 모양으로** 쓴다.
//   classes/{cid}/exams/{회차키}__{sid}   회차키 = 회차의 / 와 공백을 _ 로 바꾼 것
//   회차는 학원 전체로 하나 — appConfig/examTerm
// 그래서 여기서 만든 것이 앱의 참여표에 그대로 뜨고, 학생이 낸 것도 여기 그대로 보인다.
//
// 이 표가 답하는 질문은 "누가 언제 안 오고 언제 돌아오나"다. 그래서 본체는 표가 아니라
// **날짜 띠**다 (원본 구글시트가 그랬다).

var EXAM_MARKS = {
  prep: { t: "직", label: "직보 (수학시험 전날)", bg: "#f6e7df", fg: "#c2703f" },
  math: { t: "수", label: "수학시험", bg: "#fae3e2", fg: "#d6453f" },

};

  { key: "exam", label: "시험기간", bg: "#f0ece5", fg: "#7c6f5f" },
  { key: "math", label: "수학시험", bg: "#fae3e2", fg: "#d6453f" },
  { key: "prep", label: "직보", bg: "#f6e7df", fg: "#c2703f" },
  { key: "back", label: "복귀", bg: "#e3edf5", fg: "#2b5f8a" },
  { key: "erase", label: "지우개", bg: "#fff", fg: "#8a7f72" },
];
// 앱의 목록과 같아야 한다 — 자유 입력이면 중동고/중동고등학교/중동이 섞여 같은 학교인지
// 판별 자체가 안 된다. 비교하려면 먼저 값이 같아야 한다.
var KNOWN_SCHOOLS = ["개포고", "건대부고", "경기고", "경기여고", "경신고", "광남고", "단대부고", "대성고",
  "덕수고", "반포고", "배명고", "배문고", "배재고", "보인고", "상문고", "서울고",
  "서초고", "선덕고", "숙명여고", "언남고", "영동고", "은광여고", "잠신고", "정신여고",
  "중대부고", "중동고", "중산고", "중흥고", "진선여고", "창문여고", "한대부고", "현대고",
  "효성고", "휘문고"];
var DAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];
var examKey = function (term, sid) { return String(term).replace(/[\/\s]+/g, "_") + "__" + sid; };
var examSig = function (v) { return [v.start || "", v.end || "", v.math || ""].join("~"); };
var isIndividual = function (c) { return c && c.type === "individual"; };
function isActiveOn(st, d) {
  if (!st) return false;
  if (st.startDate && d < st.startDate) return false;
  if (st.endDate && d > st.endDate) return false;
  return true;
}
function dayAfter(d) { return d && parseYmd(d) ? addDays(d, 1) : ""; }
function dayBefore(d) { return d && parseYmd(d) ? addDays(d, -1) : ""; }
function monthOf(d) { return String(d || "").slice(0, 7); }
function shiftMonth(ym, delta) {
  var y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
  var d = new Date(y, m - 1 + delta, 1);
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1);
}
function daysOfMonth(ym) {
  var out = [], y = Number(ym.slice(0, 4)), m = Number(ym.slice(5, 7));
  var last = new Date(y, m, 0).getDate();
  for (var i = 1; i <= last; i++) out.push(y + "-" + pad2(m) + "-" + pad2(i));
  return out;
}
// 안 오는 구간은 내신기간이 아니라 **직보 다음날 ~ 복귀 전날**이다.
// 직보가 마지막 수업이고 그 다음 오는 날이 복귀라, 시험이 끝난 뒤라도 복귀 전이면 안 온다.
function outRange(v) {
  return { s: (v && v.prep) ? dayAfter(v.prep) : ((v && v.start) || ""),
           e: (v && v.back) ? dayBefore(v.back) : ((v && v.end) || "") };
}
function isOutOn(v, d) { var r = outRange(v); return !!(r.s && r.e && d >= r.s && d <= r.e); }
// 수업일 판정. **반 요일을 안 보는 함수를 쓰면 그 달 전체가 수업일이 되어 31회로 나온다.**
// 제출에 요일이 적혀 있으면 그걸 먼저 쓴다 — 나중에 반 요일이 바뀌어도 그때 센 회차가 재현된다.
function isClassDay(cls, st, d, v) {
  if (!isActiveOn(st, d)) return false;
  var dow = new Date(d + "T00:00:00").getDay();
  var days = (v && v.days && v.days.length) ? v.days
           : (isIndividual(cls) ? (st.days || []) : (cls.classDays || []));
  return days.indexOf(dow) >= 0;
}
// 그 달의 등원 회차 — **수강료에 쓰는 숫자다.**
// 띠는 복귀일에서 끝나지만 회차는 그 달 전체로 센다. 띠로 세면 그 뒤 수업일이 빠진다.
function attendCount(cls, st, v, monthDays, examMonth) {
  var come = {}, total = 0, skip = 0;
  monthDays.forEach(function (d) {
    if (!isClassDay(cls, st, d, v)) return;
    total++;
    if (isOutOn(v, d)) { skip++; return; }
    come[d] = 1;
  });
  // 직보·복귀는 수업 요일이 아니어도 오는 날이다. 그 달 안에 있을 때만.
  [(v && v.prep) || "", (v && v.back) || ""].forEach(function (d) {
    if (!d || monthOf(d) !== examMonth || come[d]) return;
    come[d] = 1;
  });
  return { total: total, skip: skip, come: Object.keys(come).length };
}
function markOf(v, d) {
  if (v.math && d === v.math) return EXAM_MARKS.math;
  if (v.prep && d === v.prep) return EXAM_MARKS.prep;
  if (v.back && d === v.back) return EXAM_MARKS.back;
  if (v.start && v.end && d >= v.start && d <= v.end) return EXAM_MARKS.exam;
  return null;
}
function examSchoolOpts() {
  var m = {};
  KNOWN_SCHOOLS.forEach(function (x) { m[x] = 1; });
  S.students.forEach(function (x) { if (x.school) m[x.school] = 1; });
  Object.keys(S.schoolTerms).forEach(function (k) { var v = S.schoolTerms[k]; if (v && v.school) m[v.school] = 1; });
  return Object.keys(m).sort();
}

async function loadExams() {
  if (!S.term) return;

  await Promise.all(cs.map(function (c) {
    return db.collection("classes").doc(c.id).collection("exams").where("term", "==", S.term).get().then(function (s) {
      var m = {}; s.forEach(function (d) { var v = d.data(); m[v.sid] = v; }); S.exams[c.id] = m; delete S.examsDenied[c.id];
    }).catch(function (e) {

      S.exams[c.id] = {};
      if (e && /permission|insufficient/i.test(e.code + " " + e.message)) S.examsDenied[c.id] = true;
    });
  }));
}

// ---- 선생님이 표에서 바로 고치는 두 칸 — 복귀 · 수학시험 (2026-09-10) ----
//
// "선생님들이 내신참여표에서 복귀날짜랑 수학시험날짜 지정할 수 있도록 하자."
// 읽기 계정은 원래 아무것도 못 쓴다(`guardWrites`). 여기 **두 칸만, 담당 반만** 통과시킨다(`passWrite`).
// 담당 반은 앱 규칙 `teaches(cid)` 와 **같은 자료**(teachers.classIds)로 판정한다 — 화면이 열어 줘도 규칙이 막고,
// 규칙이 열어 줘도 화면이 안 열면 못 쓴다. 둘이 같은 답을 내야 한다.
// 다른 칸(시험 기간·학교·비고)은 그대로 팀장 것이다. 시험 기간은 학교 일정에서 오고, 갈리면 사람이 봐야 한다.
// ⚠ 아직 참여표가 없는 학생은 여기서 못 만든다 — 복귀만 있는 반쪽 문서가 생기면 띠도 등원 회차도 엉킨다.
//   팀장이 «학교 일정으로 채우기» 를 누른 뒤에 넣는다.
var EXAM_RO_FIELDS = ["math", "back"];
function myClassIds() {
  var me = S.teachers.filter(function (t) { return t.tid === myTid(); })[0];
  return (me && me.classIds) || [];
}
function canEditExam(cid) { return !S.ro || myClassIds().indexOf(cid) >= 0; }
// 수학시험을 바꾸면 직보가 전날로 따라간다 — 손으로 고쳐둔 직보(전날이 아닌 것)는 놔둔다. 대신 입력(schedFields)과 같은 규칙.
function prepFollow(v, math) {
  if (!math) return (v && v.prep) || "";
  if (v && v.prep && v.math && v.prep !== dayBefore(v.math)) return v.prep;
  return dayBefore(math);
}
async function saveExamRo(cid, sid, patch) {
  if (!canEditExam(cid)) throw new Error(RO_MSG + " (담당 반이 아니다)");
  var v = (S.exams[cid] || {})[sid];
  if (!v) throw new Error("아직 참여표가 없는 학생이다. 팀장이 학교 일정으로 채운 뒤에 넣을 수 있다");

  // passWrite 는 동기 구간만 연다 — saveExam 의 set() 은 첫 await 앞에서 불리므로 그 안에 든다 (toggleMyMark 와 같다)
  return passWrite(function () { return saveExam(cid, sid, data); });
}
// 학교 일정(appConfig/schoolTerms)에 적어둔 값. 대신 입력을 열 때 빈 칸을 이걸로 채운다.
function schedFor(school, grade) {
  var key = String(S.term || "").replace(/[^0-9A-Za-z가-힣]+/g, "_") + "__" + school + "__" + grade;
  return S.schoolTerms[key] || null;
}

// ---- 학교 일정으로 한꺼번에 채우기 ----
//
// 학교 일정은 이 앱에서만 채운다(2026-09-04 결정). 선생님들은 앱에서 참여표를
// **보기만** 하므로, 일정 → 참여표로 옮기는 일도 여기서 해야 한다.
//
// 자동으로 덮지 않는다 — 분반마다 진짜 다를 수 있고, 학생이 맞게 낸 것을
// 지워버리면 되돌릴 방법이 없다. 그래서 «안 낸 사람 채우기» 와
// «다르게 낸 사람 맞추기» 를 나눠 두고 각각 물어본다.
function schedFields(x, sc, keep) {
  return {
    name: x.st.name, school: sc.school, grade: sc.grade,
    start: sc.start, end: sc.end, math: sc.math || "",
    // 직보를 손으로 고쳐둔 사람은 그대로 둔다 (전날이 아니면 일부러 바꾼 것)
    prep: (keep && keep.prep && keep.prep !== dayBefore(keep.math)) ? keep.prep
          : (sc.math ? dayBefore(sc.math) : ""),
    // 복귀는 선생님이 학생별로 정한다. 이미 정해둔 게 있으면 안 건드린다.
    back: (keep && keep.back) || sc.back || "",
    note: (keep && keep.note) || "",
    byTeacher: true, fromSchedule: true,
  };
}
// 안 낸 사람 중 학교 일정이 있는 사람 / 이미 냈는데 일정과 다른 사람
// 안 낸 사람인데 못 채우는 이유도 센다(why) — 상자가 조용히 사라지면 "단추가 없다"로만 보인다(2026-09-07).
function fillTargets(rows) {
  var fillable = [], off = [], why = { noSchool: [], noTerm: [], noStart: [] };
  rows.forEach(function (x) {
    if (!x.school || !x.grade) { if (!x.v) why.noSchool.push(x); return; }
    var sc = schedFor(x.school, x.grade);
    if (!sc) { if (!x.v) why.noTerm.push(x); return; }
    if (!sc.start) { if (!x.v) why.noStart.push(x); return; }
    if (!x.v) { fillable.push({ x: x, s: sc }); return; }
    if (examSig(x.v) !== examSig(sc) || x.v.school !== sc.school || x.v.grade !== sc.grade)
      off.push({ x: x, s: sc });
  });
  return { fillable: fillable, off: off, why: why };
}
async function runFill(list, keepOld, btn, label) {
  if (!list.length) return;
  btn.disabled = true; btn.textContent = "…";
  var n = 0;
  try {
    for (var i = 0; i < list.length; i++) {

      n++;
    }

  } catch (e) {
    renderExams();
    alert("하다 멈췄다 (" + n + "명까지): " + e.message);

function examRows() {
  var out = [];
  activeClasses().forEach(function (c) {
    rosterStudents(c).forEach(function (r) {
      var v = (S.exams[c.id] || {})[r.id] || null;

      out.push({ cls: c, st: r, v: v, grade: grade, school: (v && v.school) || schoolOf(r) || "" });
    });
  });
  return out;
}

// 빈 칸은 방향과 상관없이 **늘 맨 아래** — 안 채운 사람을 찾으려고 정렬하는 게 아니다.
//
// ⚠ 띠와 표가 **같은 목록**을 써야 한다. 따로 걸면 이름은 같은 줄에 있는데
//   날짜 칸이 다른 사람 것이 되어버린다. 그래서 여기서 한 번만 걸고 둘 다 그걸 따라간다.
var EX_SORTS = [
  { key: "name", label: "이름" }, { key: "cls", label: "반" }, { key: "homeroom", label: "담임" },
  { key: "school", label: "학교" }, { key: "start", label: "내신기간" }, { key: "math", label: "수학" },
  { key: "come", label: "등원" },
];
function homeroomOf(st) {
  var p = st.pid ? S.byPid[st.pid] : null;
  return p && p.homeroom ? teacherName(p.homeroom) : "";
}
function examSortRows(rows, monthDays, examMonth) {
  var so = S.exSort;
  if (!so) return rows;
  var keyOf = function (x) {
    var v = x.v;
    if (so.key === "name") return x.st.name || "";
    if (so.key === "cls") return x.cls.name || "";
    if (so.key === "homeroom") return homeroomOf(x.st);
    if (so.key === "school") return (v && v.school) || x.school || "";
    if (so.key === "start") return (v && v.start) || "";     // YYYY-MM-DD 라 글자 순 = 날짜 순
    if (so.key === "math") return (v && v.math) || "";
    if (so.key === "come") {
      if (!v) return "";
      var n = attendCount(x.cls, x.st, v, monthDays, examMonth).come;
      return ("00" + n).slice(-3);                            // 숫자를 글자 순으로 비교하려고
    }
    return "";
  };
  var byName = function (a, b) { return String(a.st.name || "").localeCompare(String(b.st.name || ""), "ko"); };
  return rows.slice().sort(function (a, b) {
    var ka = keyOf(a), kb = keyOf(b);
    if (!ka && !kb) return byName(a, b);
    if (!ka) return 1;            // 빈 칸은 늘 아래
    if (!kb) return -1;
    var c = ka.localeCompare(kb, "ko");
    return (so.dir === "desc" ? -c : c) || byName(a, b);
  });
}

}

function paintMark(d) {
  var f = S.exForm;
  if (f.math && d === f.math) return EXAM_MARKS.math;
  if (f.prep && d === f.prep) return EXAM_MARKS.prep;
  if (f.back && d === f.back) return EXAM_MARKS.back;
  if (S.exAnchor && d === S.exAnchor) return EXAM_MARKS.exam;
  if (f.start && f.end && d >= f.start && d <= f.end) return EXAM_MARKS.exam;
  return null;
}
function paint(d) {
  var f = S.exForm;
  if (S.exMode === "erase") {
    if (f.math === d) f.math = "";
    if (f.prep === d) f.prep = "";
    if (f.back === d) f.back = "";
    if (f.start && f.end && d >= f.start && d <= f.end) { f.start = ""; f.end = ""; }
    S.exAnchor = ""; return;
  }
  if (S.exMode === "exam") {
    if (!S.exAnchor) { S.exAnchor = d; f.start = d; f.end = d; return; }
    f.start = S.exAnchor < d ? S.exAnchor : d;
    f.end = S.exAnchor < d ? d : S.exAnchor;
    S.exAnchor = ""; return;
  }
  var k = S.exMode, was = f[k];
  f[k] = (was === d) ? "" : d;
  // 수학시험을 정하면 직보는 그 전날로 따라간다. 직접 고쳐둔 것은 놔둔다.
  if (k === "math" && (!f.prep || f.prep === dayBefore(was))) f.prep = f.math ? dayBefore(f.math) : "";
}
function bindEntry() {
  var box = $("#ex-entry");
  $$("[data-enp]", box).forEach(function (td) { td.onclick = function () { paint(td.getAttribute("data-enp")); drawEntry(); }; });
  $$("[data-enm]", box).forEach(function (b) { b.onclick = function () { S.exMode = b.getAttribute("data-enm"); S.exAnchor = ""; drawEntry(); }; });
  $$("[data-enmo]", box).forEach(function (b) { b.onclick = function () { S.exMonth = shiftMonth(S.exMonth, Number(b.getAttribute("data-enmo"))); drawEntry(); }; });
  $$("[data-eng]", box).forEach(function (b) { b.onclick = function () { S.exForm.grade = b.getAttribute("data-eng"); drawEntry(); }; });
  $$("[data-end]", box).forEach(function (b) {
    b.onclick = function () {
      var i = Number(b.getAttribute("data-end"));
      var at = S.exDays.indexOf(i);
      if (at >= 0) S.exDays.splice(at, 1); else { S.exDays.push(i); S.exDays.sort(); }
      drawEntry();
    };
  });
  $("#en-school", box).onchange = function () { S.exForm.school = this.value.trim(); };
  $("#en-note", box).onchange = function () { S.exForm.note = this.value; };
  $("#en-x", box).onclick = $("#en-cancel", box).onclick = function () { S.exEntry = null; renderExams(); };
  $("#en-save", box).onclick = async function () {
    var f = S.exForm, err = $("#en-err", box);
    S.exForm.school = $("#en-school", box).value.trim();
    S.exForm.note = $("#en-note", box).value;
    if (!f.school) { err.textContent = "학교를 넣어주세요"; return; }
    if (!f.grade) { err.textContent = "학년을 골라주세요"; return; }
    if (!f.start || !f.end) { err.textContent = "내신 기간을 칠해주세요"; return; }
    if (f.end < f.start) { err.textContent = "종료일이 시작일보다 빠를 수 없어요"; return; }
    this.disabled = true; this.textContent = "저장 중...";
    try {
      var e = S.exEntry;
      await saveExam(e.cid, e.sid, { name: e.st.name, school: f.school, grade: f.grade,
        start: f.start, end: f.end, math: f.math, prep: f.prep, back: f.back,
        note: (f.note || "").trim(), days: S.exDays, byTeacher: true });
      S.exEntry = null; S.exGrade = f.grade;
      renderExams();
    } catch (ex) { this.disabled = false; this.textContent = "저장"; err.textContent = "저장 실패: " + ex.message; }
  };
}

// ---------- 중3 내신관리 — 한 장짜리 HTML 로 굽는다 (2026-09-07) ----------
//
// 학교 일정과 내신 참여표에서 **중3만** 골라, 로그인 없이 그냥 열리는 파일 하나로 굽는다.
// 팀체크 계정이 없는 사람에게 중3 내신만 건네려는 것이다.
//
// ⚠ **규칙은 안 굽는다. 결과만 굽는다.**
//   띠 색·등원 회차·직보 날짜를 여기서 다 계산해서, 파일에는 «무슨 색 칸 · 몇 회» 만 넣는다.
//   파일이 규칙을 들고 있으면 이 앱을 고쳐도 그 파일은 옛 규칙으로 남는다 — 두 벌이 갈리는 자리가 거기다.
//   그래서 구운 파일에는 자바스크립트가 한 줄도 없다.
// ⚠ **구운 순간의 사본이다.** 자료가 바뀌면 다시 굽는다. 그래서 머리에 구운 시각을 크게 적는다.
//   보는 사람이 언제 것인지 모르면 «틀린 표»가 아니라 «믿을 수 없는 표»가 된다.

function mid3Stamp() {
  var d = new Date();
  return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()) + " " +
    pad2(d.getHours()) + ":" + pad2(d.getMinutes());
}
// 화면과 **같은 함수**로 계산한다 (markOf · attendCount · termRows). 여기서 다시 만들면 그때부터 갈린다.
function mid3Build() {
  var rows = examRows().filter(function (x) { return x.grade === "중3"; });
  var startsAll = [], endsAll = [];

//
// 일일 테스트가 아니라 **중간고사·기말고사·모의고사**를 넣는 곳.
// 이건 수업관리 앱에 없는 자료라 이 앱 DB(climath-team)에 둔다 — 앱 규칙을 안 건드린다.

//   testScores/{tid}__{pid}     { tid, pid, name, raw, ach, grade, std, pct, avg, note }
// 나중에 학생·학부모에게 보여주려면 그때 앱 쪽으로 옮긴다. 지금은 팀장이 보는 자료다.

var TEST_KINDS = {
